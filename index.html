<body><a href="#main" class="skip">本文へ移動</a><header class="topbar"><a href="#" class="brand">POTEX <span>LEARNING</span></a><div class="top-actions"><span id="mode">全文公開版</span></div></header>
<div class="layout"><aside class="sidebar"><a class="library-title" href="#">SNSの教科書 <span>学習ライブラリ</span></a><label class="search-label" for="search">教材を検索</label><div class="search-box"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="キーワードを入力" maxlength="100" autocomplete="off"><kbd>/</kbd></div><div class="progress-label"><span>あなたの学習記録</span><strong id="progress-label">0%</strong></div><progress id="progress" value="0" max="100" aria-label="読了率"></progress><p class="storage-note">読了記録はこのブラウザに保存されます</p><details class="mobile-nav" open><summary>教材の目次</summary><nav id="nav" aria-label="教材の目次"></nav></details><div class="sidebar-foot">読む。試す。振り返る。<br><span>自分のペースで、一歩ずつ。</span></div></aside><main id="main" tabindex="-1"><p class="loading" role="status">教材を読み込んでいます…</p></main></div><div id="toast" role="status" aria-live="polite"></div><script>const LOCAL_CONTENT=[{"id": "lesson-01", "title": "はじめに", "group": "はじめに", "headings": [{"id": "lesson-01-s1", "title": "はじめに 〜この教科書の使い方〜", "level": 2}, {"id": "lesson-01-s2", "title": "この教科書は誰のためのものか", "level": 3}, {"id": "lesson-01-s3", "title": "この教科書が書いていないこと", "level": 3}, {"id": "lesson-01-s4", "title": "使い方：教科書・ワークシート・コーチの3つで進める", "level": 3}, {"id": "lesson-01-s5", "title": "全体の流れ：4つのSTEPと11の章", "level": 3}, {"id": "lesson-01-s6", "title": "各章の構成", "level": 3}, {"id": "lesson-01-s7", "title": "時期で変わる情報について", "level": 3}], "html": "\u003ch2 id=\"lesson-01-s1\">はじめに 〜この教科書の使い方〜\u003c/h2>\n\u003ch3 id=\"lesson-01-s2\">この教科書は誰のためのものか\u003c/h3>\n\u003cp>この教科書は、\u003cstrong>「SNSで集客する」と決めたあなた\u003c/strong>のためのものです。\u003c/p>\n\u003cp>ビジネスの集客には、広告、紹介、地域での営業、店舗集客など、たくさんの方法があります。その中から「SNSでやっていく」と決めた。そこからこの教科書はスタートします。まだ迷っている場合は、担当コーチに相談してください。商品や状況によっては、SNS以外の方法が近道のこともあります。\u003c/p>\n\u003cp>この教科書は、\u003cstrong>SNSを本格的に運用したことがない人\u003c/strong>を前提に書いています。一度も発信したことがない人でも、この教科書とワークシートを順番に進めれば、コンテンツ販売で収益化するところまでたどり着けるように作っています。\u003c/p>\n\u003cp>すでに発信している人は、わかっている章は飛ばして構いません。ただし、自己流で進めてきた人ほど、STEP1（第1〜4章）は一度目を通してください。伸び悩みの原因は、テクニックではなく「戦略」が抜けていることがほとんどです。\u003c/p>\n\u003ch3 id=\"lesson-01-s3\">この教科書が書いていないこと\u003c/h3>\n\u003cp>この教科書は「何を、どの順番で、どうやるか」に集中しています。次のことは、あえて厚く書いていません。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>やる気の保ち方・続けるコツ（マインドセット）：\u003c/strong> あなたには毎週話せるコーチがいます。気持ちが落ちたとき、続かないときの立て直しはコーチと一緒に行います。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>事業戦略の深い部分：\u003c/strong> 事業計画や資金計画、SNS以外の集客（広告・地域集客など）は、人によって答えが大きく変わります。必要になったらコーチに相談してください。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>アフィリエイト・PR案件だけで稼ぐ方法：\u003c/strong> この教科書は「コンテンツ販売」（自分の知識や経験を商品にして売ること）を軸にしています。コンテンツ販売はいちばん工程が多いので、これを学べば他の収益化にも応用できます。各媒体の解説には「向いている収益化の方法」も書いているので、手がかりにしてください。\u003c/p>\n\u003ch3 id=\"lesson-01-s4\">使い方：教科書・ワークシート・コーチの3つで進める\u003c/h3>\n\u003cp>この教科書は、コーチングの時間以外に、あなたが自分で読み進めて手を動かすための教材です。次の3つをセットで使います。\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>使うもの\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>役割\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>いつ使うか\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>教科書（このページ）\u003c/p>\u003c/td>\u003ctd>\u003cp>考え方とやり方を学ぶ\u003c/p>\u003c/td>\u003ctd>\u003cp>空いている時間に自分のペースで\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>ワークシート（スプレッドシート）\u003c/p>\u003c/td>\u003ctd>\u003cp>学んだことを書き込んで形にする。進み具合もここで確認\u003c/p>\u003c/td>\u003ctd>\u003cp>各章を読んだらすぐ\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>週30分のコーチング\u003c/p>\u003c/td>\u003ctd>\u003cp>ワークシートを見ながら確認・相談・方向を決める\u003c/p>\u003c/td>\u003ctd>\u003cp>毎週のセッション\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>基本の流れは「教科書を読む → ワークシートに書く → セッションで確認する」の繰り返しです。コーチはワークシートを見てアドバイスするので、\u003cstrong>ワークは必ずシートに書いてからセッションに参加してください。\u003c/strong>\u003c/p>\n\u003cp>迷ったとき、自分では決めきれないときは、無理に一人で結論を出さなくて大丈夫です。ワークシートの「コーチと話したいこと」欄にメモして、次のセッションで相談してください。そのための週30分です。\u003c/p>\n\u003ch3 id=\"lesson-01-s5\">全体の流れ：4つのSTEPと11の章\u003c/h3>\n\u003cp>この教科書は、第0章と次の4STEP・11章で進みます。\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>STEP\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>章\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>このSTEPを終えると\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>準備\u003c/p>\u003c/td>\u003ctd>\u003cp>第0章 続けられる自分から始める\u003c/p>\u003c/td>\u003ctd>\u003cp>自分の現在地と、続けるための土台がわかる\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>STEP1 土台を作る\u003c/p>\u003c/td>\u003ctd>\u003cp>第1章 SNS攻略の全体像／第2章 自己分析／第3章 市場分析・競合分析・投稿スタイル／第4章 アカウント構築\u003c/p>\u003c/td>\u003ctd>\u003cp>戦略が決まり、公開できるアカウントができている\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>STEP2 発信で伸ばす\u003c/p>\u003c/td>\u003ctd>\u003cp>第5章 発信の基礎／第6章 編集ツール／第7章 分析・改善\u003c/p>\u003c/td>\u003ctd>\u003cp>投稿を作って出し、数字を見て自分で直せる\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>STEP3 ファンを集める\u003c/p>\u003c/td>\u003ctd>\u003cp>第8章 ファン化／第9章 リスト化（関所：リスク管理）\u003c/p>\u003c/td>\u003ctd>\u003cp>フォロワーが「濃いファン」になり、公式LINEでつながっている\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>STEP4 価値を届ける\u003c/p>\u003c/td>\u003ctd>\u003cp>第10章 商品設計／第11章 セールス\u003c/p>\u003c/td>\u003ctd>\u003cp>商品を仕上げて、初めての売上を作る\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>その先\u003c/p>\u003c/td>\u003ctd>\u003cp>発展編 収益の多角化\u003c/p>\u003c/td>\u003ctd>\u003cp>アフィリエイト・企業案件など、収入の柱を増やす\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>STEPは順番に進めてください。\u003c/strong> 「早く売りたい」とSTEP1を飛ばしてSTEP4から始めると、ほぼ確実にうまくいきません。土台のないアカウントで商品を案内しても、誰にも届かないからです。順番に進めれば、商品を案内するころには「欲しい」と思ってくれる人がすでに集まっています。\u003c/p>\n\u003cp>各STEPにかかる期間は、使える時間（専業か副業かなど）で大きく変わります。自分のペースはコーチと一緒に決めましょう。\u003c/p>\n\u003ch3 id=\"lesson-01-s6\">各章の構成\u003c/h3>\n\u003cp>すべての章は、同じ順番でできています。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>この章のゴール\u003c/strong>：読み終わったとき、何ができるようになっているか\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>所要時間の目安\u003c/strong>：読む時間とワークの時間。人によって差があるので、あくまで目安です\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>講義\u003c/strong>：考え方と原理。「なぜそうするのか」\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>実践\u003c/strong>：具体的な手順と型。「どうやるのか」\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>ワーク\u003c/strong>：その場で手を動かす課題。ワークシートのどのタブに書くかも書いてあります\u003c/p>\n\u003cp>章を終えたら、ワークシートの「全体マップ・進捗チェック」タブで、その章のチェック項目に印をつけてください。全部に印がついたら、次の章へ進みます。\u003c/p>\n\u003ch3 id=\"lesson-01-s7\">時期で変わる情報について\u003c/h3>\n\u003cp>SNSのアルゴリズム（投稿を誰にどれだけ見せるかを決める仕組み）や機能は、予告なく変わることがあります。そのためこの教科書では、次のように分けています。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>本文：\u003c/strong> 「なぜそうするのか」という、変わりにくい考え方\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>付録「最新情報」：\u003c/strong> 料金、数字の目安、機能の仕様など、時期で変わる情報。定期的に更新し、最終確認日を書いています\u003c/p>\n\u003cp>本文中に「※最新情報を確認」とあるところは、付録もあわせて見てください。わからない言葉が出てきたら、付録「用語集」で調べられます。\u003c/p>\n\u003cp>それでは、第0章から始めましょう。\u003c/p>", "text": "はじめに 〜この教科書の使い方〜\nこの教科書は誰のためのものか\nこの教科書は、「SNSで集客する」と決めたあなたのためのものです。\nビジネスの集客には、広告、紹介、地域での営業、店舗集客など、たくさんの方法があります。その中から「SNSでやっていく」と決めた。そこからこの教科書はスタートします。まだ迷っている場合は、担当コーチに相談してください。商品や状況によっては、SNS以外の方法が近道のこともあります。\nこの教科書は、SNSを本格的に運用したことがない人を前提に書いています。一度も発信したことがない人でも、この教科書とワークシートを順番に進めれば、コンテンツ販売で収益化するところまでたどり着けるように作っています。\nすでに発信している人は、わかっている章は飛ばして構いません。ただし、自己流で進めてきた人ほど、STEP1（第1〜4章）は一度目を通してください。伸び悩みの原因は、テクニックではなく「戦略」が抜けていることがほとんどです。\nこの教科書が書いていないこと\nこの教科書は「何を、どの順番で、どうやるか」に集中しています。次のことは、あえて厚く書いていません。\nやる気の保ち方・続けるコツ（マインドセット）： あなたには毎週話せるコーチがいます。気持ちが落ちたとき、続かないときの立て直しはコーチと一緒に行います。\n事業戦略の深い部分： 事業計画や資金計画、SNS以外の集客（広告・地域集客など）は、人によって答えが大きく変わります。必要になったらコーチに相談してください。\nアフィリエイト・PR案件だけで稼ぐ方法： この教科書は「コンテンツ販売」（自分の知識や経験を商品にして売ること）を軸にしています。コンテンツ販売はいちばん工程が多いので、これを学べば他の収益化にも応用できます。各媒体の解説には「向いている収益化の方法」も書いているので、手がかりにしてください。\n使い方：教科書・ワークシート・コーチの3つで進める\nこの教科書は、コーチングの時間以外に、あなたが自分で読み進めて手を動かすための教材です。次の3つをセットで使います。\n使うもの\n役割\nいつ使うか\n教科書（このページ）\n考え方とやり方を学ぶ\n空いている時間に自分のペースで\nワークシート（スプレッドシート）\n学んだことを書き込んで形にする。進み具合もここで確認\n各章を読んだらすぐ\n週30分のコーチング\nワークシートを見ながら確認・相談・方向を決める\n毎週のセッション\n基本の流れは「教科書を読む → ワークシートに書く → セッションで確認する」の繰り返しです。コーチはワークシートを見てアドバイスするので、ワークは必ずシートに書いてからセッションに参加してください。\n迷ったとき、自分では決めきれないときは、無理に一人で結論を出さなくて大丈夫です。ワークシートの「コーチと話したいこと」欄にメモして、次のセッションで相談してください。そのための週30分です。\n全体の流れ：4つのSTEPと11の章\nこの教科書は、第0章と次の4STEP・11章で進みます。\nSTEP\n章\nこのSTEPを終えると\n準備\n第0章 続けられる自分から始める\n自分の現在地と、続けるための土台がわかる\nSTEP1 土台を作る\n第1章 SNS攻略の全体像／第2章 自己分析／第3章 市場分析・競合分析・投稿スタイル／第4章 アカウント構築\n戦略が決まり、公開できるアカウントができている\nSTEP2 発信で伸ばす\n第5章 発信の基礎／第6章 編集ツール／第7章 分析・改善\n投稿を作って出し、数字を見て自分で直せる\nSTEP3 ファンを集める\n第8章 ファン化／第9章 リスト化（関所：リスク管理）\nフォロワーが「濃いファン」になり、公式LINEでつながっている\nSTEP4 価値を届ける\n第10章 商品設計／第11章 セールス\n商品を仕上げて、初めての売上を作る\nその先\n発展編 収益の多角化\nアフィリエイト・企業案件など、収入の柱を増やす\nSTEPは順番に進めてください。 「早く売りたい」とSTEP1を飛ばしてSTEP4から始めると、ほぼ確実にうまくいきません。土台のないアカウントで商品を案内しても、誰にも届かないからです。順番に進めれば、商品を案内するころには「欲しい」と思ってくれる人がすでに集まっています。\n各STEPにかかる期間は、使える時間（専業か副業かなど）で大きく変わります。自分のペースはコーチと一緒に決めましょう。\n各章の構成\nすべての章は、同じ順番でできています。\nこの章のゴール：読み終わったとき、何ができるようになっているか\n所要時間の目安：読む時間とワークの時間。人によって差があるので、あくまで目安です\n講義：考え方と原理。「なぜそうするのか」\n実践：具体的な手順と型。「どうやるのか」\nワーク：その場で手を動かす課題。ワークシートのどのタブに書くかも書いてあります\n章を終えたら、ワークシートの「全体マップ・進捗チェック」タブで、その章のチェック項目に印をつけてください。全部に印がついたら、次の章へ進みます。\n時期で変わる情報について\nSNSのアルゴリズム（投稿を誰にどれだけ見せるかを決める仕組み）や機能は、予告なく変わることがあります。そのためこの教科書では、次のように分けています。\n本文： 「なぜそうするのか」という、変わりにくい考え方\n付録「最新情報」： 料金、数字の目安、機能の仕様など、時期で変わる情報。定期的に更新し、最終確認日を書いています\n本文中に「※最新情報を確認」とあるところは、付録もあわせて見てください。わからない言葉が出てきたら、付録「用語集」で調べられます。\nそれでは、第0章から始めましょう。", "minutes": 5}, {"id": "lesson-02", "title": "第0章 続けられる自分から始める", "group": "はじめに", "headings": [{"id": "lesson-02-s1", "title": "この章のゴール", "level": 2}, {"id": "lesson-02-s2", "title": "0-1 ノウハウの前に、続く仕組みを作る", "level": 2}, {"id": "lesson-02-s3", "title": "0-2 事前ワーク（初回セッションの前に）", "level": 2}, {"id": "lesson-02-s4", "title": "0-3 初回セッション：毎日の習慣クエストにSNSを入れる", "level": 2}, {"id": "lesson-02-s5", "title": "現在地診断のSNS版（4つの項目）", "level": 3}, {"id": "lesson-02-s6", "title": "第0章 ワーク", "level": 2}], "html": "\u003ch2 id=\"lesson-02-s1\">この章のゴール\u003c/h2>\n\u003cp class=\"list-item\">SNS運用を「やる気」ではなく「仕組み」で続ける理由がわかる\u003c/p>\n\u003cp class=\"list-item\">自分の現在地（使える時間・続かなくなりそうなところ）をコーチと共有できている\u003c/p>\n\u003cp>\u003cstrong>所要時間の目安：\u003c/strong> 読む 10分／ワーク 15〜20分（初回セッションの前に）\u003c/p>\n\u003ch2 id=\"lesson-02-s2\">0-1 ノウハウの前に、続く仕組みを作る\u003c/h2>\n\u003cp>多くのSNS教材は、投稿の型やアルゴリズムの話から始まります。この教科書も第1章からはそこに入りますが、その前に一章だけ時間をください。\u003c/p>\n\u003cp>POTEXはもともと「習慣化」を専門にしてきた会社です。目標を達成するうえでいちばんの壁は、知識でも才能でもなく、\u003cstrong>「決めたことを続けられるか」\u003c/strong>だと考えています。SNS運用はまさにその典型で、どれだけ良い教科書があっても、続かなければ何も起きません。\u003c/p>\n\u003cp>だからこそ、ノウハウの前に「続けられる自分の土台」を作ります。やる気で頑張るのではなく、\u003cstrong>仕組みと伴走で続ける。\u003c/strong> これがPOTEXの考え方です。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>仕組み：\u003c/strong> 目標と生活習慣を言葉にして、やることを日々の行動に落とし込む（この章と第2章）\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>伴走：\u003c/strong> 毎週コーチが進み具合を一緒に見る\u003c/p>\n\u003cp>この2つがそろえば、無理なく続けられます。\u003c/p>\n\u003ch2 id=\"lesson-02-s3\">0-2 事前ワーク（初回セッションの前に）\u003c/h2>\n\u003cp>初回のコーチングの前に、アプリで次のワークを進めておきます。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>現在地診断（Status Checker）\u003c/strong>：7つのセクションで、今の生活・状態を見える形にします。正直に、具体的に書くほど、コーチからの提案があなたに合ったものになります。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>STEP01 Mission Statement（人生の憲法）\u003c/strong>：「何をするか（Doing）」の前に「どうありたいか（Being）」をはっきりさせます。人生の理念や、それぞれの役割での理想の姿に向き合います。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>STEP02 Vision（心から達成したい目標の具体化）\u003c/strong>：制限を外して描く理想（アンリミテッド・ビジョン）と、現実的な期間別のロードマップ、課題の棚卸しを行います。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>STEP03 Planning（日常への接続）\u003c/strong>：習慣にしたい行動、24時間以内にやること、次回セッションまでにやること、行動指針（自分との約束）、POTEX宣言（仮）を作ります。\u003c/p>\n\u003cp>STEP01〜03は、\u003cstrong>初回のコーチングの前に必ず決めておいてください。\u003c/strong> ここで書いたことは、第2章で「SNSに活かせるところ」を探すときに使います。\u003c/p>\n\u003ch2 id=\"lesson-02-s4\">0-3 初回セッション：毎日の習慣クエストにSNSを入れる\u003c/h2>\n\u003cp>初回のコーチングでは、事前ワークの3つ（Mission・Vision・Planning）をもとに、ゴールを深く掘り下げ、毎日の習慣クエストを決めます。\u003c/p>\n\u003cp>SNSを頑張りたい人は、\u003cstrong>この初回セッションで、毎日の習慣クエストにSNSのことも入れます。\u003c/strong> 何をどれくらい入れるかは、コーチがあなたの話を聞きながら一緒に決めます。（例：朝のコーヒーのあとにネタ出し10分、日曜の午前にまとめて撮影）\u003c/p>\n\u003cp>そのときの材料になるのが、次の「現在地診断のSNS版」です。セッションの前にワークシートに書いておき、コーチと話すときに参考にしてください。\u003c/p>\n\u003ch3 id=\"lesson-02-s5\">現在地診断のSNS版（4つの項目）\u003c/h3>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>項目\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>考えること\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>例\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>過去の発信経験\u003c/p>\u003c/td>\u003ctd>\u003cp>これまでSNSで発信したことはあるか。あるなら、どうだったか\u003c/p>\u003c/td>\u003ctd>\u003cp>個人アカウントで投稿したが3か月で止まった\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>使える時間\u003c/p>\u003c/td>\u003ctd>\u003cp>平日・休日に、SNSに実際に使える時間はどれくらいか\u003c/p>\u003c/td>\u003ctd>\u003cp>平日30分、土曜の午前2時間\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>続けるのをじゃましそうなこと\u003c/p>\u003c/td>\u003ctd>\u003cp>どんなときに手が止まりそうか\u003c/p>\u003c/td>\u003ctd>\u003cp>完璧に作りたくなる、数字が伸びないと落ち込む\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>希望する伴走スタイル\u003c/p>\u003c/td>\u003ctd>\u003cp>コーチにどう関わってほしいか\u003c/p>\u003c/td>\u003ctd>\u003cp>しっかり背中を押してほしい、自分で考えたいので問いかけてほしい\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>「続かなくなりそう」と書いたことは、弱点ではありません。コーチが重点的に支えるポイントになります。正直に書いてください。\u003c/p>\n\u003ch2 id=\"lesson-02-s6\">第0章 ワーク\u003c/h2>\n\u003cp>\u003cstrong>書く場所：\u003c/strong> ワークシート「⓪現在地診断」タブ　\u003cstrong>目安：\u003c/strong> 15〜20分\u003c/p>\n\u003cp>アプリの事前ワーク（現在地診断・STEP01〜03）は済んでいる前提です。\u003c/p>\n\u003cp class=\"list-item\">SNSの4項目（過去の発信経験・使える時間・続けるのをじゃましそうなこと・希望する伴走スタイル）に答えて、ワークシートに残す\u003c/p>\n\u003cp class=\"list-item\">初回セッションで、コーチと一緒にSNSの習慣クエストを決める\u003c/p>\n\u003cp>終わったら「全体マップ・進捗チェック」タブで第0章に印をつけて、第1章へ進みましょう。\u003c/p>", "text": "この章のゴール\nSNS運用を「やる気」ではなく「仕組み」で続ける理由がわかる\n自分の現在地（使える時間・続かなくなりそうなところ）をコーチと共有できている\n所要時間の目安： 読む 10分／ワーク 15〜20分（初回セッションの前に）\n0-1 ノウハウの前に、続く仕組みを作る\n多くのSNS教材は、投稿の型やアルゴリズムの話から始まります。この教科書も第1章からはそこに入りますが、その前に一章だけ時間をください。\nPOTEXはもともと「習慣化」を専門にしてきた会社です。目標を達成するうえでいちばんの壁は、知識でも才能でもなく、「決めたことを続けられるか」だと考えています。SNS運用はまさにその典型で、どれだけ良い教科書があっても、続かなければ何も起きません。\nだからこそ、ノウハウの前に「続けられる自分の土台」を作ります。やる気で頑張るのではなく、仕組みと伴走で続ける。 これがPOTEXの考え方です。\n仕組み： 目標と生活習慣を言葉にして、やることを日々の行動に落とし込む（この章と第2章）\n伴走： 毎週コーチが進み具合を一緒に見る\nこの2つがそろえば、無理なく続けられます。\n0-2 事前ワーク（初回セッションの前に）\n初回のコーチングの前に、アプリで次のワークを進めておきます。\n現在地診断（Status Checker）：7つのセクションで、今の生活・状態を見える形にします。正直に、具体的に書くほど、コーチからの提案があなたに合ったものになります。\nSTEP01 Mission Statement（人生の憲法）：「何をするか（Doing）」の前に「どうありたいか（Being）」をはっきりさせます。人生の理念や、それぞれの役割での理想の姿に向き合います。\nSTEP02 Vision（心から達成したい目標の具体化）：制限を外して描く理想（アンリミテッド・ビジョン）と、現実的な期間別のロードマップ、課題の棚卸しを行います。\nSTEP03 Planning（日常への接続）：習慣にしたい行動、24時間以内にやること、次回セッションまでにやること、行動指針（自分との約束）、POTEX宣言（仮）を作ります。\nSTEP01〜03は、初回のコーチングの前に必ず決めておいてください。 ここで書いたことは、第2章で「SNSに活かせるところ」を探すときに使います。\n0-3 初回セッション：毎日の習慣クエストにSNSを入れる\n初回のコーチングでは、事前ワークの3つ（Mission・Vision・Planning）をもとに、ゴールを深く掘り下げ、毎日の習慣クエストを決めます。\nSNSを頑張りたい人は、この初回セッションで、毎日の習慣クエストにSNSのことも入れます。 何をどれくらい入れるかは、コーチがあなたの話を聞きながら一緒に決めます。（例：朝のコーヒーのあとにネタ出し10分、日曜の午前にまとめて撮影）\nそのときの材料になるのが、次の「現在地診断のSNS版」です。セッションの前にワークシートに書いておき、コーチと話すときに参考にしてください。\n現在地診断のSNS版（4つの項目）\n項目\n考えること\n例\n過去の発信経験\nこれまでSNSで発信したことはあるか。あるなら、どうだったか\n個人アカウントで投稿したが3か月で止まった\n使える時間\n平日・休日に、SNSに実際に使える時間はどれくらいか\n平日30分、土曜の午前2時間\n続けるのをじゃましそうなこと\nどんなときに手が止まりそうか\n完璧に作りたくなる、数字が伸びないと落ち込む\n希望する伴走スタイル\nコーチにどう関わってほしいか\nしっかり背中を押してほしい、自分で考えたいので問いかけてほしい\n「続かなくなりそう」と書いたことは、弱点ではありません。コーチが重点的に支えるポイントになります。正直に書いてください。\n第0章 ワーク\n書く場所： ワークシート「⓪現在地診断」タブ　目安： 15〜20分\nアプリの事前ワーク（現在地診断・STEP01〜03）は済んでいる前提です。\nSNSの4項目（過去の発信経験・使える時間・続けるのをじゃましそうなこと・希望する伴走スタイル）に答えて、ワークシートに残す\n初回セッションで、コーチと一緒にSNSの習慣クエストを決める\n終わったら「全体マップ・進捗チェック」タブで第0章に印をつけて、第1章へ進みましょう。", "minutes": 4}, {"id": "lesson-03", "title": "第1章 SNS攻略の全体像", "group": "STEP1 土台を作る", "headings": [{"id": "lesson-03-s1", "title": "この章のゴール", "level": 2}, {"id": "lesson-03-s2", "title": "1-1 講義：SNSで収益が生まれる仕組み", "level": 2}, {"id": "lesson-03-s3", "title": "フォロワー数はお金にならない", "level": 3}, {"id": "lesson-03-s4", "title": "1-2 講義：媒体には「役割」がある", "level": 2}, {"id": "lesson-03-s5", "title": "参考：SNS以外の集客の方法", "level": 3}, {"id": "lesson-03-s6", "title": "1-3 実践：媒体別の特徴と向き不向き", "level": 2}, {"id": "lesson-03-s7", "title": "Instagram【この教科書のメイン媒体】", "level": 3}, {"id": "lesson-03-s8", "title": "TikTok【インスタとは別の層に届ける「露出を広げる媒体」】", "level": 3}, {"id": "lesson-03-s9", "title": "YouTube【いちばん深く伝えられる媒体】", "level": 3}, {"id": "lesson-03-s10", "title": "X【文章力が武器になる拡散の媒体】", "level": 3}, {"id": "lesson-03-s11", "title": "Threads（スレッズ）【インスタと一緒に動かす第2の媒体】", "level": 3}, {"id": "lesson-03-s12", "title": "note【売る場所ではなく「受け皿」】", "level": 3}, {"id": "lesson-03-s13", "title": "LINE（公式LINE）【すべての媒体のゆきつく先】", "level": 3}, {"id": "lesson-03-s14", "title": "媒体×収益化の早見表", "level": 3}, {"id": "lesson-03-s15", "title": "1-4 収益化までのロードマップ", "level": 2}, {"id": "lesson-03-s16", "title": "第1章 ワーク", "level": 2}], "html": "\u003ch2 id=\"lesson-03-s1\">この章のゴール\u003c/h2>\n\u003cp class=\"list-item\">SNSで収益が生まれる仕組みを、自分の言葉で説明できる\u003c/p>\n\u003cp class=\"list-item\">主な7つの媒体（Instagram／TikTok／YouTube／X／Threads／note／LINE）の特徴と役割の違いを説明できる\u003c/p>\n\u003cp class=\"list-item\">自分に合いそうな媒体の当たりがついている\u003c/p>\n\u003cp class=\"list-item\">収益化までの全体の流れが頭に入り、自分が今どこにいるか言える\u003c/p>\n\u003cp>\u003cstrong>所要時間の目安：\u003c/strong> 読む 30分／ワーク 20分\u003c/p>\n\u003ch2 id=\"lesson-03-s2\">1-1 講義：SNSで収益が生まれる仕組み\u003c/h2>\n\u003ch3 id=\"lesson-03-s3\">フォロワー数はお金にならない\u003c/h3>\n\u003cp>まず、初心者の多くが持っている誤解から解きます。\u003cstrong>「フォロワーが増えれば稼げる」は間違いです。\u003c/strong>\u003c/p>\n\u003cp>フォロワー1万人でも収入ゼロの人はたくさんいますし、フォロワー2,000人で大きな売上を作っている人もいます。違いはフォロワーの「数」ではありません。「あなたから買いたい人がどれだけいるか」と、「その人たちに商品を届ける道すじ（導線）があるか」です。\u003c/p>\n\u003cp>SNSで収益が生まれる流れは、どの収益化の方法でも次の4段階です。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>知ってもらう（認知）\u003c/strong>：投稿が見られて、あなたの存在を知ってもらう\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>信頼してもらう（信頼）\u003c/strong>：「この人・この情報は役に立つ」と思ってもらう\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>つながる（リスト化）\u003c/strong>：フォローや公式LINEへの登録で、いつでも情報を届けられる関係になる\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>選んでもらう（購入）\u003c/strong>：「この人にお願いしたい」と、商品やサービスを選んでもらう\u003c/p>\n\u003cp>この教科書の4STEPは、この4段階にそのまま対応しています。STEP1〜2で「知ってもらう」、STEP2〜3で「信頼してもらう・つながる」、STEP4で「選んでもらう」を作ります。\u003c/p>\n\u003ch2 id=\"lesson-03-s4\">1-2 講義：媒体には「役割」がある\u003c/h2>\n\u003cp>もうひとつ大事な原則があります。\u003cstrong>媒体は「どれが一番いいか」ではなく、「どの役割を任せるか」で選びます。\u003c/strong>\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>役割\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>どんな媒体か\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>例\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>知ってもらう（認知）\u003c/p>\u003c/td>\u003ctd>\u003cp>短い動画や投稿が、フォロワー以外の人にもどんどん表示される\u003c/p>\u003c/td>\u003ctd>\u003cp>TikTok、Instagramのリール、X\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>信頼を貯める\u003c/p>\u003c/td>\u003ctd>\u003cp>コンテンツが積み上がり、深く知ってもらえる\u003c/p>\u003c/td>\u003ctd>\u003cp>YouTube、note、Instagramのフィード・ハイライト\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>リストにする\u003c/p>\u003c/td>\u003ctd>\u003cp>登録してくれた人に確実に届き、販売の最後の入り口になる\u003c/p>\u003c/td>\u003ctd>\u003cp>公式LINE、メルマガ\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>全部を同時にやる必要はありません。むしろ、初心者が複数の媒体を同時に始めると、どれも中途半端になりやすいです。\u003c/p>\n\u003cp>\u003cstrong>コンテンツ販売を目指すなら、メインの媒体1つ（＋必要ならサブ1つ）に絞り、最後は公式LINEでつながる。\u003c/strong> これが基本の形です。\u003c/p>\n\u003cp>アフィリエイトやPR案件で収益を得たい人は、公式LINEを経由せず、投稿やストーリーズから直接リンクで案内する形が中心になります。自分に合う形は、コーチと相談して決めてください。\u003c/p>\n\u003ch3 id=\"lesson-03-s5\">参考：SNS以外の集客の方法\u003c/h3>\n\u003cp>この教科書はSNS集客に絞っていますが、それ以外にも次のような選択肢があります。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>Meta広告（Instagram・Facebook広告）：\u003c/strong> お金をかけて表示回数を買う方法です。SNSで反応が良かった投稿を広告にすると、効率よく届けられます。ただし予算管理の知識が必要なので、初心者が最初に手を出すのは難しい方法です。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>地域の集客（店舗・サロン）：\u003c/strong> チラシ、Googleマップ（MEO）、予約サイトなど。店舗ビジネスは、SNSと一緒に使うのが現実的です。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>紹介・口コミ：\u003c/strong> いちばん成約しやすい方法です。SNSが伸びる前の売上は、ここから生まれることも多いです。\u003c/p>\n\u003cp>これらを自分の事業に取り入れるかは、コーチと相談して決めてください。\u003c/p>\n\u003ch2 id=\"lesson-03-s6\">1-3 実践：媒体別の特徴と向き不向き\u003c/h2>\n\u003cp>各媒体を「特徴／向いている人／向いている収益化」の順に説明します。読みながら、自分に合いそうな媒体に印をつけてください。最終的に決めるのは第3章です。\u003c/p>\n\u003cp>※各媒体の機能や収益化の条件は変わることがあります。数字は付録「最新情報」で確認してください。\u003c/p>\n\u003ch3 id=\"lesson-03-s7\">Instagram【この教科書のメイン媒体】\u003c/h3>\n\u003cp class=\"list-item\">\u003cstrong>特徴：\u003c/strong> 商品販売との相性がいちばん良い媒体です。プロフィール→リンク→公式LINEという流れを作りやすく、「知ってもらう」と「信頼を貯める」の両方を担えます。主戦場は\u003cstrong>リール（30秒〜1分程度の縦型動画）\u003c/strong>。フォロワー以外にも届きやすく、作る手間と広がりやすさのバランスが良い形式です。「人」にファンがつきやすく、発信者自身の世界観やストーリーが資産になります。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>向いている人：\u003c/strong> 講座・コーチング・コンサルなど「自分の知識や経験」を売りたい人。店舗・サロン・教室など、映像で魅力が伝わる商売\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>向いている収益化：\u003c/strong> コンテンツ販売／自分のサービスの集客／アフィリエイト／企業のPR案件\u003c/p>\n\u003ch3 id=\"lesson-03-s8\">TikTok【インスタとは別の層に届ける「露出を広げる媒体」】\u003c/h3>\n\u003cp class=\"list-item\">\u003cstrong>特徴：\u003c/strong> Instagramが「人」にファンがつく媒体だとすれば、TikTokは「動画1本1本の面白さ」で評価される媒体です。フォロワーゼロでも最初の1本から大きく広がる可能性があり、知ってもらうスピードはトップクラスです。一方で、見ている人は「あなた」ではなく「動画」を見に来ていることが多く、ファンになってもらう力はInstagramより弱めです。また、TikTokからInstagramへ人を移すのは、実際にはあまりうまくいきません。\u003cstrong>TikTokに取り組む目的は、Instagramとは利用者層が違う人たちに見つけてもらう「露出の拡大」\u003c/strong>だと考えてください。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>向いている人：\u003c/strong> とにかく早く知ってもらいたい人／若い世代向けやエンタメ寄りの発信／Instagram以外にも露出を増やしたい人\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>向いている収益化：\u003c/strong> \u003cstrong>TikTokショップ\u003c/strong>（アプリ内で商品を見つけて、そのまま購入までできる機能）。「動画を見る→気になる→そのまま買う」と流れが短いのが強みです。商品を紹介して売れた分の報酬を受け取る「アフィリエイト」は在庫を持たずに始められるので、入口としておすすめです。ほかにLIVE配信での販売もあります。ただし、参入する人が増えていて、単価は低めの市場です。詳しい始め方は発展編A-5で解説します。\u003c/p>\n\u003ch3 id=\"lesson-03-s9\">YouTube【いちばん深く伝えられる媒体】\u003c/h3>\n\u003cp class=\"list-item\">\u003cstrong>特徴：\u003c/strong> 長い動画でじっくり語れるので、信頼を貯める力は全媒体でいちばんです。高い商品を買う前に「この人なら大丈夫」と思ってもらうのにとても効果があります。ただし、台本・撮影・編集の手間がとても大きく、投稿の頻度が下がりがちです。数字を見て改善する回数も減り、伸び始めるまでに時間がかかります。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>向いている人：\u003c/strong> すでに他の媒体で知られていて、より深く伝えたい段階の人／編集の時間や人手を確保できる人\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>向いている収益化：\u003c/strong> 高い商品を買う前の「学び」の場／動画の広告収入／noteや公式LINEへの案内。広告収入を受け取るには、チャンネル登録者数や再生時間などの条件を満たす必要があります（※条件と単価の目安は最新情報を確認）。\u003c/p>\n\u003ch3 id=\"lesson-03-s10\">X【文章力が武器になる拡散の媒体】\u003c/h3>\n\u003cp class=\"list-item\">\u003cstrong>特徴：\u003c/strong> リポストによる拡散力は今も強力です。ただし匿名の文化で情報が流れるのも速いため、ファンになってもらうまでに時間がかかります。Xだけでコンテンツ販売を成り立たせている人は、今は多くありません。文章だけで完結するので、映像を出したくない人には貴重な選択肢です。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>向いている人：\u003c/strong> 文章が得意な人／noteと組み合わせたい人\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>向いている収益化：\u003c/strong> 数百円〜数千円の安い商品やアフィリエイトを「数で売る」形。拡散力が高い＝リンクを見る人が多いためです。高い商品を売りたい場合は、Xで興味を持ってもらい、YouTubeで深く伝え、公式LINEで販売する流れが現実的です。\u003c/p>\n\u003ch3 id=\"lesson-03-s11\">Threads（スレッズ）【インスタと一緒に動かす第2の媒体】\u003c/h3>\n\u003cp class=\"list-item\">\u003cstrong>特徴：\u003c/strong> Instagramと同じMeta社の文章中心のSNSです。Instagramのアカウントとつながっているので、\u003cstrong>インスタをメインにするならXよりThreadsの方が相性が良い\u003c/strong>です。投稿にリンクを直接貼れるので、アフィリエイトとの相性も良く、実際に収益化の例が増えています。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>向いている人：\u003c/strong> Instagramをメインにする人全員（サブの媒体の第一候補）\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>向いている収益化：\u003c/strong> アフィリエイト／noteとの組み合わせ\u003c/p>\n\u003ch3 id=\"lesson-03-s12\">note【売る場所ではなく「受け皿」】\u003c/h3>\n\u003cp class=\"list-item\">\u003cstrong>特徴：\u003c/strong> 長い文章を書けるサービスです。有料で記事を売ることもできますが、今は「他の媒体や検索から来た人の受け皿」として使うのが主流です。あなたの考えを深く知ってもらう場所で、名刺や実績集の役割をします。またnoteの記事はGoogle検索で上位に出やすく、自分でブログを一から作るよりも、SNSを使っていない人にも届きやすいです。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>向いている人：\u003c/strong> 文章で信頼を積みたい人／無料相談などの入口の商品を持っている人\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>向いている収益化：\u003c/strong> 本命は「信頼の受け皿」としての活用。有料記事は100円から設定できます（※価格帯の目安は最新情報を確認）。\u003c/p>\n\u003ch3 id=\"lesson-03-s13\">LINE（公式LINE）【すべての媒体のゆきつく先】\u003c/h3>\n\u003cp class=\"list-item\">\u003cstrong>特徴：\u003c/strong> SNSというより「リスト（連絡先の名簿）」です。アルゴリズムに左右されず、\u003cstrong>登録してくれた人に確実にメッセージを届けられる場所\u003c/strong>です。コンテンツ販売の成約は、ほとんどがここで生まれます。SNSの投稿はアルゴリズムによって届く人が変わりますが、公式LINEは登録してくれた人に直接届けられます。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>位置づけ：\u003c/strong> どの媒体を選んでも、最終的なゴールはLINEであることがほとんどです。作り方は第9章で扱います。今は「最後はここでつながるんだな」とだけ覚えておいてください。\u003c/p>\n\u003ch3 id=\"lesson-03-s14\">媒体×収益化の早見表\u003c/h3>\n\u003cp>◎＝とても向いている、○＝向いている、△＝向きにくい（コンテンツ販売を軸にした評価）\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>媒体\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>知ってもらう\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>信頼を貯める\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>コンテンツ販売\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>アフィリエイト\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>PR案件\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>初心者へのおすすめ度\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>Instagram\u003c/p>\u003c/td>\u003ctd>\u003cp>◎\u003c/p>\u003c/td>\u003ctd>\u003cp>◎\u003c/p>\u003c/td>\u003ctd>\u003cp>◎\u003c/p>\u003c/td>\u003ctd>\u003cp>○\u003c/p>\u003c/td>\u003ctd>\u003cp>◎\u003c/p>\u003c/td>\u003ctd>\u003cp>★★★\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>TikTok\u003c/p>\u003c/td>\u003ctd>\u003cp>◎\u003c/p>\u003c/td>\u003ctd>\u003cp>△\u003c/p>\u003c/td>\u003ctd>\u003cp>△（露出を広げる役）\u003c/p>\u003c/td>\u003ctd>\u003cp>○（ショップ）\u003c/p>\u003c/td>\u003ctd>\u003cp>○\u003c/p>\u003c/td>\u003ctd>\u003cp>★★★\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>YouTube\u003c/p>\u003c/td>\u003ctd>\u003cp>○\u003c/p>\u003c/td>\u003ctd>\u003cp>◎\u003c/p>\u003c/td>\u003ctd>\u003cp>◎（学びの場）\u003c/p>\u003c/td>\u003ctd>\u003cp>△\u003c/p>\u003c/td>\u003ctd>\u003cp>○\u003c/p>\u003c/td>\u003ctd>\u003cp>★\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>X\u003c/p>\u003c/td>\u003ctd>\u003cp>◎\u003c/p>\u003c/td>\u003ctd>\u003cp>△\u003c/p>\u003c/td>\u003ctd>\u003cp>△（安い商品のみ）\u003c/p>\u003c/td>\u003ctd>\u003cp>◎\u003c/p>\u003c/td>\u003ctd>\u003cp>△\u003c/p>\u003c/td>\u003ctd>\u003cp>★★\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>Threads\u003c/p>\u003c/td>\u003ctd>\u003cp>○\u003c/p>\u003c/td>\u003ctd>\u003cp>○\u003c/p>\u003c/td>\u003ctd>\u003cp>△（案内役）\u003c/p>\u003c/td>\u003ctd>\u003cp>◎\u003c/p>\u003c/td>\u003ctd>\u003cp>△\u003c/p>\u003c/td>\u003ctd>\u003cp>★★（サブ向き）\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>note\u003c/p>\u003c/td>\u003ctd>\u003cp>△\u003c/p>\u003c/td>\u003ctd>\u003cp>◎\u003c/p>\u003c/td>\u003ctd>\u003cp>△（受け皿）\u003c/p>\u003c/td>\u003ctd>\u003cp>△\u003c/p>\u003c/td>\u003ctd>\u003cp>△\u003c/p>\u003c/td>\u003ctd>\u003cp>★（補助）\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>コンテンツ販売のほかにも、アフィリエイト、企業のPR案件、SNS運用代行などの仕事を受ける、物を売る、といった収益化の方法があります。スキルや状況によっては、こちらの方が早く収益になる場合もあるので、気になる人はコーチに相談してください。\u003c/p>\n\u003ch2 id=\"lesson-03-s15\">1-4 収益化までのロードマップ\u003c/h2>\n\u003cp>第2章から学ぶことを、先に1枚の地図にしておきます。迷子になったら、ここに戻ってきてください。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>STEP1 土台を作る\u003c/strong>（←いまここ）\u003c/p>\n\u003cp class=\"list-item\">第1章 SNS攻略の全体像：媒体を知る\u003c/p>\n\u003cp class=\"list-item\">第2章 自己分析：自分にできること・やりたいことを整理する\u003c/p>\n\u003cp class=\"list-item\">第3章 市場分析・競合分析・投稿スタイル：勝てる場所と発信の形を決める\u003c/p>\n\u003cp class=\"list-item\">第4章 アカウント構築：コンセプト・ペルソナ・売るものの仮決め・プロフィールを完成させる\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>STEP2 発信で伸ばす\u003c/strong>\u003c/p>\n\u003cp class=\"list-item\">第5章 発信の基礎：投稿の型を身につけ、発信を習慣にする\u003c/p>\n\u003cp class=\"list-item\">第6章 編集ツール：CapCut・Canvaで自分で作れるようになる\u003c/p>\n\u003cp class=\"list-item\">第7章 分析・改善：数字を見て、自分で直せるようになる\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>STEP3 ファンを集める\u003c/strong>\u003c/p>\n\u003cp class=\"list-item\">第8章 ファン化：フォロワーを「濃いファン」に変える\u003c/p>\n\u003cp class=\"list-item\">第9章 リスト化：公式LINEでつながり、「自分のリスト」を作る（関所：法律・詐欺から身を守る）\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>STEP4 価値を届ける\u003c/strong>\u003c/p>\n\u003cp class=\"list-item\">第10章 商品設計：第4章の仮決めをここで完成させる\u003c/p>\n\u003cp class=\"list-item\">第11章 セールス：販売して、初めての売上を作る\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>ゴール\u003c/strong>：コンテンツ販売で収益化 → 発展編で収入の柱を増やす\u003c/p>\n\u003ch2 id=\"lesson-03-s16\">第1章 ワーク\u003c/h2>\n\u003cp>\u003cstrong>書く場所：\u003c/strong> ワークシート「①媒体選び」タブ　\u003cstrong>目安：\u003c/strong> 20分\u003c/p>\n\u003cp class=\"list-item\">1-3を読んで、自分に合いそうだと感じた媒体を第3候補まで書き出す\u003c/p>\n\u003cp class=\"list-item\">それぞれについて「なぜ合いそうと思ったか」を一言で書く（例：「顔を出せるのでInstagram」「文章が得意なのでX＋note」）\u003c/p>\n\u003cp class=\"list-item\">SNSで最終的に売りたいものを、今のイメージでよいので1行で書く\u003c/p>\n\u003cp>ここでの選択は仮で大丈夫です。第2・3章の分析を経て確定させます。終わったら「全体マップ・進捗チェック」タブで第1章に印をつけてください。\u003c/p>", "text": "この章のゴール\nSNSで収益が生まれる仕組みを、自分の言葉で説明できる\n主な7つの媒体（Instagram／TikTok／YouTube／X／Threads／note／LINE）の特徴と役割の違いを説明できる\n自分に合いそうな媒体の当たりがついている\n収益化までの全体の流れが頭に入り、自分が今どこにいるか言える\n所要時間の目安： 読む 30分／ワーク 20分\n1-1 講義：SNSで収益が生まれる仕組み\nフォロワー数はお金にならない\nまず、初心者の多くが持っている誤解から解きます。「フォロワーが増えれば稼げる」は間違いです。\nフォロワー1万人でも収入ゼロの人はたくさんいますし、フォロワー2,000人で大きな売上を作っている人もいます。違いはフォロワーの「数」ではありません。「あなたから買いたい人がどれだけいるか」と、「その人たちに商品を届ける道すじ（導線）があるか」です。\nSNSで収益が生まれる流れは、どの収益化の方法でも次の4段階です。\n知ってもらう（認知）：投稿が見られて、あなたの存在を知ってもらう\n信頼してもらう（信頼）：「この人・この情報は役に立つ」と思ってもらう\nつながる（リスト化）：フォローや公式LINEへの登録で、いつでも情報を届けられる関係になる\n選んでもらう（購入）：「この人にお願いしたい」と、商品やサービスを選んでもらう\nこの教科書の4STEPは、この4段階にそのまま対応しています。STEP1〜2で「知ってもらう」、STEP2〜3で「信頼してもらう・つながる」、STEP4で「選んでもらう」を作ります。\n1-2 講義：媒体には「役割」がある\nもうひとつ大事な原則があります。媒体は「どれが一番いいか」ではなく、「どの役割を任せるか」で選びます。\n役割\nどんな媒体か\n例\n知ってもらう（認知）\n短い動画や投稿が、フォロワー以外の人にもどんどん表示される\nTikTok、Instagramのリール、X\n信頼を貯める\nコンテンツが積み上がり、深く知ってもらえる\nYouTube、note、Instagramのフィード・ハイライト\nリストにする\n登録してくれた人に確実に届き、販売の最後の入り口になる\n公式LINE、メルマガ\n全部を同時にやる必要はありません。むしろ、初心者が複数の媒体を同時に始めると、どれも中途半端になりやすいです。\nコンテンツ販売を目指すなら、メインの媒体1つ（＋必要ならサブ1つ）に絞り、最後は公式LINEでつながる。 これが基本の形です。\nアフィリエイトやPR案件で収益を得たい人は、公式LINEを経由せず、投稿やストーリーズから直接リンクで案内する形が中心になります。自分に合う形は、コーチと相談して決めてください。\n参考：SNS以外の集客の方法\nこの教科書はSNS集客に絞っていますが、それ以外にも次のような選択肢があります。\nMeta広告（Instagram・Facebook広告）： お金をかけて表示回数を買う方法です。SNSで反応が良かった投稿を広告にすると、効率よく届けられます。ただし予算管理の知識が必要なので、初心者が最初に手を出すのは難しい方法です。\n地域の集客（店舗・サロン）： チラシ、Googleマップ（MEO）、予約サイトなど。店舗ビジネスは、SNSと一緒に使うのが現実的です。\n紹介・口コミ： いちばん成約しやすい方法です。SNSが伸びる前の売上は、ここから生まれることも多いです。\nこれらを自分の事業に取り入れるかは、コーチと相談して決めてください。\n1-3 実践：媒体別の特徴と向き不向き\n各媒体を「特徴／向いている人／向いている収益化」の順に説明します。読みながら、自分に合いそうな媒体に印をつけてください。最終的に決めるのは第3章です。\n※各媒体の機能や収益化の条件は変わることがあります。数字は付録「最新情報」で確認してください。\nInstagram【この教科書のメイン媒体】\n特徴： 商品販売との相性がいちばん良い媒体です。プロフィール→リンク→公式LINEという流れを作りやすく、「知ってもらう」と「信頼を貯める」の両方を担えます。主戦場はリール（30秒〜1分程度の縦型動画）。フォロワー以外にも届きやすく、作る手間と広がりやすさのバランスが良い形式です。「人」にファンがつきやすく、発信者自身の世界観やストーリーが資産になります。\n向いている人： 講座・コーチング・コンサルなど「自分の知識や経験」を売りたい人。店舗・サロン・教室など、映像で魅力が伝わる商売\n向いている収益化： コンテンツ販売／自分のサービスの集客／アフィリエイト／企業のPR案件\nTikTok【インスタとは別の層に届ける「露出を広げる媒体」】\n特徴： Instagramが「人」にファンがつく媒体だとすれば、TikTokは「動画1本1本の面白さ」で評価される媒体です。フォロワーゼロでも最初の1本から大きく広がる可能性があり、知ってもらうスピードはトップクラスです。一方で、見ている人は「あなた」ではなく「動画」を見に来ていることが多く、ファンになってもらう力はInstagramより弱めです。また、TikTokからInstagramへ人を移すのは、実際にはあまりうまくいきません。TikTokに取り組む目的は、Instagramとは利用者層が違う人たちに見つけてもらう「露出の拡大」だと考えてください。\n向いている人： とにかく早く知ってもらいたい人／若い世代向けやエンタメ寄りの発信／Instagram以外にも露出を増やしたい人\n向いている収益化： TikTokショップ（アプリ内で商品を見つけて、そのまま購入までできる機能）。「動画を見る→気になる→そのまま買う」と流れが短いのが強みです。商品を紹介して売れた分の報酬を受け取る「アフィリエイト」は在庫を持たずに始められるので、入口としておすすめです。ほかにLIVE配信での販売もあります。ただし、参入する人が増えていて、単価は低めの市場です。詳しい始め方は発展編A-5で解説します。\nYouTube【いちばん深く伝えられる媒体】\n特徴： 長い動画でじっくり語れるので、信頼を貯める力は全媒体でいちばんです。高い商品を買う前に「この人なら大丈夫」と思ってもらうのにとても効果があります。ただし、台本・撮影・編集の手間がとても大きく、投稿の頻度が下がりがちです。数字を見て改善する回数も減り、伸び始めるまでに時間がかかります。\n向いている人： すでに他の媒体で知られていて、より深く伝えたい段階の人／編集の時間や人手を確保できる人\n向いている収益化： 高い商品を買う前の「学び」の場／動画の広告収入／noteや公式LINEへの案内。広告収入を受け取るには、チャンネル登録者数や再生時間などの条件を満たす必要があります（※条件と単価の目安は最新情報を確認）。\nX【文章力が武器になる拡散の媒体】\n特徴： リポストによる拡散力は今も強力です。ただし匿名の文化で情報が流れるのも速いため、ファンになってもらうまでに時間がかかります。Xだけでコンテンツ販売を成り立たせている人は、今は多くありません。文章だけで完結するので、映像を出したくない人には貴重な選択肢です。\n向いている人： 文章が得意な人／noteと組み合わせたい人\n向いている収益化： 数百円〜数千円の安い商品やアフィリエイトを「数で売る」形。拡散力が高い＝リンクを見る人が多いためです。高い商品を売りたい場合は、Xで興味を持ってもらい、YouTubeで深く伝え、公式LINEで販売する流れが現実的です。\nThreads（スレッズ）【インスタと一緒に動かす第2の媒体】\n特徴： Instagramと同じMeta社の文章中心のSNSです。Instagramのアカウントとつながっているので、インスタをメインにするならXよりThreadsの方が相性が良いです。投稿にリンクを直接貼れるので、アフィリエイトとの相性も良く、実際に収益化の例が増えています。\n向いている人： Instagramをメインにする人全員（サブの媒体の第一候補）\n向いている収益化： アフィリエイト／noteとの組み合わせ\nnote【売る場所ではなく「受け皿」】\n特徴： 長い文章を書けるサービスです。有料で記事を売ることもできますが、今は「他の媒体や検索から来た人の受け皿」として使うのが主流です。あなたの考えを深く知ってもらう場所で、名刺や実績集の役割をします。またnoteの記事はGoogle検索で上位に出やすく、自分でブログを一から作るよりも、SNSを使っていない人にも届きやすいです。\n向いている人： 文章で信頼を積みたい人／無料相談などの入口の商品を持っている人\n向いている収益化： 本命は「信頼の受け皿」としての活用。有料記事は100円から設定できます（※価格帯の目安は最新情報を確認）。\nLINE（公式LINE）【すべての媒体のゆきつく先】\n特徴： SNSというより「リスト（連絡先の名簿）」です。アルゴリズムに左右されず、登録してくれた人に確実にメッセージを届けられる場所です。コンテンツ販売の成約は、ほとんどがここで生まれます。SNSの投稿はアルゴリズムによって届く人が変わりますが、公式LINEは登録してくれた人に直接届けられます。\n位置づけ： どの媒体を選んでも、最終的なゴールはLINEであることがほとんどです。作り方は第9章で扱います。今は「最後はここでつながるんだな」とだけ覚えておいてください。\n媒体×収益化の早見表\n◎＝とても向いている、○＝向いている、△＝向きにくい（コンテンツ販売を軸にした評価）\n媒体\n知ってもらう\n信頼を貯める\nコンテンツ販売\nアフィリエイト\nPR案件\n初心者へのおすすめ度\nInstagram\n◎\n◎\n◎\n○\n◎\n★★★\nTikTok\n◎\n△\n△（露出を広げる役）\n○（ショップ）\n○\n★★★\nYouTube\n○\n◎\n◎（学びの場）\n△\n○\n★\nX\n◎\n△\n△（安い商品のみ）\n◎\n△\n★★\nThreads\n○\n○\n△（案内役）\n◎\n△\n★★（サブ向き）\nnote\n△\n◎\n△（受け皿）\n△\n△\n★（補助）\nコンテンツ販売のほかにも、アフィリエイト、企業のPR案件、SNS運用代行などの仕事を受ける、物を売る、といった収益化の方法があります。スキルや状況によっては、こちらの方が早く収益になる場合もあるので、気になる人はコーチに相談してください。\n1-4 収益化までのロードマップ\n第2章から学ぶことを、先に1枚の地図にしておきます。迷子になったら、ここに戻ってきてください。\nSTEP1 土台を作る（←いまここ）\n第1章 SNS攻略の全体像：媒体を知る\n第2章 自己分析：自分にできること・やりたいことを整理する\n第3章 市場分析・競合分析・投稿スタイル：勝てる場所と発信の形を決める\n第4章 アカウント構築：コンセプト・ペルソナ・売るものの仮決め・プロフィールを完成させる\nSTEP2 発信で伸ばす\n第5章 発信の基礎：投稿の型を身につけ、発信を習慣にする\n第6章 編集ツール：CapCut・Canvaで自分で作れるようになる\n第7章 分析・改善：数字を見て、自分で直せるようになる\nSTEP3 ファンを集める\n第8章 ファン化：フォロワーを「濃いファン」に変える\n第9章 リスト化：公式LINEでつながり、「自分のリスト」を作る（関所：法律・詐欺から身を守る）\nSTEP4 価値を届ける\n第10章 商品設計：第4章の仮決めをここで完成させる\n第11章 セールス：販売して、初めての売上を作る\nゴール：コンテンツ販売で収益化 → 発展編で収入の柱を増やす\n第1章 ワーク\n書く場所： ワークシート「①媒体選び」タブ　目安： 20分\n1-3を読んで、自分に合いそうだと感じた媒体を第3候補まで書き出す\nそれぞれについて「なぜ合いそうと思ったか」を一言で書く（例：「顔を出せるのでInstagram」「文章が得意なのでX＋note」）\nSNSで最終的に売りたいものを、今のイメージでよいので1行で書く\nここでの選択は仮で大丈夫です。第2・3章の分析を経て確定させます。終わったら「全体マップ・進捗チェック」タブで第1章に印をつけてください。", "minutes": 10}, {"id": "lesson-04", "title": "第2章 自己分析", "group": "STEP1 土台を作る", "headings": [{"id": "lesson-04-s1", "title": "この章のゴール", "level": 2}, {"id": "lesson-04-s2", "title": "2-1 講義：戦略とは「3つの円の重なり」を見つけること", "level": 2}, {"id": "lesson-04-s3", "title": "2-2 実践：ゴールナビから、SNSに活かせるものを見つける", "level": 2}, {"id": "lesson-04-s4", "title": "まず：SNSは、ゴールナビのどこに役立つか", "level": 3}, {"id": "lesson-04-s5", "title": "次に：SNSのヒントになりそうなところを拾う", "level": 3}, {"id": "lesson-04-s6", "title": "2-3 実践：SNSに必要な4つのことを書き出す", "level": 2}, {"id": "lesson-04-s7", "title": "2-4 売りたいものがまだ「ふわふわ」している人へ", "level": 2}, {"id": "lesson-04-s8", "title": "第2章 ワーク", "level": 2}], "html": "\u003ch2 id=\"lesson-04-s1\">この章のゴール\u003c/h2>\n\u003cp class=\"list-item\">SNSがゴールナビのどこに役立つかを言え、SNSに活かせるところ（発信の軸・ストーリーの素材・やらないことなど）がわかっている\u003c/p>\n\u003cp class=\"list-item\">SNSに使える時間、撮影環境、SNSで実現したいこと、自分の強みを言葉にできている\u003c/p>\n\u003cp>\u003cstrong>所要時間の目安：\u003c/strong> 読む 20分／ワーク 60〜90分\u003c/p>\n\u003ch2 id=\"lesson-04-s2\">2-1 講義：戦略とは「3つの円の重なり」を見つけること\u003c/h2>\n\u003cp>伸びないアカウントには共通点があります。編集もきれいで話も上手いのに、\u003cstrong>「誰に何を届けたいのかがわからない」\u003c/strong>のです。逆に、戦略が固まっているアカウントは、投稿が多少粗くても伸びます。見る人が「これは自分のための発信だ」とわかるからです。\u003c/p>\n\u003cp>戦略を考えるときの土台になるのが、\u003cstrong>3C分析\u003c/strong>という考え方です。\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>3つのC\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>考えること\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>この教科書で扱う章\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>自分\u003c/p>\u003c/td>\u003ctd>\u003cp>経験・実績、使える時間、撮影環境、やりたいこと\u003c/p>\u003c/td>\u003ctd>\u003cp>第2章（この章）\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>市場（見る人）\u003c/p>\u003c/td>\u003ctd>\u003cp>その発信を求めている人が十分にいるか\u003c/p>\u003c/td>\u003ctd>\u003cp>第3章\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>競合\u003c/p>\u003c/td>\u003ctd>\u003cp>すでに伸びているアカウントはどう戦っていて、自分はどう違いを出すか\u003c/p>\u003c/td>\u003ctd>\u003cp>第3章\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>この3つが重なるところが、あなたの「勝てる場所」です。やりたいけど求める人がいない、求める人はいるけどライバルが強すぎる、勝てそうだけど自分が続けられない——どれもよくある失敗です。\u003c/p>\n\u003cp>第2章と第3章で、「自分 → 市場 → 競合 → 投稿スタイルの決定」の順に進めます。この3つの分析ができれば、アカウントづくり（第4章）に進めます。\u003c/p>\n\u003ch2 id=\"lesson-04-s3\">2-2 実践：ゴールナビから、SNSに活かせるものを見つける\u003c/h2>\n\u003cp>あなたはすでに、事前ワークでゴールナビ（Mission・Vision・Planning）を書いています。SNSの自己分析は、ここから始めます。\u003c/p>\n\u003cp>ただし、ゴールナビは「人生全体」の目標です。SNSの目標とそのまま同じになるとは限りません。\u003cstrong>無理にSNSの言葉に置き換えず、SNSに活かせそうなものを拾うつもりで見返してください。\u003c/strong>\u003c/p>\n\u003ch3 id=\"lesson-04-s4\">まず：SNSは、ゴールナビのどこに役立つか\u003c/h3>\n\u003cp>SNSは、ゴールナビに書いた理想に近づくための「手段のひとつ」です。最初に、次の問いに答えてみましょう。\u003c/p>\n\u003cp>SNSは、あなたのゴールナビ（Mission・Vision）のどこに役立ちますか？\u003c/p>\n\u003cp>例：\u003c/p>\n\u003cp class=\"list-item\">長期の目標「場所に縛られない働き方」を実現するための、収入の柱のひとつとして\u003c/p>\n\u003cp class=\"list-item\">人生の理念「同じ悩みを持つ人の力になる」を届ける場所として\u003c/p>\n\u003cp class=\"list-item\">今の仕事の集客を安定させて、家族との時間を増やすために\u003c/p>\n\u003cp>ここがはっきりすると、「何のために発信するのか」がぶれにくくなります。\u003c/p>\n\u003ch3 id=\"lesson-04-s5\">次に：SNSのヒントになりそうなところを拾う\u003c/h3>\n\u003cp>ゴールナビの中には、SNSに活かせるヒントが隠れていることがあります。次の表を参考に見返してください。\u003cstrong>SNSとつながらない項目は、飛ばして大丈夫です。\u003c/strong>\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>ゴールナビの項目\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>SNSに活かせるかもしれないこと\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>Mission：人生の理念（存在意義）\u003c/p>\u003c/td>\u003ctd>\u003cp>発信の軸。プロフィールで掲げる一言のもとになる\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>Mission：これまでの人生の頂点と谷\u003c/p>\u003c/td>\u003ctd>\u003cp>「谷→頂点」の体験は、自己紹介やストーリーの投稿の素材になる。「谷にいたころの自分」はペルソナ候補（第4章）\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>Mission：お葬式で称賛されたい在り方／各役割での理想像\u003c/p>\u003c/td>\u003ctd>\u003cp>発信者として、フォロワーにどんな人だと思われたいか\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>Mission：尊敬する人・憧れる人\u003c/p>\u003c/td>\u003ctd>\u003cp>SNSでお手本にする人を選ぶときの参考（第3章）\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>Mission：成果のためでも絶対にやりたくないこと\u003c/p>\u003c/td>\u003ctd>\u003cp>発信でやらないこと、受けない仕事の基準（例：効果を盛らない、家族の顔は出さない）\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>Mission：このままだと後悔しそうなこと\u003c/p>\u003c/td>\u003ctd>\u003cp>発信の手が止まりそうなときに読み返す言葉\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>Vision：アンリミテッド・ビジョン／ロードマップ\u003c/p>\u003c/td>\u003ctd>\u003cp>SNSがどの時期の目標に役立つか。SNSの数字の目標は、ここをもとにコーチと決める\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>Vision：課題の棚卸し\u003c/p>\u003c/td>\u003ctd>\u003cp>SNSを進めるうえでの課題と対策（例：編集の時間が取れない → 週末にまとめて撮影）\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>Planning：習慣化項目／行動指針\u003c/p>\u003c/td>\u003ctd>\u003cp>第0章で決めたSNSの習慣クエストとそろえる\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>Planning：POTEX宣言（仮）\u003c/p>\u003c/td>\u003ctd>\u003cp>第4章で作るSNS宣言のもとになる\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>書けないところや、つながりがわからないところがあっても問題ありません。セッションでコーチと一緒に考えます。\u003c/p>\n\u003ch2 id=\"lesson-04-s6\">2-3 実践：SNSに必要な4つのことを書き出す\u003c/h2>\n\u003cp>ゴールナビに加えて、SNS運用に必要な4つを言葉にします。\u003c/p>\n\u003cp>\u003cstrong>① SNSに使える時間\u003c/strong>\u003c/p>\n\u003cp class=\"list-item\">平日1日あたり何分、休日1日あたり何分使えるか\u003c/p>\n\u003cp class=\"list-item\">まとまった時間が取れる曜日と時間帯はいつか\u003c/p>\n\u003cp class=\"list-item\">この時間が、投稿できる本数の上限を決めます。多めに見積もると計画倒れになるので、正直に書いてください\u003c/p>\n\u003cp>\u003cstrong>② 撮影環境\u003c/strong>\u003c/p>\n\u003cp class=\"list-item\">自宅で撮影できるか（生活感・家族・音の問題はないか）\u003c/p>\n\u003cp class=\"list-item\">自宅以外に撮影できる場所はあるか（職場・カフェ・屋外）\u003c/p>\n\u003cp class=\"list-item\">売る商品によっては、職場での撮影が必要になることもあります（施術や教室など）。勤め先のルールも確認してください\u003c/p>\n\u003cp>\u003cstrong>③ SNSを通して実現したいこと（目的）\u003c/strong>\u003c/p>\n\u003cp class=\"list-item\">収入の目標だけでなく、「何のために」を書く（例：場所に縛られない働き方をしたい、本業の集客を安定させたい、同じ悩みの人を助けたい）\u003c/p>\n\u003cp class=\"list-item\">ゴールナビの理想の姿とつながっているかを確認する。つながっていない場合は、SNSの方向性がずれているサインです。コーチに相談してください\u003c/p>\n\u003cp>\u003cstrong>④ 自分の棚卸し（強み・経験・ストーリー）\u003c/strong>\u003c/p>\n\u003cp class=\"list-item\">実績になること（仕事の経験、資格、成果、続けてきたこと）\u003c/p>\n\u003cp class=\"list-item\">悩んで乗り越えたこと（過去の自分＝これから発信を届ける相手の候補）\u003c/p>\n\u003cp class=\"list-item\">人からよく頼られること・ほめられること\u003c/p>\n\u003ch2 id=\"lesson-04-s7\">2-4 売りたいものがまだ「ふわふわ」している人へ\u003c/h2>\n\u003cp>焦らなくて大丈夫です。よくあるのは、2-3の④自分の棚卸しから「自分の強みや経験そのものを売る」方向が見えてくるパターンです。\u003c/p>\n\u003cp class=\"list-item\">資格の勉強と仕事を両立した経験 → 社会人の勉強法を発信\u003c/p>\n\u003cp class=\"list-item\">子育てと仕事を両立した経験 → 時短家事や働き方を発信\u003c/p>\n\u003cp>棚卸しを書き切ってから、コーチと一緒に方向性を話すのがいちばんの近道です。ここで決めきれなくても、第3章のジャンルワークで絞り込めます。\u003c/p>\n\u003ch2 id=\"lesson-04-s8\">第2章 ワーク\u003c/h2>\n\u003cp>\u003cstrong>書く場所：\u003c/strong> ワークシート「②ゴールナビ×SNS」タブ　\u003cstrong>目安：\u003c/strong> 60〜90分\u003c/p>\n\u003cp class=\"list-item\">アプリからゴールナビの中身を書き写し、「SNSはゴールナビのどこに役立つか」と、SNSに活かせそうなところを書く（2-2）\u003c/p>\n\u003cp class=\"list-item\">SNSに必要な4つ（使える時間・撮影環境・実現したいこと・自分の棚卸し）を書く（2-3）\u003c/p>\n\u003cp class=\"list-item\">「腹落ち度（1〜10）」と「コーチと話したいこと」を書く\u003c/p>\n\u003cp>腹落ち度が低くても次に進んで大丈夫です。セッションで深めましょう。\u003c/p>", "text": "この章のゴール\nSNSがゴールナビのどこに役立つかを言え、SNSに活かせるところ（発信の軸・ストーリーの素材・やらないことなど）がわかっている\nSNSに使える時間、撮影環境、SNSで実現したいこと、自分の強みを言葉にできている\n所要時間の目安： 読む 20分／ワーク 60〜90分\n2-1 講義：戦略とは「3つの円の重なり」を見つけること\n伸びないアカウントには共通点があります。編集もきれいで話も上手いのに、「誰に何を届けたいのかがわからない」のです。逆に、戦略が固まっているアカウントは、投稿が多少粗くても伸びます。見る人が「これは自分のための発信だ」とわかるからです。\n戦略を考えるときの土台になるのが、3C分析という考え方です。\n3つのC\n考えること\nこの教科書で扱う章\n自分\n経験・実績、使える時間、撮影環境、やりたいこと\n第2章（この章）\n市場（見る人）\nその発信を求めている人が十分にいるか\n第3章\n競合\nすでに伸びているアカウントはどう戦っていて、自分はどう違いを出すか\n第3章\nこの3つが重なるところが、あなたの「勝てる場所」です。やりたいけど求める人がいない、求める人はいるけどライバルが強すぎる、勝てそうだけど自分が続けられない——どれもよくある失敗です。\n第2章と第3章で、「自分 → 市場 → 競合 → 投稿スタイルの決定」の順に進めます。この3つの分析ができれば、アカウントづくり（第4章）に進めます。\n2-2 実践：ゴールナビから、SNSに活かせるものを見つける\nあなたはすでに、事前ワークでゴールナビ（Mission・Vision・Planning）を書いています。SNSの自己分析は、ここから始めます。\nただし、ゴールナビは「人生全体」の目標です。SNSの目標とそのまま同じになるとは限りません。無理にSNSの言葉に置き換えず、SNSに活かせそうなものを拾うつもりで見返してください。\nまず：SNSは、ゴールナビのどこに役立つか\nSNSは、ゴールナビに書いた理想に近づくための「手段のひとつ」です。最初に、次の問いに答えてみましょう。\nSNSは、あなたのゴールナビ（Mission・Vision）のどこに役立ちますか？\n例：\n長期の目標「場所に縛られない働き方」を実現するための、収入の柱のひとつとして\n人生の理念「同じ悩みを持つ人の力になる」を届ける場所として\n今の仕事の集客を安定させて、家族との時間を増やすために\nここがはっきりすると、「何のために発信するのか」がぶれにくくなります。\n次に：SNSのヒントになりそうなところを拾う\nゴールナビの中には、SNSに活かせるヒントが隠れていることがあります。次の表を参考に見返してください。SNSとつながらない項目は、飛ばして大丈夫です。\nゴールナビの項目\nSNSに活かせるかもしれないこと\nMission：人生の理念（存在意義）\n発信の軸。プロフィールで掲げる一言のもとになる\nMission：これまでの人生の頂点と谷\n「谷→頂点」の体験は、自己紹介やストーリーの投稿の素材になる。「谷にいたころの自分」はペルソナ候補（第4章）\nMission：お葬式で称賛されたい在り方／各役割での理想像\n発信者として、フォロワーにどんな人だと思われたいか\nMission：尊敬する人・憧れる人\nSNSでお手本にする人を選ぶときの参考（第3章）\nMission：成果のためでも絶対にやりたくないこと\n発信でやらないこと、受けない仕事の基準（例：効果を盛らない、家族の顔は出さない）\nMission：このままだと後悔しそうなこと\n発信の手が止まりそうなときに読み返す言葉\nVision：アンリミテッド・ビジョン／ロードマップ\nSNSがどの時期の目標に役立つか。SNSの数字の目標は、ここをもとにコーチと決める\nVision：課題の棚卸し\nSNSを進めるうえでの課題と対策（例：編集の時間が取れない → 週末にまとめて撮影）\nPlanning：習慣化項目／行動指針\n第0章で決めたSNSの習慣クエストとそろえる\nPlanning：POTEX宣言（仮）\n第4章で作るSNS宣言のもとになる\n書けないところや、つながりがわからないところがあっても問題ありません。セッションでコーチと一緒に考えます。\n2-3 実践：SNSに必要な4つのことを書き出す\nゴールナビに加えて、SNS運用に必要な4つを言葉にします。\n① SNSに使える時間\n平日1日あたり何分、休日1日あたり何分使えるか\nまとまった時間が取れる曜日と時間帯はいつか\nこの時間が、投稿できる本数の上限を決めます。多めに見積もると計画倒れになるので、正直に書いてください\n② 撮影環境\n自宅で撮影できるか（生活感・家族・音の問題はないか）\n自宅以外に撮影できる場所はあるか（職場・カフェ・屋外）\n売る商品によっては、職場での撮影が必要になることもあります（施術や教室など）。勤め先のルールも確認してください\n③ SNSを通して実現したいこと（目的）\n収入の目標だけでなく、「何のために」を書く（例：場所に縛られない働き方をしたい、本業の集客を安定させたい、同じ悩みの人を助けたい）\nゴールナビの理想の姿とつながっているかを確認する。つながっていない場合は、SNSの方向性がずれているサインです。コーチに相談してください\n④ 自分の棚卸し（強み・経験・ストーリー）\n実績になること（仕事の経験、資格、成果、続けてきたこと）\n悩んで乗り越えたこと（過去の自分＝これから発信を届ける相手の候補）\n人からよく頼られること・ほめられること\n2-4 売りたいものがまだ「ふわふわ」している人へ\n焦らなくて大丈夫です。よくあるのは、2-3の④自分の棚卸しから「自分の強みや経験そのものを売る」方向が見えてくるパターンです。\n資格の勉強と仕事を両立した経験 → 社会人の勉強法を発信\n子育てと仕事を両立した経験 → 時短家事や働き方を発信\n棚卸しを書き切ってから、コーチと一緒に方向性を話すのがいちばんの近道です。ここで決めきれなくても、第3章のジャンルワークで絞り込めます。\n第2章 ワーク\n書く場所： ワークシート「②ゴールナビ×SNS」タブ　目安： 60〜90分\nアプリからゴールナビの中身を書き写し、「SNSはゴールナビのどこに役立つか」と、SNSに活かせそうなところを書く（2-2）\nSNSに必要な4つ（使える時間・撮影環境・実現したいこと・自分の棚卸し）を書く（2-3）\n「腹落ち度（1〜10）」と「コーチと話したいこと」を書く\n腹落ち度が低くても次に進んで大丈夫です。セッションで深めましょう。", "minutes": 6}, {"id": "lesson-05", "title": "第3章 市場分析・競合分析・投稿スタイル", "group": "STEP1 土台を作る", "headings": [{"id": "lesson-05-s1", "title": "この章のゴール", "level": 2}, {"id": "lesson-05-s2", "title": "3-1 実践：市場分析（求めている人はいるか）", "level": 2}, {"id": "lesson-05-s3", "title": "「悩みの深さ×お金を払う気持ち」でジャンルを見る", "level": 3}, {"id": "lesson-05-s4", "title": "3-2 実践：競合分析（お手本アカウント10個を集める）", "level": 2}, {"id": "lesson-05-s5", "title": "個人アカウントを選ぶ条件（目安）", "level": 3}, {"id": "lesson-05-s6", "title": "探し方", "level": 3}, {"id": "lesson-05-s7", "title": "ベンチマークを「分解」する", "level": 3}, {"id": "lesson-05-s8", "title": "3-3 モデリングの考え方：TTPS（徹底的にパクって進化させる）", "level": 2}, {"id": "lesson-05-s9", "title": "3-4 実践：投稿スタイルを決める", "level": 2}, {"id": "lesson-05-s10", "title": "大きく2つ：「情報で届ける」か「自分で届ける」か", "level": 3}, {"id": "lesson-05-s11", "title": "スタイルを絞り込む3つのチェック", "level": 3}, {"id": "lesson-05-s12", "title": "スタイルには「流行り」がある", "level": 3}, {"id": "lesson-05-s13", "title": "3-5 決定：方向性を一文にする", "level": 2}, {"id": "lesson-05-s14", "title": "第3章 ワーク", "level": 2}], "html": "\u003ch2 id=\"lesson-05-s1\">この章のゴール\u003c/h2>\n\u003cp class=\"list-item\">選んだジャンルに「求めている人がいる」ことを確認できている\u003c/p>\n\u003cp class=\"list-item\">お手本にするアカウント（ベンチマーク）を10個集め、分解できている\u003c/p>\n\u003cp class=\"list-item\">投稿スタイル（情報で届けるか、自分で届けるか）が、コーチと合意のうえで決まっている\u003c/p>\n\u003cp class=\"list-item\">「私は〇〇で、〇〇に向けて、〇〇を、〇〇で発信する」という方向性の一文が書けている\u003c/p>\n\u003cp>\u003cstrong>所要時間の目安：\u003c/strong> 読む 40分／ワーク 3〜4時間（数日に分けてOK）\u003c/p>\n\u003ch2 id=\"lesson-05-s2\">3-1 実践：市場分析（求めている人はいるか）\u003c/h2>\n\u003cp>自分がやりたくて、ライバルのすきまがあっても、\u003cstrong>そこに悩んでいる人がいなければビジネスになりません。\u003c/strong> 次の3つで確かめます。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>伸びているアカウントがあるか：\u003c/strong> 同じジャンルにフォロワー1万人を超えるアカウントがいくつもあれば、求める人はいます。探しても伸びているアカウントが1つもないジャンルは要注意です。「ライバルがいない」のではなく、「求める人がいない」可能性が高いからです。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>悩みが検索されているか：\u003c/strong> Yahoo!知恵袋、Googleの検索候補（検索窓に入力すると出てくる言葉）、ハッシュタグの投稿数で、そのジャンルの悩みがどれだけ語られているかを見ます。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>お金が動いているか：\u003c/strong> そのジャンルで、講座・本・サービスなどが実際に売られているかを見ます。競合分析（3-2）で調べる「何で収益を得ていそうか」も参考になります。\u003c/p>\n\u003ch3 id=\"lesson-05-s3\">「悩みの深さ×お金を払う気持ち」でジャンルを見る\u003c/h3>\n\u003cp>求める人がいても、その「質」はジャンルによって違います。目安として、\u003cstrong>「夜眠れないほど悩む」「急いでいる」「自分では解決できない」悩みほど、商品が売れます。\u003c/strong>\u003c/p>\n\u003cp class=\"list-item\">商品が売れやすいジャンルの例：美容、健康、ダイエット、お金、キャリア、子育て、恋愛、受験、英語、AI、副業、SNS運用、動画編集、コーチング\u003c/p>\n\u003cp class=\"list-item\">趣味や娯楽のジャンル：フォロワーは増えやすい一方で、商品の値段は上げにくい傾向があります。その場合は、PR案件やアフィリエイトの方が向いています（第1章の早見表を参照）\u003c/p>\n\u003cp>※ジャンルがまだ決まっていない人は、先に付録「ジャンル選定ワーク」を進めてから、この章に戻ってきてください。\u003c/p>\n\u003ch2 id=\"lesson-05-s4\">3-2 実践：競合分析（お手本アカウント10個を集める）\u003c/h2>\n\u003cp>自分のジャンル（またはやりたい方向）で、参考にするアカウント（ベンチマーク）を\u003cstrong>10個\u003c/strong>集めます。\u003c/p>\n\u003cp>\u003cstrong>注意：\u003c/strong> 初心者は、自分がふだん見ているアカウントの投稿の仕方しか頭にないことがよくあります。探し始める前に、3-4「投稿スタイルを決める」にざっと目を通しておいてください。選択肢を知らないまま探すと、視野が狭いまま方向が固まってしまいます。\u003c/p>\n\u003ch3 id=\"lesson-05-s5\">個人アカウントを選ぶ条件（目安）\u003c/h3>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>条件\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>目安\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>理由\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>フォロワー数\u003c/p>\u003c/td>\u003ctd>\u003cp>1,000人以上（1万人以上ならなお良い）\u003c/p>\u003c/td>\u003ctd>\u003cp>まねできる「伸びる型」を持っている可能性が高い\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>運用期間\u003c/p>\u003c/td>\u003ctd>\u003cp>開設して1〜2年\u003c/p>\u003c/td>\u003ctd>\u003cp>昔のアルゴリズムではなく、今の仕組みで伸びている\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>この条件は、できるだけ\u003cstrong>短い期間で、今の仕組みのなかで伸びたアカウント\u003c/strong>を見つけるためのものです。多少外れていても構いません。アカウントを始めた日は、Instagramのプロフィール右上の「…」→「このアカウントについて」で確認できます（※画面の表示は変わることがあります）。\u003c/p>\n\u003cp>\u003cstrong>企業・店舗のアカウントは選び方が変わります。\u003c/strong> 店舗・サロン・企業のアカウントには、フォロワーが少なくても予約や売上にしっかりつなげている上手なアカウントがあります。企業・店舗を目指す場合は、フォロワー数より「プロフィールから予約や購入までの流れが上手いか」で選んでください。好例は付録「参考アカウント」に追加していきます。\u003c/p>\n\u003ch3 id=\"lesson-05-s6\">探し方\u003c/h3>\n\u003cp class=\"list-item\">自分のジャンルの言葉で、発見タブや検索を使う（例：「時短レシピ」「宅建 勉強」「骨格診断」）\u003c/p>\n\u003cp class=\"list-item\">出てきた投稿のうち、再生数やいいねが多いものを投稿した人を見に行く\u003c/p>\n\u003cp class=\"list-item\">条件に合えばワークシートに記録。そのアカウントのフォロー欄や「おすすめ」欄から、芋づる式に探す\u003c/p>\n\u003cp class=\"list-item\">10個たまるまで繰り返す\u003c/p>\n\u003ch3 id=\"lesson-05-s7\">ベンチマークを「分解」する\u003c/h3>\n\u003cp>集めた10個を、次の項目にそって分解します。\u003c/p>\n\u003cp class=\"list-item\">アカウント名／URL／フォロワー数／投稿数／運用期間\u003c/p>\n\u003cp class=\"list-item\">プロフィール文の要約\u003c/p>\n\u003cp class=\"list-item\">コンセプト（誰に何を届けているかを、自分の言葉で一文に）と投稿スタイル（3-4で説明します）\u003c/p>\n\u003cp class=\"list-item\">伸びている投稿TOP3と、その共通点（冒頭の形・テーマ・長さ）\u003c/p>\n\u003cp class=\"list-item\">直近10本の平均再生数\u003c/p>\n\u003cp class=\"list-item\">プロフィールのリンクの行き先（公式LINE？ネットショップ？note？）と、何で収益を得ていそうか\u003c/p>\n\u003cp class=\"list-item\">ハイライトに何を置いているか（第4章・第8章で使います）\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>★合う度（1〜5）：\u003c/strong> 自分はこのスタイルをやりたいか・できそうか\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>★自分ならメモ：\u003c/strong> 「自分ならここを変える」「ここは自分にはできなさそう」\u003c/p>\n\u003cp>最後に「合う度4以上のアカウント（＝お手本）」「伸びているアカウントの共通点3つ」「自分が勝てそうなすきま」をまとめます。\u003c/p>\n\u003ch2 id=\"lesson-05-s8\">3-3 モデリングの考え方：TTPS（徹底的にパクって進化させる）\u003c/h2>\n\u003cp>リサーチした投稿を参考にするときに、知っておいてほしい考え方があります。\u003c/p>\n\u003cp>伸びる投稿は、「冒頭（フック）→ 展開 → オチ」がひとつのまとまりとして作られています。冒頭だけまねて中身が別物だと、見る人は違和感を持って離れていきます。\u003c/p>\n\u003cp>なので最初のうちは、\u003cstrong>伸びている投稿を分解して、自分の投稿の参考にする\u003c/strong>のがおすすめです。丸ごとコピーするのではなく、「構成を参考にして、中身は自分で作る」。文章や映像そのものをそのまま使うのは、信頼を失うだけでなく規約違反にもなるのでやめましょう。\u003c/p>\n\u003cp>投稿を1本まるごと分解する方法は、第5章で実際にリールを作るときに扱います。この章では、ベンチマークの「伸びている投稿TOP3の共通点」をつかむところまでで大丈夫です。\u003c/p>\n\u003ch2 id=\"lesson-05-s9\">3-4 実践：投稿スタイルを決める\u003c/h2>\n\u003cp>戦略づくりの最後は、「どんなスタイルで発信するか」です。ここは\u003cstrong>一人で決めず、必ずコーチと一緒に決めてください。\u003c/strong> スタイル選びを間違えると、続かない・伸びない・売れないの三重苦になります。\u003c/p>\n\u003ch3 id=\"lesson-05-s10\">大きく2つ：「情報で届ける」か「自分で届ける」か\u003c/h3>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>A. 情報で届ける\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>B. 自分で届ける\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>どんな発信か\u003c/p>\u003c/td>\u003ctd>\u003cp>レシピ、ライフハック、勉強法、節約術など。「情報そのもの」にファンがつく\u003c/p>\u003c/td>\u003ctd>\u003cp>日常や仕事の裏側を見せるVlog、カメラに向かって語るトークリールなど。「あなた自身」にファンがつく\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>良いところ\u003c/p>\u003c/td>\u003ctd>\u003cp>顔を出さなくても成り立つ／ネタが尽きにくい／伸び方を再現しやすい／人に任せやすい\u003c/p>\u003c/td>\u003ctd>\u003cp>他の人に置き換えられない（「あなたから買いたい」が生まれる）／コーチングや講座など高い商品につながりやすい\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>注意点\u003c/p>\u003c/td>\u003ctd>\u003cp>発信者が置き換えられやすい（同じ情報なら誰でもいい）／高い商品につなげるには信頼づくりが別に必要\u003c/p>\u003c/td>\u003ctd>\u003cp>顔出しや話すことが基本／人柄の好みが分かれる／最初は伸びが遅いことがある\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>向いている人\u003c/p>\u003c/td>\u003ctd>\u003cp>顔出しに抵抗がある／コツコツ積み上げるのが得意／アフィリエイトや手頃な商品を数で売りたい\u003c/p>\u003c/td>\u003ctd>\u003cp>自分の経験や人柄を武器にしたい／コーチング・コンサル・講座を売りたい\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>コーチング・コンサル・講座のような商品を目指す人は、\u003cstrong>Bのトークリールと相性が良い傾向\u003c/strong>があります。ただし「絶対」ではありません。商品・性格・環境によってはAが合う人もいます。だからこそコーチと一緒に決めます。\u003c/p>\n\u003ch3 id=\"lesson-05-s11\">スタイルを絞り込む3つのチェック\u003c/h3>\n\u003cp>第2章で書いた撮影環境とあわせて、次の3つに○×をつけてください。\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>チェック\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>○なら\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>×なら\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>① 顔を出せるか\u003c/p>\u003c/td>\u003ctd>\u003cp>トークリール・Vlogが選べる\u003c/p>\u003c/td>\u003ctd>\u003cp>情報型、または顔を出さないVlog（手元・風景・後ろ姿）\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>② 自分の声を使えるか\u003c/p>\u003c/td>\u003ctd>\u003cp>ナレーションやトークができる\u003c/p>\u003c/td>\u003ctd>\u003cp>文字＋BGM、またはAI音声\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>③ 自宅で撮影できるか\u003c/p>\u003c/td>\u003ctd>\u003cp>日常のVlogができる\u003c/p>\u003c/td>\u003ctd>\u003cp>外・職場・スタジオで撮るか、撮影のいらない形式\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"lesson-05-s12\">スタイルには「流行り」がある\u003c/h3>\n\u003cp>投稿スタイルには流行りがあります（※今の流行りは付録「最新情報」を確認）。大事なのは次の2つです。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>流行りのスタイルは「追い風」として使う。\u003c/strong> 伸びやすい反面、始める人も多いので、乗るなら早めに、中身で自分らしさを出す\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>スタイルはリサーチとセットで決める。\u003c/strong> 「この人みたいになりたい」というアカウントがあるなら、その人のスタイルを分解してまねるのがいちばんの近道です\u003c/p>\n\u003ch2 id=\"lesson-05-s13\">3-5 決定：方向性を一文にする\u003c/h2>\n\u003cp>ここまでの分析（自己分析・市場分析・競合分析・スタイル）を、次の形の一文にまとめます。\u003c/p>\n\u003cp>私は【メインの媒体】で、【誰に】向けて、【テーマ】を、【スタイル】で発信し、最終的に【届けたい商品（仮）】につなげる。\u003c/p>\n\u003cp>例：「私はInstagramで、子育てと仕事の両立に悩む30代のワーキングマザーに向けて、10分でできる時短家事と働き方の考え方を、顔出しのトークリールで発信し、最終的に時間管理のコーチングにつなげる。」\u003c/p>\n\u003cp>この一文が、あなたの戦略の背骨になります。\u003cstrong>コーチとのセッションで合意してから\u003c/strong>、第4章へ進んでください。\u003c/p>\n\u003ch2 id=\"lesson-05-s14\">第3章 ワーク\u003c/h2>\n\u003cp>\u003cstrong>書く場所と目安\u003c/strong>\u003c/p>\n\u003cp class=\"list-item\">「③市場・競合分析」タブ：ベンチマーク10個を分解し、合う度と「自分ならメモ」まで埋める（2〜3時間）\u003c/p>\n\u003cp class=\"list-item\">同じタブの「市場の確認」欄に、3-1の3つの確認の結果を書く（30分〜1時間）\u003c/p>\n\u003cp class=\"list-item\">3つのチェックと方向性の一文を書き、セッションでコーチと合意する（30分）\u003c/p>\n\u003cp>一度にやろうとせず、数日に分けて進めて構いません。\u003c/p>", "text": "この章のゴール\n選んだジャンルに「求めている人がいる」ことを確認できている\nお手本にするアカウント（ベンチマーク）を10個集め、分解できている\n投稿スタイル（情報で届けるか、自分で届けるか）が、コーチと合意のうえで決まっている\n「私は〇〇で、〇〇に向けて、〇〇を、〇〇で発信する」という方向性の一文が書けている\n所要時間の目安： 読む 40分／ワーク 3〜4時間（数日に分けてOK）\n3-1 実践：市場分析（求めている人はいるか）\n自分がやりたくて、ライバルのすきまがあっても、そこに悩んでいる人がいなければビジネスになりません。 次の3つで確かめます。\n伸びているアカウントがあるか： 同じジャンルにフォロワー1万人を超えるアカウントがいくつもあれば、求める人はいます。探しても伸びているアカウントが1つもないジャンルは要注意です。「ライバルがいない」のではなく、「求める人がいない」可能性が高いからです。\n悩みが検索されているか： Yahoo!知恵袋、Googleの検索候補（検索窓に入力すると出てくる言葉）、ハッシュタグの投稿数で、そのジャンルの悩みがどれだけ語られているかを見ます。\nお金が動いているか： そのジャンルで、講座・本・サービスなどが実際に売られているかを見ます。競合分析（3-2）で調べる「何で収益を得ていそうか」も参考になります。\n「悩みの深さ×お金を払う気持ち」でジャンルを見る\n求める人がいても、その「質」はジャンルによって違います。目安として、「夜眠れないほど悩む」「急いでいる」「自分では解決できない」悩みほど、商品が売れます。\n商品が売れやすいジャンルの例：美容、健康、ダイエット、お金、キャリア、子育て、恋愛、受験、英語、AI、副業、SNS運用、動画編集、コーチング\n趣味や娯楽のジャンル：フォロワーは増えやすい一方で、商品の値段は上げにくい傾向があります。その場合は、PR案件やアフィリエイトの方が向いています（第1章の早見表を参照）\n※ジャンルがまだ決まっていない人は、先に付録「ジャンル選定ワーク」を進めてから、この章に戻ってきてください。\n3-2 実践：競合分析（お手本アカウント10個を集める）\n自分のジャンル（またはやりたい方向）で、参考にするアカウント（ベンチマーク）を10個集めます。\n注意： 初心者は、自分がふだん見ているアカウントの投稿の仕方しか頭にないことがよくあります。探し始める前に、3-4「投稿スタイルを決める」にざっと目を通しておいてください。選択肢を知らないまま探すと、視野が狭いまま方向が固まってしまいます。\n個人アカウントを選ぶ条件（目安）\n条件\n目安\n理由\nフォロワー数\n1,000人以上（1万人以上ならなお良い）\nまねできる「伸びる型」を持っている可能性が高い\n運用期間\n開設して1〜2年\n昔のアルゴリズムではなく、今の仕組みで伸びている\nこの条件は、できるだけ短い期間で、今の仕組みのなかで伸びたアカウントを見つけるためのものです。多少外れていても構いません。アカウントを始めた日は、Instagramのプロフィール右上の「…」→「このアカウントについて」で確認できます（※画面の表示は変わることがあります）。\n企業・店舗のアカウントは選び方が変わります。 店舗・サロン・企業のアカウントには、フォロワーが少なくても予約や売上にしっかりつなげている上手なアカウントがあります。企業・店舗を目指す場合は、フォロワー数より「プロフィールから予約や購入までの流れが上手いか」で選んでください。好例は付録「参考アカウント」に追加していきます。\n探し方\n自分のジャンルの言葉で、発見タブや検索を使う（例：「時短レシピ」「宅建 勉強」「骨格診断」）\n出てきた投稿のうち、再生数やいいねが多いものを投稿した人を見に行く\n条件に合えばワークシートに記録。そのアカウントのフォロー欄や「おすすめ」欄から、芋づる式に探す\n10個たまるまで繰り返す\nベンチマークを「分解」する\n集めた10個を、次の項目にそって分解します。\nアカウント名／URL／フォロワー数／投稿数／運用期間\nプロフィール文の要約\nコンセプト（誰に何を届けているかを、自分の言葉で一文に）と投稿スタイル（3-4で説明します）\n伸びている投稿TOP3と、その共通点（冒頭の形・テーマ・長さ）\n直近10本の平均再生数\nプロフィールのリンクの行き先（公式LINE？ネットショップ？note？）と、何で収益を得ていそうか\nハイライトに何を置いているか（第4章・第8章で使います）\n★合う度（1〜5）： 自分はこのスタイルをやりたいか・できそうか\n★自分ならメモ： 「自分ならここを変える」「ここは自分にはできなさそう」\n最後に「合う度4以上のアカウント（＝お手本）」「伸びているアカウントの共通点3つ」「自分が勝てそうなすきま」をまとめます。\n3-3 モデリングの考え方：TTPS（徹底的にパクって進化させる）\nリサーチした投稿を参考にするときに、知っておいてほしい考え方があります。\n伸びる投稿は、「冒頭（フック）→ 展開 → オチ」がひとつのまとまりとして作られています。冒頭だけまねて中身が別物だと、見る人は違和感を持って離れていきます。\nなので最初のうちは、伸びている投稿を分解して、自分の投稿の参考にするのがおすすめです。丸ごとコピーするのではなく、「構成を参考にして、中身は自分で作る」。文章や映像そのものをそのまま使うのは、信頼を失うだけでなく規約違反にもなるのでやめましょう。\n投稿を1本まるごと分解する方法は、第5章で実際にリールを作るときに扱います。この章では、ベンチマークの「伸びている投稿TOP3の共通点」をつかむところまでで大丈夫です。\n3-4 実践：投稿スタイルを決める\n戦略づくりの最後は、「どんなスタイルで発信するか」です。ここは一人で決めず、必ずコーチと一緒に決めてください。 スタイル選びを間違えると、続かない・伸びない・売れないの三重苦になります。\n大きく2つ：「情報で届ける」か「自分で届ける」か\n\nA. 情報で届ける\nB. 自分で届ける\nどんな発信か\nレシピ、ライフハック、勉強法、節約術など。「情報そのもの」にファンがつく\n日常や仕事の裏側を見せるVlog、カメラに向かって語るトークリールなど。「あなた自身」にファンがつく\n良いところ\n顔を出さなくても成り立つ／ネタが尽きにくい／伸び方を再現しやすい／人に任せやすい\n他の人に置き換えられない（「あなたから買いたい」が生まれる）／コーチングや講座など高い商品につながりやすい\n注意点\n発信者が置き換えられやすい（同じ情報なら誰でもいい）／高い商品につなげるには信頼づくりが別に必要\n顔出しや話すことが基本／人柄の好みが分かれる／最初は伸びが遅いことがある\n向いている人\n顔出しに抵抗がある／コツコツ積み上げるのが得意／アフィリエイトや手頃な商品を数で売りたい\n自分の経験や人柄を武器にしたい／コーチング・コンサル・講座を売りたい\nコーチング・コンサル・講座のような商品を目指す人は、Bのトークリールと相性が良い傾向があります。ただし「絶対」ではありません。商品・性格・環境によってはAが合う人もいます。だからこそコーチと一緒に決めます。\nスタイルを絞り込む3つのチェック\n第2章で書いた撮影環境とあわせて、次の3つに○×をつけてください。\nチェック\n○なら\n×なら\n① 顔を出せるか\nトークリール・Vlogが選べる\n情報型、または顔を出さないVlog（手元・風景・後ろ姿）\n② 自分の声を使えるか\nナレーションやトークができる\n文字＋BGM、またはAI音声\n③ 自宅で撮影できるか\n日常のVlogができる\n外・職場・スタジオで撮るか、撮影のいらない形式\nスタイルには「流行り」がある\n投稿スタイルには流行りがあります（※今の流行りは付録「最新情報」を確認）。大事なのは次の2つです。\n流行りのスタイルは「追い風」として使う。 伸びやすい反面、始める人も多いので、乗るなら早めに、中身で自分らしさを出す\nスタイルはリサーチとセットで決める。 「この人みたいになりたい」というアカウントがあるなら、その人のスタイルを分解してまねるのがいちばんの近道です\n3-5 決定：方向性を一文にする\nここまでの分析（自己分析・市場分析・競合分析・スタイル）を、次の形の一文にまとめます。\n私は【メインの媒体】で、【誰に】向けて、【テーマ】を、【スタイル】で発信し、最終的に【届けたい商品（仮）】につなげる。\n例：「私はInstagramで、子育てと仕事の両立に悩む30代のワーキングマザーに向けて、10分でできる時短家事と働き方の考え方を、顔出しのトークリールで発信し、最終的に時間管理のコーチングにつなげる。」\nこの一文が、あなたの戦略の背骨になります。コーチとのセッションで合意してから、第4章へ進んでください。\n第3章 ワーク\n書く場所と目安\n「③市場・競合分析」タブ：ベンチマーク10個を分解し、合う度と「自分ならメモ」まで埋める（2〜3時間）\n同じタブの「市場の確認」欄に、3-1の3つの確認の結果を書く（30分〜1時間）\n3つのチェックと方向性の一文を書き、セッションでコーチと合意する（30分）\n一度にやろうとせず、数日に分けて進めて構いません。", "minutes": 8}, {"id": "lesson-06", "title": "第4章 アカウント構築", "group": "STEP1 土台を作る", "headings": [{"id": "lesson-06-s1", "title": "この章のゴール", "level": 2}, {"id": "lesson-06-s2", "title": "4-1 講義：アカウントは「お店」である", "level": 2}, {"id": "lesson-06-s3", "title": "4-2 実践：コンセプトを決める", "level": 2}, {"id": "lesson-06-s4", "title": "4-3 実践：ペルソナを設計する（5人、顔が浮かぶか）", "level": 2}, {"id": "lesson-06-s5", "title": "4-4 実践：届ける商品を仮決めする", "level": 2}, {"id": "lesson-06-s6", "title": "あなたはどちらのタイプか", "level": 3}, {"id": "lesson-06-s7", "title": "どこまで考えておくと進めやすいか（目安）", "level": 3}, {"id": "lesson-06-s8", "title": "商品の検討に2週間以上かけない", "level": 3}, {"id": "lesson-06-s9", "title": "商品の構想を一行にする", "level": 3}, {"id": "lesson-06-s10", "title": "コンセプトと商品が決まったら「SNS宣言」を書く", "level": 3}, {"id": "lesson-06-s11", "title": "4-5 実践：プロフィールを作る（Instagram）", "level": 2}, {"id": "lesson-06-s12", "title": "プロフィールは「3秒で判断される」", "level": 3}, {"id": "lesson-06-s13", "title": "名前（ユーザーネームと表示名）", "level": 3}, {"id": "lesson-06-s14", "title": "アイコン", "level": 3}, {"id": "lesson-06-s15", "title": "プロフィール文（4行で作る）", "level": 3}, {"id": "lesson-06-s16", "title": "ハイライト：作るのはファン化の段階で", "level": 3}, {"id": "lesson-06-s17", "title": "プロフィールのリンク：最初は貼らなくてOK", "level": 3}, {"id": "lesson-06-s18", "title": "4-6 公開前の最終チェック", "level": 2}, {"id": "lesson-06-s19", "title": "第4章 ワーク", "level": 2}], "html": "\u003ch2 id=\"lesson-06-s1\">この章のゴール\u003c/h2>\n\u003cp class=\"list-item\">コンセプトを一文で言え、ペルソナ（発信を届けたい相手）5人の顔が浮かぶ\u003c/p>\n\u003cp class=\"list-item\">「何を届けるか」の仮決めができている（仕上げは第10章）\u003c/p>\n\u003cp class=\"list-item\">Instagramのプロフィール（名前・アイコン・プロフィール文）が完成し、公開できる\u003c/p>\n\u003cp>\u003cstrong>所要時間の目安：\u003c/strong> 読む 40分／ワーク 3〜5時間\u003c/p>\n\u003ch2 id=\"lesson-06-s2\">4-1 講義：アカウントは「お店」である\u003c/h2>\n\u003cp>アカウントづくりを、お店づくりにたとえます。\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>アカウント\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>お店にたとえると\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>コンセプト\u003c/p>\u003c/td>\u003ctd>\u003cp>何屋さんか（看板に書くこと）\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>商品（仮）\u003c/p>\u003c/td>\u003ctd>\u003cp>何を売るお店か\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>プロフィール\u003c/p>\u003c/td>\u003ctd>\u003cp>お店の外観。通りかかった人が3秒で「入るか・通り過ぎるか」を決める\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>投稿（第5章〜）\u003c/p>\u003c/td>\u003ctd>\u003cp>チラシ配り\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>チラシがどれだけ良くても、来た人がお店の外観を見て「何屋かわからない」と帰ってしまえば、すべて無駄になります。\u003cstrong>投稿を始める前に、お店を完成させる。\u003c/strong> それがこの章です。\u003c/p>\n\u003cp>「商品は第10章で作るのに、なぜ今考えるの？」と思うかもしれません。理由は、\u003cstrong>届けるものが決まっていないと、プロフィールも投稿も逆算できないから\u003c/strong>です。同じワーキングマザー向けのアカウントでも、時短家事の講座を届けるのか、キャリア相談を届けるのかで、発信の中身は変わります。ただし、今の段階で商品を作り込む必要はありません。どこまでやれば十分かは4-4で説明します。\u003c/p>\n\u003cp>この章は、ペルソナ → コンセプト → 商品の仮決め → プロフィールの順にワークを進めます。説明はコンセプトから始めますが、ワークはペルソナから手をつけてください。\u003c/p>\n\u003ch2 id=\"lesson-06-s3\">4-2 実践：コンセプトを決める\u003c/h2>\n\u003cp>コンセプトは、次の一文で言える状態がゴールです。\u003c/p>\n\u003cp>「誰の」「どんな悩みを」「どう解決する」アカウントか\u003c/p>\n\u003cp>例：\u003c/p>\n\u003cp class=\"list-item\">30代ワーキングマザーの「時間がない」を、1日10分の時短家事で解決するアカウント\u003c/p>\n\u003cp class=\"list-item\">宅建に3回落ちた社会人の「勉強が続かない」を、朝30分の学習法で解決するアカウント\u003c/p>\n\u003cp class=\"list-item\">開業3年目までの美容室オーナーの「新規のお客さんが来ない」を、Instagram集客で解決するアカウント\u003c/p>\n\u003cp>第3章で書いた「方向性の一文」から、誰・何・どうを取り出して磨きます。確認するのは次の3つです。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>具体的か：\u003c/strong> 「みんな」「女性」では広すぎます。「30代・都内・時短勤務のワーキングマザー」まで絞るほど、刺さります\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>競合と並べて埋もれないか：\u003c/strong> 第3章で集めた10個のコンセプトと並べて、あなただけの違いがあるか。違いは「相手を絞る」「方法を絞る」「実績や肩書きをかけ合わせる」のどれかで作れます\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>ペルソナが読んだら「私のことだ」と思うか：\u003c/strong> 次のペルソナ設計とセットで確かめます\u003c/p>\n\u003ch2 id=\"lesson-06-s4\">4-3 実践：ペルソナを設計する（5人、顔が浮かぶか）\u003c/h2>\n\u003cp>ペルソナとは、発信を届けたい理想のお客さん像のことです。「年齢・性別・職業」だけで終わらせると浅すぎて、投稿にも商品にも使えません。\u003c/p>\n\u003cp>\u003cstrong>合格ライン：具体的な人物5人の顔が浮かび、その5人の「悩み」と「求めているもの」が書けること。\u003c/strong>\u003c/p>\n\u003cp>5人は実在の人で構いません。過去の自分、友人、同僚、以前のお客さん。むしろ実在の人がいちばん強いペルソナになります。第2章で書いた「谷にいたころの自分」を1人入れるのもおすすめです。\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>書く項目\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>例\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>名前（仮名でOK）・年齢\u003c/p>\u003c/td>\u003ctd>\u003cp>みさき・34歳\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>仕事・働き方\u003c/p>\u003c/td>\u003ctd>\u003cp>営業事務・時短勤務\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>家族・住まい\u003c/p>\u003c/td>\u003ctd>\u003cp>夫と子ども2人（5歳・2歳）・都内の賃貸\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>平日の1日の流れ\u003c/p>\u003c/td>\u003ctd>\u003cp>6時起床→9〜16時勤務→お迎え→夕飯→21時寝かしつけ→力尽きる\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>悩み（表面：口にすること）\u003c/p>\u003c/td>\u003ctd>\u003cp>家事の時間がない・家が散らかる\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>★悩み（深層：夜、布団の中で考えていること）\u003c/p>\u003c/td>\u003ctd>\u003cp>自分の時間が1分もない。母としても仕事でも中途半端で自分が嫌になる\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>試して失敗したこと\u003c/p>\u003c/td>\u003ctd>\u003cp>家事代行（高い）・朝活（3日で挫折）\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>★求めている未来（今→理想）\u003c/p>\u003c/td>\u003ctd>\u003cp>平日に自分の時間が1時間ある。罪悪感なく好きなことができる\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>ふだん見ているSNS\u003c/p>\u003c/td>\u003ctd>\u003cp>時短レシピ・収納・同世代ワーママVlog\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>検索しそうな言葉\u003c/p>\u003c/td>\u003ctd>\u003cp>「家事 時短 ワーママ」「夕飯 10分」\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>指が止まる瞬間\u003c/p>\u003c/td>\u003ctd>\u003cp>散らかった部屋の写真、「私だけじゃない」と思える投稿\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>財布を開く瞬間\u003c/p>\u003c/td>\u003ctd>\u003cp>同じ状況の人が変われた実績を見たとき\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>買わない理由（不安）\u003c/p>\u003c/td>\u003ctd>\u003cp>続けられるか不安、家族に言いにくい金額\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>深層の悩みまで書けたペルソナは、そのまま投稿のネタ（第5章）と商品（第10章）の設計図になります。「検索しそうな言葉」は投稿の冒頭に、「求めている未来」は商品の軸に、「買わない理由」は第11章の「よくある質問」に使います。\u003cstrong>この章でいちばん時間をかけていい場所です。\u003c/strong>\u003c/p>\n\u003cp>悩みが書けないときは、ワークシートの「悩みヒント」（時間がない、お金の不安、自信がない、続かない、など）を参考にしてください。\u003c/p>\n\u003ch2 id=\"lesson-06-s5\">4-4 実践：届ける商品を仮決めする\u003c/h2>\n\u003ch3 id=\"lesson-06-s6\">あなたはどちらのタイプか\u003c/h3>\n\u003cp class=\"list-item\">\u003cstrong>タイプA：届ける商品がすでに決まっている人\u003c/strong>（今あるサービスの集客、構想がある）→ 先にある程度形にしてから発信へ。商品から逆算してコンセプトや発信を組めるので、むしろ話が早いタイプです\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>タイプB：届ける商品がまだない・ふわふわしている人\u003c/strong> → 発信づくりが先になりますが、それでも\u003cstrong>最低限の商品の構想は今作ります。\u003c/strong> ゼロのまま発信を始めると、フォロワーは増えても「届けるものが何もない」状態に必ずぶつかります\u003c/p>\n\u003ch3 id=\"lesson-06-s7\">どこまで考えておくと進めやすいか（目安）\u003c/h3>\n\u003cp>商品について、次の3つが見えていると、プロフィールや投稿の方向が決めやすくなります。\u003c/p>\n\u003cp class=\"list-item\">ペルソナ5人が具体的に思い浮かぶ\u003c/p>\n\u003cp class=\"list-item\">その5人の悩みと求めているものが書ける\u003c/p>\n\u003cp class=\"list-item\">その悩みに「自分はこういうもので応えたい」という商品の構想が1行ある\u003c/p>\n\u003cp>あくまで目安なので、全部そろっていなくても発信は始めて大丈夫です。値段や中身、届け方も、今は決めなくて構いません。それらは第10章で、フォロワーの反応を見ながら作るほうが、ずっと精度が高くなります。\u003c/p>\n\u003ch3 id=\"lesson-06-s8\">商品の検討に2週間以上かけない\u003c/h3>\n\u003cp>大事な注意です。\u003cstrong>商品づくりだけで1か月、2か月と時間を使わないでください。\u003c/strong> 完璧な商品を作ってから発信しようとする人は、そこで止まってしまうことが多いです。それに、実際に発信を始めると「思っていたのと違う投稿が伸びて、商品の方向が変わる」ことはよくあります。\u003c/p>\n\u003cp>合言葉は\u003cstrong>発信につながるところまで詰めたら、前へ進む\u003c/strong>。仮の商品は、発信の方向を示す羅針盤です。走りながら磨いていきます。\u003c/p>\n\u003ch3 id=\"lesson-06-s9\">商品の構想を一行にする\u003c/h3>\n\u003cp>【ペルソナ】の【深層の悩み】を、【自分の強み・方法】で【今→理想】にする【形式：講座／コーチング／テンプレートなど】\u003c/p>\n\u003cp>例：「時短勤務のワーキングマザーの『自分の時間がない』を、仕組み化した家事の方法で『平日に1時間の自分の時間がある状態』にする8週間のコーチング」\u003c/p>\n\u003cp>あわせて、商品の階段（無料の特典 → 手頃な商品 → 本命の商品）も仮で書いておくと、第9章・第10章で迷いにくくなります。（例：チェックリスト → テンプレート集 → 8週間コーチング）\u003c/p>\n\u003ch3 id=\"lesson-06-s10\">コンセプトと商品が決まったら「SNS宣言」を書く\u003c/h3>\n\u003cp>ゴールナビのPOTEX宣言と対になる、SNS版の宣言を作ります。毎週、投稿を作る前に読み返してください。\u003c/p>\n\u003cp>私は、【Mission Statement】のために、【誰】を【理想の状態】にする発信で、今月【今月のSNSのゴール】を達成します。\u003c/p>\n\u003cp>例：「私は、自分らしい働き方で関わる人を笑顔にするために、時間に追われるワーキングマザーを『平日に自分の1時間がある状態』にする発信で、今月リール12本・フォロワー500人を達成します。」\u003c/p>\n\u003ch2 id=\"lesson-06-s11\">4-5 実践：プロフィールを作る（Instagram）\u003c/h2>\n\u003cp>いよいよ、お店の外観を作ります。ここではInstagramを例に説明しますが、他の媒体でも考え方は同じです。\u003c/p>\n\u003ch3 id=\"lesson-06-s12\">プロフィールは「3秒で判断される」\u003c/h3>\n\u003cp>プロフィールに来た人は、3秒で判断します。「誰の、何のアカウントか」「自分に関係あるか」「フォローする価値があるか」。この3秒に合格する部品を、上から順に作ります。\u003c/p>\n\u003ch3 id=\"lesson-06-s13\">名前（ユーザーネームと表示名）\u003c/h3>\n\u003cp class=\"list-item\">\u003cstrong>ユーザーネーム（英字のID）：\u003c/strong> 覚えやすく、打ちやすく。数字の羅列は避ける\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>表示名：\u003c/strong> 「名前｜何の人か」の形が基本。例：「みさき｜ワーママ10分時短家事」「たくや｜宅建2か月合格法」\u003c/p>\n\u003cp class=\"list-item\">「何の人か」には、\u003cstrong>ペルソナが検索しそうな言葉\u003c/strong>を入れます。Instagramの検索は表示名も拾うからです\u003c/p>\n\u003cp class=\"list-item\">避けたい例：名前だけ（misaki_0402）、抽象的な言葉（自分らしく生きる）\u003c/p>\n\u003cp class=\"list-item\">表示名とユーザーネームは、一定期間に変更できる回数に制限があります。決める前によく考えてください（※制限の内容は最新情報を確認）\u003c/p>\n\u003ch3 id=\"lesson-06-s14\">アイコン\u003c/h3>\n\u003cp class=\"list-item\">\u003cstrong>顔を出せる人：\u003c/strong> 明るい背景・胸から上・笑顔の写真。プロっぽさより「感じの良さ」が大事です。トークリールで発信するなら、顔のアイコンはほぼ必須です（動画の人＝アイコンの人、と一致することが安心感になります）\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>顔を出さない人：\u003c/strong> 後ろ姿・横顔・手元・イラスト・ジャンルを表す画像など。ただし、競合と並んだときに埋もれない色や構図にします\u003c/p>\n\u003cp class=\"list-item\">迷ったら、第3章で集めた10個のアイコンを並べて研究しましょう\u003c/p>\n\u003ch3 id=\"lesson-06-s15\">プロフィール文（4行で作る）\u003c/h3>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>行\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>書くこと\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>例\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>1行目（いちばん大事）\u003c/p>\u003c/td>\u003ctd>\u003cp>誰向けか＋何が得られるか。コンセプトを短くしたもの\u003c/p>\u003c/td>\u003ctd>\u003cp>残業ワーママでも1日10分で家が回る｜時短家事\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>2行目\u003c/p>\u003c/td>\u003ctd>\u003cp>実績・信頼できる理由を数字で（経験年数・成果・資格）\u003c/p>\u003c/td>\u003ctd>\u003cp>2児の母・フルタイム8年／家事時間を1日90分→30分に\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>3行目\u003c/p>\u003c/td>\u003ctd>\u003cp>フォローすると何が見られるか\u003c/p>\u003c/td>\u003ctd>\u003cp>平日20時に「今日の10分家事」を投稿中\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>4行目\u003c/p>\u003c/td>\u003ctd>\u003cp>次にしてほしいこと（リンクへの案内）\u003c/p>\u003c/td>\u003ctd>\u003cp>プロフィールのリンクから時短家事チェックリストを配布中\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>4行目は、登録特典ができる（第9章）までは無理に書かなくて大丈夫です。\u003c/p>\n\u003cp>\u003cstrong>確認すること\u003c/strong>\u003c/p>\n\u003cp class=\"list-item\">1行目だけ読んで、ペルソナが「私のことだ」と思うか\u003c/p>\n\u003cp class=\"list-item\">数字が最低1つ入っているか（数字は信頼を得るいちばんの近道です）\u003c/p>\n\u003cp class=\"list-item\">「頑張ります」「よろしくお願いします」など、見る人に関係のない言葉で文字数を使っていないか\u003c/p>\n\u003ch3 id=\"lesson-06-s16\">ハイライト：作るのはファン化の段階で\u003c/h3>\n\u003cp>ハイライト（プロフィールに並ぶ丸いアイコン）の中身は、ストーリーズです。ストーリーズはフォロワーがついてから見られるようになるので、ハイライトの作り方は第8章「ファン化」で扱います。この段階では、まだ作らなくて大丈夫です。\u003c/p>\n\u003cp>例外は、店舗・サロン・教室のアカウントです。メニュー・料金・アクセス・予約方法は、来店するかどうかに直結するので、最初から作ってください。\u003c/p>\n\u003cp>第3章で記録した「競合がハイライトに何を置いているか」は、第8章でハイライトを作るときの設計図になります。\u003c/p>\n\u003ch3 id=\"lesson-06-s17\">プロフィールのリンク：最初は貼らなくてOK\u003c/h3>\n\u003cp>プロフィールに外部リンクを貼ると、投稿が届く範囲（リーチ）が下がるとも言われています（※最新情報を確認）。できれば最初は貼らずに始めましょう。\u003c/p>\n\u003cp>リンクを貼るのは、第9章で公式LINEと登録特典ができてからです。複数のリンクをまとめたい場合は、リンクをまとめるサービス（lit.linkなど）を使います。\u003c/p>\n\u003ch2 id=\"lesson-06-s18\">4-6 公開前の最終チェック\u003c/h2>\n\u003cp>STEP1の卒業試験です。自分のアカウントを開いて、初めて見る人のつもりで確認してください。\u003c/p>\n\u003cp class=\"list-item\">初めて見た人に、「何のアカウントか」を3秒で当ててもらえたか（家族や友人に見せてみるのがいちばんです）\u003c/p>\n\u003cp class=\"list-item\">表示名に「検索される言葉」が入っているか\u003c/p>\n\u003cp class=\"list-item\">プロフィール文に数字が入っているか\u003c/p>\n\u003cp class=\"list-item\">コーチのアドバイスを受けて、直しを反映したか\u003c/p>\n\u003ch2 id=\"lesson-06-s19\">第4章 ワーク\u003c/h2>\n\u003cp>\u003cstrong>書く場所と目安\u003c/strong>（この順番で進めます）\u003c/p>\n\u003cp class=\"list-item\">「④ペルソナ」タブ：5人分のペルソナを書く。「谷にいたころの自分」を入れるのもおすすめ（1.5〜2時間）\u003c/p>\n\u003cp class=\"list-item\">「⑤コンセプト・商品・SNS宣言」タブ：コンセプトの一文、商品の構想の一行、SNS宣言を書く（1時間）\u003c/p>\n\u003cp class=\"list-item\">「⑥アカウント設計」タブ：名前・アイコン・プロフィール文を作り、実際にアカウントに設定する（1〜1.5時間）\u003c/p>\n\u003cp class=\"list-item\">プロフィール画面のスクリーンショットをコーチに送り、アドバイスをもらって直す\u003c/p>\n\u003cp>終わったら「全体マップ・進捗チェック」タブで第4章に印をつけてください。\u003c/p>\n\u003cp>\u003cstrong>これでSTEP1は修了です。あなたの「お店」が完成しました。\u003c/strong> 次のSTEP2では、いよいよチラシ配り（発信）を始めます。\u003c/p>", "text": "この章のゴール\nコンセプトを一文で言え、ペルソナ（発信を届けたい相手）5人の顔が浮かぶ\n「何を届けるか」の仮決めができている（仕上げは第10章）\nInstagramのプロフィール（名前・アイコン・プロフィール文）が完成し、公開できる\n所要時間の目安： 読む 40分／ワーク 3〜5時間\n4-1 講義：アカウントは「お店」である\nアカウントづくりを、お店づくりにたとえます。\nアカウント\nお店にたとえると\nコンセプト\n何屋さんか（看板に書くこと）\n商品（仮）\n何を売るお店か\nプロフィール\nお店の外観。通りかかった人が3秒で「入るか・通り過ぎるか」を決める\n投稿（第5章〜）\nチラシ配り\nチラシがどれだけ良くても、来た人がお店の外観を見て「何屋かわからない」と帰ってしまえば、すべて無駄になります。投稿を始める前に、お店を完成させる。 それがこの章です。\n「商品は第10章で作るのに、なぜ今考えるの？」と思うかもしれません。理由は、届けるものが決まっていないと、プロフィールも投稿も逆算できないからです。同じワーキングマザー向けのアカウントでも、時短家事の講座を届けるのか、キャリア相談を届けるのかで、発信の中身は変わります。ただし、今の段階で商品を作り込む必要はありません。どこまでやれば十分かは4-4で説明します。\nこの章は、ペルソナ → コンセプト → 商品の仮決め → プロフィールの順にワークを進めます。説明はコンセプトから始めますが、ワークはペルソナから手をつけてください。\n4-2 実践：コンセプトを決める\nコンセプトは、次の一文で言える状態がゴールです。\n「誰の」「どんな悩みを」「どう解決する」アカウントか\n例：\n30代ワーキングマザーの「時間がない」を、1日10分の時短家事で解決するアカウント\n宅建に3回落ちた社会人の「勉強が続かない」を、朝30分の学習法で解決するアカウント\n開業3年目までの美容室オーナーの「新規のお客さんが来ない」を、Instagram集客で解決するアカウント\n第3章で書いた「方向性の一文」から、誰・何・どうを取り出して磨きます。確認するのは次の3つです。\n具体的か： 「みんな」「女性」では広すぎます。「30代・都内・時短勤務のワーキングマザー」まで絞るほど、刺さります\n競合と並べて埋もれないか： 第3章で集めた10個のコンセプトと並べて、あなただけの違いがあるか。違いは「相手を絞る」「方法を絞る」「実績や肩書きをかけ合わせる」のどれかで作れます\nペルソナが読んだら「私のことだ」と思うか： 次のペルソナ設計とセットで確かめます\n4-3 実践：ペルソナを設計する（5人、顔が浮かぶか）\nペルソナとは、発信を届けたい理想のお客さん像のことです。「年齢・性別・職業」だけで終わらせると浅すぎて、投稿にも商品にも使えません。\n合格ライン：具体的な人物5人の顔が浮かび、その5人の「悩み」と「求めているもの」が書けること。\n5人は実在の人で構いません。過去の自分、友人、同僚、以前のお客さん。むしろ実在の人がいちばん強いペルソナになります。第2章で書いた「谷にいたころの自分」を1人入れるのもおすすめです。\n書く項目\n例\n名前（仮名でOK）・年齢\nみさき・34歳\n仕事・働き方\n営業事務・時短勤務\n家族・住まい\n夫と子ども2人（5歳・2歳）・都内の賃貸\n平日の1日の流れ\n6時起床→9〜16時勤務→お迎え→夕飯→21時寝かしつけ→力尽きる\n悩み（表面：口にすること）\n家事の時間がない・家が散らかる\n★悩み（深層：夜、布団の中で考えていること）\n自分の時間が1分もない。母としても仕事でも中途半端で自分が嫌になる\n試して失敗したこと\n家事代行（高い）・朝活（3日で挫折）\n★求めている未来（今→理想）\n平日に自分の時間が1時間ある。罪悪感なく好きなことができる\nふだん見ているSNS\n時短レシピ・収納・同世代ワーママVlog\n検索しそうな言葉\n「家事 時短 ワーママ」「夕飯 10分」\n指が止まる瞬間\n散らかった部屋の写真、「私だけじゃない」と思える投稿\n財布を開く瞬間\n同じ状況の人が変われた実績を見たとき\n買わない理由（不安）\n続けられるか不安、家族に言いにくい金額\n深層の悩みまで書けたペルソナは、そのまま投稿のネタ（第5章）と商品（第10章）の設計図になります。「検索しそうな言葉」は投稿の冒頭に、「求めている未来」は商品の軸に、「買わない理由」は第11章の「よくある質問」に使います。この章でいちばん時間をかけていい場所です。\n悩みが書けないときは、ワークシートの「悩みヒント」（時間がない、お金の不安、自信がない、続かない、など）を参考にしてください。\n4-4 実践：届ける商品を仮決めする\nあなたはどちらのタイプか\nタイプA：届ける商品がすでに決まっている人（今あるサービスの集客、構想がある）→ 先にある程度形にしてから発信へ。商品から逆算してコンセプトや発信を組めるので、むしろ話が早いタイプです\nタイプB：届ける商品がまだない・ふわふわしている人 → 発信づくりが先になりますが、それでも最低限の商品の構想は今作ります。 ゼロのまま発信を始めると、フォロワーは増えても「届けるものが何もない」状態に必ずぶつかります\nどこまで考えておくと進めやすいか（目安）\n商品について、次の3つが見えていると、プロフィールや投稿の方向が決めやすくなります。\nペルソナ5人が具体的に思い浮かぶ\nその5人の悩みと求めているものが書ける\nその悩みに「自分はこういうもので応えたい」という商品の構想が1行ある\nあくまで目安なので、全部そろっていなくても発信は始めて大丈夫です。値段や中身、届け方も、今は決めなくて構いません。それらは第10章で、フォロワーの反応を見ながら作るほうが、ずっと精度が高くなります。\n商品の検討に2週間以上かけない\n大事な注意です。商品づくりだけで1か月、2か月と時間を使わないでください。 完璧な商品を作ってから発信しようとする人は、そこで止まってしまうことが多いです。それに、実際に発信を始めると「思っていたのと違う投稿が伸びて、商品の方向が変わる」ことはよくあります。\n合言葉は発信につながるところまで詰めたら、前へ進む。仮の商品は、発信の方向を示す羅針盤です。走りながら磨いていきます。\n商品の構想を一行にする\n【ペルソナ】の【深層の悩み】を、【自分の強み・方法】で【今→理想】にする【形式：講座／コーチング／テンプレートなど】\n例：「時短勤務のワーキングマザーの『自分の時間がない』を、仕組み化した家事の方法で『平日に1時間の自分の時間がある状態』にする8週間のコーチング」\nあわせて、商品の階段（無料の特典 → 手頃な商品 → 本命の商品）も仮で書いておくと、第9章・第10章で迷いにくくなります。（例：チェックリスト → テンプレート集 → 8週間コーチング）\nコンセプトと商品が決まったら「SNS宣言」を書く\nゴールナビのPOTEX宣言と対になる、SNS版の宣言を作ります。毎週、投稿を作る前に読み返してください。\n私は、【Mission Statement】のために、【誰】を【理想の状態】にする発信で、今月【今月のSNSのゴール】を達成します。\n例：「私は、自分らしい働き方で関わる人を笑顔にするために、時間に追われるワーキングマザーを『平日に自分の1時間がある状態』にする発信で、今月リール12本・フォロワー500人を達成します。」\n4-5 実践：プロフィールを作る（Instagram）\nいよいよ、お店の外観を作ります。ここではInstagramを例に説明しますが、他の媒体でも考え方は同じです。\nプロフィールは「3秒で判断される」\nプロフィールに来た人は、3秒で判断します。「誰の、何のアカウントか」「自分に関係あるか」「フォローする価値があるか」。この3秒に合格する部品を、上から順に作ります。\n名前（ユーザーネームと表示名）\nユーザーネーム（英字のID）： 覚えやすく、打ちやすく。数字の羅列は避ける\n表示名： 「名前｜何の人か」の形が基本。例：「みさき｜ワーママ10分時短家事」「たくや｜宅建2か月合格法」\n「何の人か」には、ペルソナが検索しそうな言葉を入れます。Instagramの検索は表示名も拾うからです\n避けたい例：名前だけ（misaki_0402）、抽象的な言葉（自分らしく生きる）\n表示名とユーザーネームは、一定期間に変更できる回数に制限があります。決める前によく考えてください（※制限の内容は最新情報を確認）\nアイコン\n顔を出せる人： 明るい背景・胸から上・笑顔の写真。プロっぽさより「感じの良さ」が大事です。トークリールで発信するなら、顔のアイコンはほぼ必須です（動画の人＝アイコンの人、と一致することが安心感になります）\n顔を出さない人： 後ろ姿・横顔・手元・イラスト・ジャンルを表す画像など。ただし、競合と並んだときに埋もれない色や構図にします\n迷ったら、第3章で集めた10個のアイコンを並べて研究しましょう\nプロフィール文（4行で作る）\n行\n書くこと\n例\n1行目（いちばん大事）\n誰向けか＋何が得られるか。コンセプトを短くしたもの\n残業ワーママでも1日10分で家が回る｜時短家事\n2行目\n実績・信頼できる理由を数字で（経験年数・成果・資格）\n2児の母・フルタイム8年／家事時間を1日90分→30分に\n3行目\nフォローすると何が見られるか\n平日20時に「今日の10分家事」を投稿中\n4行目\n次にしてほしいこと（リンクへの案内）\nプロフィールのリンクから時短家事チェックリストを配布中\n4行目は、登録特典ができる（第9章）までは無理に書かなくて大丈夫です。\n確認すること\n1行目だけ読んで、ペルソナが「私のことだ」と思うか\n数字が最低1つ入っているか（数字は信頼を得るいちばんの近道です）\n「頑張ります」「よろしくお願いします」など、見る人に関係のない言葉で文字数を使っていないか\nハイライト：作るのはファン化の段階で\nハイライト（プロフィールに並ぶ丸いアイコン）の中身は、ストーリーズです。ストーリーズはフォロワーがついてから見られるようになるので、ハイライトの作り方は第8章「ファン化」で扱います。この段階では、まだ作らなくて大丈夫です。\n例外は、店舗・サロン・教室のアカウントです。メニュー・料金・アクセス・予約方法は、来店するかどうかに直結するので、最初から作ってください。\n第3章で記録した「競合がハイライトに何を置いているか」は、第8章でハイライトを作るときの設計図になります。\nプロフィールのリンク：最初は貼らなくてOK\nプロフィールに外部リンクを貼ると、投稿が届く範囲（リーチ）が下がるとも言われています（※最新情報を確認）。できれば最初は貼らずに始めましょう。\nリンクを貼るのは、第9章で公式LINEと登録特典ができてからです。複数のリンクをまとめたい場合は、リンクをまとめるサービス（lit.linkなど）を使います。\n4-6 公開前の最終チェック\nSTEP1の卒業試験です。自分のアカウントを開いて、初めて見る人のつもりで確認してください。\n初めて見た人に、「何のアカウントか」を3秒で当ててもらえたか（家族や友人に見せてみるのがいちばんです）\n表示名に「検索される言葉」が入っているか\nプロフィール文に数字が入っているか\nコーチのアドバイスを受けて、直しを反映したか\n第4章 ワーク\n書く場所と目安（この順番で進めます）\n「④ペルソナ」タブ：5人分のペルソナを書く。「谷にいたころの自分」を入れるのもおすすめ（1.5〜2時間）\n「⑤コンセプト・商品・SNS宣言」タブ：コンセプトの一文、商品の構想の一行、SNS宣言を書く（1時間）\n「⑥アカウント設計」タブ：名前・アイコン・プロフィール文を作り、実際にアカウントに設定する（1〜1.5時間）\nプロフィール画面のスクリーンショットをコーチに送り、アドバイスをもらって直す\n終わったら「全体マップ・進捗チェック」タブで第4章に印をつけてください。\nこれでSTEP1は修了です。あなたの「お店」が完成しました。 次のSTEP2では、いよいよチラシ配り（発信）を始めます。", "minutes": 10}, {"id": "lesson-07", "title": "第5章 発信の基礎", "group": "STEP2 発信で伸ばす", "headings": [{"id": "lesson-07-s1", "title": "この章のゴール", "level": 2}, {"id": "lesson-07-s2", "title": "5-1 講義：投稿には3つの種類がある", "level": 2}, {"id": "lesson-07-s3", "title": "5-2 実践：ネタの作り方（まずは競合の伸びている投稿から）", "level": 2}, {"id": "lesson-07-s4", "title": "5-3 実践：伸びているリールを1本まるごと分解する", "level": 2}, {"id": "lesson-07-s5", "title": "5-4 実践：投稿の型と台本", "level": 2}, {"id": "lesson-07-s6", "title": "冒頭3秒で止める（フック）", "level": 3}, {"id": "lesson-07-s7", "title": "台本は5つのまとまりで作る", "level": 3}, {"id": "lesson-07-s8", "title": "5-5 発信を習慣にする", "level": 2}, {"id": "lesson-07-s9", "title": "5-6 よくあるつまずき5つ", "level": 2}, {"id": "lesson-07-s10", "title": "第5章 ワーク", "level": 2}], "html": "\u003ch2 id=\"lesson-07-s1\">この章のゴール\u003c/h2>\n\u003cp class=\"list-item\">投稿の3つの種類と、今の自分に合う比率がわかる\u003c/p>\n\u003cp class=\"list-item\">ネタストックが30本ある\u003c/p>\n\u003cp class=\"list-item\">伸びているリールを分解して、自分の台本を書ける\u003c/p>\n\u003cp class=\"list-item\">毎週の投稿の流れ（カレンダー）が決まっている\u003c/p>\n\u003cp>\u003cstrong>所要時間の目安：\u003c/strong> 読む 40分／ワーク 3〜5時間（数日に分けてOK）\u003c/p>\n\u003ch2 id=\"lesson-07-s2\">5-1 講義：投稿には3つの種類がある\u003c/h2>\n\u003cp>すべての投稿は、目的ごとに3つに分けられます。\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>種類\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>目的\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>主な形式\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>知ってもらう投稿（認知）\u003c/p>\u003c/td>\u003ctd>\u003cp>フォロワー以外の人に届ける。検索されるテーマ、流行り、強い冒頭\u003c/p>\u003c/td>\u003ctd>\u003cp>リール\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>信頼してもらう投稿（信頼）\u003c/p>\u003c/td>\u003ctd>\u003cp>すでに見てくれている人との関係を深める。自分のストーリー、価値観、失敗談、お客さんの変化\u003c/p>\u003c/td>\u003ctd>\u003cp>フィード・ストーリーズ\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>案内する投稿（販売）\u003c/p>\u003c/td>\u003ctd>\u003cp>商品・特典・公式LINEを案内する。STEP3〜4で本格的に使う\u003c/p>\u003c/td>\u003ctd>\u003cp>ストーリーズ・リール\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>商品も特典もまだないうちは、案内する投稿は出さなくて大丈夫です。比率の目安は次のとおりです。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>立ち上げの時期：\u003c/strong> 知ってもらう 9：信頼してもらう 1：案内 0\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>公式LINEができたあと（第9章〜）：\u003c/strong> 知ってもらう 5：信頼してもらう 3：案内 2\u003c/p>\n\u003ch2 id=\"lesson-07-s3\">5-2 実践：ネタの作り方（まずは競合の伸びている投稿から）\u003c/h2>\n\u003cp>ネタ切れは、才能ではなく仕組みの問題です。ネタの出どころ（蛇口）は3つありますが、\u003cstrong>最初は1つ目の「競合の伸びている投稿」から作るのがいちばん大切です。\u003c/strong> すでに伸びることがわかっているテーマなので、当たりやすいからです。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>競合の伸びている投稿から（まずはここ）：\u003c/strong> 第
