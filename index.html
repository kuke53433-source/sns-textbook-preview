ctd>\u003cp>第10章\u003c/p>\u003c/td>\u003ctd>\u003cp>未確認\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"lesson-19-s4\">法律・ルール\u003c/h2>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>項目\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>内容（要確認）\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>本文の場所\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>最終確認日\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>ステマ規制\u003c/p>\u003c/td>\u003ctd>\u003cp>2023年10月から施行。広告であることを隠した宣伝が規制の対象\u003c/p>\u003c/td>\u003ctd>\u003cp>関所\u003c/p>\u003c/td>\u003ctd>\u003cp>未確認\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "text": "SNSの仕組みや料金など、時期で変わる情報をまとめたページです。本文で「※最新情報を確認」とある場所は、ここを見てください。内容は定期的に見直します。\nInstagram\n項目\n内容（要確認）\n本文の場所\n最終確認日\nハッシュタグ\n1投稿5個まで\n第7章\n未確認\nトライアルリール\nフォロワー以外にだけ試しに公開できるリール\n第7章\n未確認\n表示名・ユーザーネームの変更\n14日間で2回まで\n第4章\n未確認\n投稿画像のサイズ\n縦長（横4：縦5）。プロフィールの一覧では切り取られて表示される\n第6章\n未確認\nPR表記の機能\n「タイアップ投稿」のラベル\n関所\n未確認\nそのほかの媒体\n項目\n内容（要確認）\n本文の場所\n最終確認日\nYouTubeの収益化の条件\n広告収入：登録者1,000人＋直近12か月の総再生時間4,000時間、または登録者1,000人＋直近90日のショート視聴回数1,000万回。登録者500人の段階ではメンバーシップなどの機能が使える\n第1章\n未確認\nYouTubeの広告単価\n1再生0.5円前後が目安（ジャンルで変わる）\n第1章\n未確認\nnoteの価格帯\n100円から設定可能。100円＝気軽に買われやすい、300円＝フォロワー数に比例しやすい、500円＝しっかり読んでもらえる、980円＝刺されば動く\n第1章\n未確認\nTikTokショップ\n参入が増えている。単価は低め（報酬の相場・手数料は要調査）\n第1章・発展編\n未確認\n公式LINE\n料金プランと配信できる通数の上限（要調査）\n第9章\n未確認\nツール・サービス\n項目\n内容（要確認）\n本文の場所\n最終確認日\n販売・決済のサービス\nBrain・Tips・Stripeなどの手数料と審査（要調査）\n第10章\n未確認\n法律・ルール\n項目\n内容（要確認）\n本文の場所\n最終確認日\nステマ規制\n2023年10月から施行。広告であることを隠した宣伝が規制の対象\n関所\n未確認", "minutes": 2}];
const $=s=>document.querySelector(s);
const main=$('#main'), search=$('#search');
let lessons=[], done=new Set(), storageKey='', searchTimer;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(message){$('#toast').textContent=message;setTimeout(()=>$('#toast').textContent='',3500);}
function save(){try{localStorage.setItem(storageKey,JSON.stringify([...done]));}catch{toast('このブラウザでは読了記録を保存できません。');}}
function navigation(){
  let group='';
  $('#nav').innerHTML=lessons.map(l=>{const title=l.group!==group?`<p class="nav-group">${esc(l.group)}</p>`:'';group=l.group;return title+`<a href="#${l.id}" ${location.hash===`#${l.id}`?'aria-current="page"':''}><span class="nav-check ${done.has(l.id)?'checked':''}" aria-label="${done.has(l.id)?'読了':'未読'}">${done.has(l.id)?'✓':'·'}</span><span>${esc(l.title)}</span></a>`;}).join('');
  const n=Math.round(done.size/lessons.length*100);$('#progress').value=n;$('#progress-label').textContent=`${n}%`;
}
function card(l,i){return `<a class="lesson-card" href="#${l.id}"><span class="card-number">${String(i+1).padStart(2,'0')}</span><div><h3>${esc(l.title)}</h3><p>${l.minutes}分で読む ${done.has(l.id)?'・読了済み':''}</p></div><span class="arrow">↗</span></a>`;}
function home(){
  const next=lessons.find(l=>!done.has(l.id))||lessons[0];
  main.innerHTML=`<div class="home"><div class="breadcrumb">学習ライブラリ / SNSの教科書</div><section class="hero"><div class="hero-copy"><p class="eyebrow">POTEX SNS TEXTBOOK</p><h1>伝わる発信を、<br>あなたの力に。</h1><p>SNSの土台づくりから、価値を届けるまで。<br>教科書とワーク、コーチとの対話で、一歩ずつ。</p><a class="primary" href="#${next.id}">${done.size?'学びの続きを読む':'はじめにを読む'} <span>→</span></a></div><div class="book-art" aria-hidden="true"><div class="book-cover"><span>POTEX<br>LEARNING</span><strong>SNSの<br>教科書</strong><div class="book-lines"></div><small>LEARN · PRACTICE · GROW</small></div><div class="orbit orbit-one"></div><div class="orbit orbit-two"></div></div></section><div class="course-meta"><span><b>4</b> STEP</span><span><b>12</b> 章 <small>第0〜11章</small></span><span>発展編・用語集つき</span></div><section class="curriculum"><div class="section-title"><div><p class="eyebrow">YOUR LEARNING PATH</p><h2>学習を進める</h2></div><span>${done.size} / ${lessons.length} 教材を読了</span></div><div class="path-strip"><span>01 土台を作る</span><span>02 発信で伸ばす</span><span>03 ファンを集める</span><span>04 価値を届ける</span></div>${[...new Set(lessons.map(l=>l.group))].map(g=>`<section class="lesson-group"><h2>${esc(g)}</h2><div class="card-grid">${lessons.map((l,i)=>l.group===g?card(l,i):'').join('')}</div></section>`).join('')}</section><footer>POTEX SNSの教科書。無断転載・再配布はご遠慮ください。</footer></div>`;
}
function lesson(l){
  const i=lessons.indexOf(l);
  main.innerHTML=`<div class="reader"><div class="breadcrumb"><a href="#">学習ライブラリ</a> / ${esc(l.group)}</div><div class="reader-grid"><article><header class="article-header"><p class="eyebrow">${esc(l.group)}</p><h1>${esc(l.title)}</h1><p class="article-meta">約${l.minutes}分で読む <span>・</span> 教材 ${i+1} / ${lessons.length}</p></header><div class="article-body">${l.html}</div><div class="complete-box"><div><h2>ここまで読めましたか？</h2><p>ワークは原稿に記載のワークシートで進めましょう。</p></div><button id="complete" class="primary" aria-pressed="${done.has(l.id)}">${done.has(l.id)?'✓ 読了済み':'読了にする'}</button></div><div class="prev-next">${i?`<a href="#${lessons[i-1].id}">← 前の教材<br><strong>${esc(lessons[i-1].title)}</strong></a>`:'<span></span>'}${i<lessons.length-1?`<a href="#${lessons[i+1].id}">次の教材 →<br><strong>${esc(lessons[i+1].title)}</strong></a>`:'<a href="#">学習ライブラリに戻る →</a>'}</div></article><aside class="on-this-page"><p>この教材の内容</p>${l.headings.filter(h=>h.level===2).map(h=>`<a href="#${l.id}/${h.id}">${esc(h.title)}</a>`).join('')}</aside></div></div>`;
  $('#complete').onclick=()=>{if(done.has(l.id))done.delete(l.id);else done.add(l.id);save();navigation();const b=$('#complete');b.textContent=done.has(l.id)?'✓ 読了済み':'読了にする';b.setAttribute('aria-pressed',String(done.has(l.id)));};
}
function results(query){
  const q=query.toLocaleLowerCase();
  const matches=lessons.filter(l=>(l.title+'\n'+l.text).toLocaleLowerCase().includes(q));
  main.innerHTML=`<div class="search-results"><div class="breadcrumb"><a href="#">学習ライブラリ</a> / 検索</div><p class="eyebrow">SEARCH</p><h1>「${esc(query)}」の検索結果</h1><p class="muted" role="status">${matches.length}件の教材が見つかりました</p>${matches.map(l=>{const n=l.text.toLocaleLowerCase().indexOf(q), start=Math.max(0,n-45);const snippet=l.text.slice(start,start+180);return `<a class="result" href="#${l.id}"><p class="eyebrow">${esc(l.group)}</p><h2>${esc(l.title)}</h2><p>${esc(snippet)}…</p><span>教材を読む →</span></a>`;}).join('')||'<div class="empty">見つかりませんでした。短い言葉や別のキーワードで検索してください。</div>'}</div>`;
}
function route(){
  const [id,anchor]=location.hash.slice(1).split('/');
  search.value='';
  const l=lessons.find(l=>l.id===id);
  if(l)lesson(l);else home();
  document.title=l?`${l.title} | SNSの教科書`:'SNSの教科書 | POTEX';
  navigation();
  if(anchor)document.getElementById(anchor)?.scrollIntoView();else window.scrollTo(0,0);
  if(matchMedia('(max-width: 800px)').matches)$('.mobile-nav').open=false;
}
search.addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{const q=search.value.trim();if(q)results(q);else route();},180);});
window.addEventListener('hashchange',route);
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a&&a.getAttribute('href')===(location.hash||'#')){e.preventDefault();route();}});
window.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();search.focus();}});
async function start(){
  try{
    storageKey='potex-public-reading-v1';
    lessons=LOCAL_CONTENT;
    try{const saved=JSON.parse(localStorage.getItem(storageKey)||'[]');if(Array.isArray(saved))done=new Set(saved.filter(id=>lessons.some(l=>l.id===id)));}catch{}
    route();
  }catch{main.innerHTML='<div class="empty"><h1>教材を読み込めませんでした</h1><p>ページを再読み込みしてください。</p><a href="./">再読み込み</a></div>';}
}
start();
</script></body></html>
