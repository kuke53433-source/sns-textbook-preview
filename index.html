3章で見つけた伸びている投稿を、自分のペルソナや経験に合わせて作り直す\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>ペルソナの悩みから（慣れてきたら）：\u003c/strong> 第4章で書いたペルソナの悩みをもとに、自分でテーマを考える\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>自分の日常から（慣れてきたら）：\u003c/strong> 今日あったこと、気づいたこと、よく聞かれることを、ペルソナに役立つ形に変える\u003c/p>\n\u003cp>2と3は、あなたらしいオリジナルの投稿になりやすい反面、伸びるかどうかは出してみないとわかりません。競合からのネタで投稿に慣れてきたら、少しずつ混ぜていきましょう。\u003c/p>\n\u003cp>まずは\u003cstrong>ネタを30本\u003c/strong>、ワークシートに書き出しましょう。どの蛇口から出たネタかも一緒に記録しておくと、あとで分析しやすくなります。\u003c/p>\n\u003ch2 id=\"lesson-07-s4\">5-3 実践：伸びているリールを1本まるごと分解する\u003c/h2>\n\u003cp>自分のリールを作る前に、第3章のベンチマーク（合う度4以上）から伸びているリールを選んで、秒単位で分解してみましょう。数本分解してから作ると、自分の1本目の質が大きく変わります。目安は5本です。\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>区切り\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>見るところ\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>考えること\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>入り口\u003c/p>\u003c/td>\u003ctd>\u003cp>表紙画像・1行目の文字（文字の量・色・顔の有無）\u003c/p>\u003c/td>\u003ctd>\u003cp>なぜ指が止まるのか\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>0〜3秒\u003c/p>\u003c/td>\u003ctd>\u003cp>冒頭のセリフと映像\u003c/p>\u003c/td>\u003ctd>\u003cp>どの型の冒頭か（5-4のフックの型を参照）\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>3〜15秒\u003c/p>\u003c/td>\u003ctd>\u003cp>文字の量、テンポ、情報の順番\u003c/p>\u003c/td>\u003ctd>\u003cp>離れさせない工夫は何か\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>15秒〜\u003c/p>\u003c/td>\u003ctd>\u003cp>オチ・まとめ・意外性\u003c/p>\u003c/td>\u003ctd>\u003cp>最後まで見る理由は何か\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>最後の一言（あれば）\u003c/p>\u003c/td>\u003ctd>\u003cp>保存？フォロー？コメント？\u003c/p>\u003c/td>\u003ctd>\u003cp>なぜその行動を促しているのか\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>全体\u003c/p>\u003c/td>\u003ctd>\u003cp>秒数・カット数・声（自分の声／AI音声／なし）・BGM\u003c/p>\u003c/td>\u003ctd>\u003cp>テンポの正体は何か\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>世界観\u003c/p>\u003c/td>\u003ctd>\u003cp>色味・発信者の見せ方\u003c/p>\u003c/td>\u003ctd>\u003cp>一目で「この人」とわかる要素は何か\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>それぞれの区切りごとに「自分ならどうするか」を一言書いておくと、そのまま次の台本づくりに使えます。ワークシートに記入例があるので、参考にしてください。\u003c/p>\n\u003ch2 id=\"lesson-07-s5\">5-4 実践：投稿の型と台本\u003c/h2>\n\u003ch3 id=\"lesson-07-s6\">冒頭3秒で止める（フック）\u003c/h3>\n\u003cp>リールでは、見る人の多くが冒頭の数秒で離れていきます。冒頭で「自分に関係ある」「続きが気になる」と思ってもらうための工夫を、\u003cstrong>フック\u003c/strong>といいます。よく使われる型は次の10個です。\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>型\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>基本の形\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>例\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>数字型\u003c/p>\u003c/td>\u003ctd>\u003cp>〇〇がN個／N分／N円\u003c/p>\u003c/td>\u003ctd>\u003cp>家事が1日30分になる3つの仕組み\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>警告型\u003c/p>\u003c/td>\u003ctd>\u003cp>その〇〇、逆効果です\u003c/p>\u003c/td>\u003ctd>\u003cp>その作り置き、逆に時間を奪ってます\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>共感型\u003c/p>\u003c/td>\u003ctd>\u003cp>毎日〇〇な人へ\u003c/p>\u003c/td>\u003ctd>\u003cp>毎晩、寝かしつけで一日が終わる人へ\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>意外性型\u003c/p>\u003c/td>\u003ctd>\u003cp>〇〇のコツは、△△しないこと\u003c/p>\u003c/td>\u003ctd>\u003cp>時短のコツは、頑張らないことでした\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>実績型\u003c/p>\u003c/td>\u003ctd>\u003cp>N日で〇〇できた方法\u003c/p>\u003c/td>\u003ctd>\u003cp>家事90分→30分にした仕組み\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>質問型\u003c/p>\u003c/td>\u003ctd>\u003cp>なんで〇〇か知ってますか？\u003c/p>\u003c/td>\u003ctd>\u003cp>なんで毎日冷蔵庫の前で悩むか知ってますか？\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>結果先出し型\u003c/p>\u003c/td>\u003ctd>\u003cp>変化の前と後を最初に見せる\u003c/p>\u003c/td>\u003ctd>\u003cp>散らかった台所→片付いた台所を冒頭で重ねる\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>損失回避型\u003c/p>\u003c/td>\u003ctd>\u003cp>〇〇しないと損してます\u003c/p>\u003c/td>\u003ctd>\u003cp>この設定をしていないと洗濯で毎日10分損してます\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>限定・新情報型\u003c/p>\u003c/td>\u003ctd>\u003cp>今だけ／最新の〇〇\u003c/p>\u003c/td>\u003ctd>\u003cp>2026年版・買ってよかった時短家電\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>ストーリー型\u003c/p>\u003c/td>\u003ctd>\u003cp>私、〇〇でした\u003c/p>\u003c/td>\u003ctd>\u003cp>私、家事に1日90分かけてました\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"lesson-07-s7\">台本は5つのまとまりで作る\u003c/h3>\n\u003cp>1本のリールは、次の流れで組み立てると作りやすくなります。秒数はあくまで目安です。\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>まとまり\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>役割\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>目安\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>書き方のコツ\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>①冒頭（フック）\u003c/p>\u003c/td>\u003ctd>\u003cp>指を止める\u003c/p>\u003c/td>\u003ctd>\u003cp>0〜3秒\u003c/p>\u003c/td>\u003ctd>\u003cp>上の10の型から選ぶ。結果や気持ちを先に\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>②共感・問題提起\u003c/p>\u003c/td>\u003ctd>\u003cp>「私のことだ」と思ってもらう\u003c/p>\u003c/td>\u003ctd>\u003cp>3〜8秒\u003c/p>\u003c/td>\u003ctd>\u003cp>ペルソナの深層の悩みの言葉をそのまま使う\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>③本編\u003c/p>\u003c/td>\u003ctd>\u003cp>冒頭で約束したことを回収する\u003c/p>\u003c/td>\u003ctd>\u003cp>8〜30秒\u003c/p>\u003c/td>\u003ctd>\u003cp>手順は3つまで。1画面の文字は12文字以内。1カット2秒以内\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>④オチ・変化\u003c/p>\u003c/td>\u003ctd>\u003cp>「見てよかった」と思ってもらう\u003c/p>\u003c/td>\u003ctd>\u003cp>30〜40秒\u003c/p>\u003c/td>\u003ctd>\u003cp>変化の証拠、または意外な一言\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>⑤最後の一言（入れる場合）\u003c/p>\u003c/td>\u003ctd>\u003cp>次の行動につなげる\u003c/p>\u003c/td>\u003ctd>\u003cp>2〜3秒\u003c/p>\u003c/td>\u003ctd>\u003cp>最初のうちは「保存して今夜やってみて」など。入れない投稿があっても構いません\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>1投稿に伝えることは1つ。\u003c/strong> 詰め込みすぎないことが、最後まで見てもらうコツです。\u003c/p>\n\u003ch2 id=\"lesson-07-s8\">5-5 発信を習慣にする\u003c/h2>\n\u003cp>続けるための仕組みは教科書で、続ける力の部分はコーチと一緒に作ります。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>週間カレンダー：\u003c/strong> 週の初めに「何曜日にどのネタを出すか」をネタストックから割り当てる\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>まとめて作る：\u003c/strong> 毎日1本ずつ作るより、週に1回まとめて撮影・編集するほうが続きやすくなります。撮影する日と編集する日を分けるのもおすすめです\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>習慣クエストとつなげる：\u003c/strong> 第0章でコーチと決めた毎日の習慣クエストに、投稿の作業を組み込む\u003c/p>\n\u003cp>週間カレンダーの例（週で3本投稿する場合）：\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>曜日\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>やること\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>月・水・金\u003c/p>\u003c/td>\u003ctd>\u003cp>投稿\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>火・木\u003c/p>\u003c/td>\u003ctd>\u003cp>ストーリーズのみ（できれば）\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>土\u003c/p>\u003c/td>\u003ctd>\u003cp>まとめて撮影（来週の3本分）\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>日\u003c/p>\u003c/td>\u003ctd>\u003cp>まとめて編集＋週の振り返り30分（第7章）\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>投稿の本数は、第2章で書いた「使える時間」から逆算して決めます。多めに組むより、続けられる本数で始めるほうが結果につながります。続かないときや気持ちが落ちたときは、一人で抱えずセッションでコーチに話してください。\u003c/p>\n\u003ch2 id=\"lesson-07-s9\">5-6 よくあるつまずき5つ\u003c/h2>\n\u003cp class=\"list-item\">\u003cstrong>案内だけの投稿：\u003c/strong> まだ知られていない段階で「募集します」を出しても、届きません\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>テーマがぶれる：\u003c/strong> 昨日はレシピ、今日は投資、明日は旅行…だと、何のアカウントか伝わりません。第3章で決めた方向性の一文に戻りましょう\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>そのままコピー：\u003c/strong> 構成を参考にするのはOKですが、文章や映像の丸写しは信頼も規約も損ないます\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>自分の話だけ：\u003c/strong> 信頼してもらう投稿は、「ペルソナに関係のある自分の話」にしましょう\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>完璧を目指して出せない：\u003c/strong> 60点で出して、数字を見て直す。これがSTEP2の考え方です\u003c/p>\n\u003ch2 id=\"lesson-07-s10\">第5章 ワーク\u003c/h2>\n\u003cp>\u003cstrong>書く場所と目安\u003c/strong>\u003c/p>\n\u003cp class=\"list-item\">「⑦リール分解」タブ：ベンチマークの伸びているリールを分解する（目安5本・2〜3時間）\u003c/p>\n\u003cp class=\"list-item\">「⑧コンテンツ設計」タブ：ネタ30本と、台本2本分を書く（1.5〜2時間）\u003c/p>\n\u003cp class=\"list-item\">同じタブの週間カレンダーを埋めて、投稿のペースをコーチと決める\u003c/p>\n\u003cp>投稿を始めたら、「⑨KPI・週次PDCA」タブの投稿の記録に、1本ずつ書いていきましょう（数字の見方は第7章）。\u003c/p>\n\u003cp>終わったら「全体マップ・進捗チェック」タブで第5章に印をつけてください。\u003c/p>", "text": "この章のゴール\n投稿の3つの種類と、今の自分に合う比率がわかる\nネタストックが30本ある\n伸びているリールを分解して、自分の台本を書ける\n毎週の投稿の流れ（カレンダー）が決まっている\n所要時間の目安： 読む 40分／ワーク 3〜5時間（数日に分けてOK）\n5-1 講義：投稿には3つの種類がある\nすべての投稿は、目的ごとに3つに分けられます。\n種類\n目的\n主な形式\n知ってもらう投稿（認知）\nフォロワー以外の人に届ける。検索されるテーマ、流行り、強い冒頭\nリール\n信頼してもらう投稿（信頼）\nすでに見てくれている人との関係を深める。自分のストーリー、価値観、失敗談、お客さんの変化\nフィード・ストーリーズ\n案内する投稿（販売）\n商品・特典・公式LINEを案内する。STEP3〜4で本格的に使う\nストーリーズ・リール\n商品も特典もまだないうちは、案内する投稿は出さなくて大丈夫です。比率の目安は次のとおりです。\n立ち上げの時期： 知ってもらう 9：信頼してもらう 1：案内 0\n公式LINEができたあと（第9章〜）： 知ってもらう 5：信頼してもらう 3：案内 2\n5-2 実践：ネタの作り方（まずは競合の伸びている投稿から）\nネタ切れは、才能ではなく仕組みの問題です。ネタの出どころ（蛇口）は3つありますが、最初は1つ目の「競合の伸びている投稿」から作るのがいちばん大切です。 すでに伸びることがわかっているテーマなので、当たりやすいからです。\n競合の伸びている投稿から（まずはここ）： 第3章で見つけた伸びている投稿を、自分のペルソナや経験に合わせて作り直す\nペルソナの悩みから（慣れてきたら）： 第4章で書いたペルソナの悩みをもとに、自分でテーマを考える\n自分の日常から（慣れてきたら）： 今日あったこと、気づいたこと、よく聞かれることを、ペルソナに役立つ形に変える\n2と3は、あなたらしいオリジナルの投稿になりやすい反面、伸びるかどうかは出してみないとわかりません。競合からのネタで投稿に慣れてきたら、少しずつ混ぜていきましょう。\nまずはネタを30本、ワークシートに書き出しましょう。どの蛇口から出たネタかも一緒に記録しておくと、あとで分析しやすくなります。\n5-3 実践：伸びているリールを1本まるごと分解する\n自分のリールを作る前に、第3章のベンチマーク（合う度4以上）から伸びているリールを選んで、秒単位で分解してみましょう。数本分解してから作ると、自分の1本目の質が大きく変わります。目安は5本です。\n区切り\n見るところ\n考えること\n入り口\n表紙画像・1行目の文字（文字の量・色・顔の有無）\nなぜ指が止まるのか\n0〜3秒\n冒頭のセリフと映像\nどの型の冒頭か（5-4のフックの型を参照）\n3〜15秒\n文字の量、テンポ、情報の順番\n離れさせない工夫は何か\n15秒〜\nオチ・まとめ・意外性\n最後まで見る理由は何か\n最後の一言（あれば）\n保存？フォロー？コメント？\nなぜその行動を促しているのか\n全体\n秒数・カット数・声（自分の声／AI音声／なし）・BGM\nテンポの正体は何か\n世界観\n色味・発信者の見せ方\n一目で「この人」とわかる要素は何か\nそれぞれの区切りごとに「自分ならどうするか」を一言書いておくと、そのまま次の台本づくりに使えます。ワークシートに記入例があるので、参考にしてください。\n5-4 実践：投稿の型と台本\n冒頭3秒で止める（フック）\nリールでは、見る人の多くが冒頭の数秒で離れていきます。冒頭で「自分に関係ある」「続きが気になる」と思ってもらうための工夫を、フックといいます。よく使われる型は次の10個です。\n型\n基本の形\n例\n数字型\n〇〇がN個／N分／N円\n家事が1日30分になる3つの仕組み\n警告型\nその〇〇、逆効果です\nその作り置き、逆に時間を奪ってます\n共感型\n毎日〇〇な人へ\n毎晩、寝かしつけで一日が終わる人へ\n意外性型\n〇〇のコツは、△△しないこと\n時短のコツは、頑張らないことでした\n実績型\nN日で〇〇できた方法\n家事90分→30分にした仕組み\n質問型\nなんで〇〇か知ってますか？\nなんで毎日冷蔵庫の前で悩むか知ってますか？\n結果先出し型\n変化の前と後を最初に見せる\n散らかった台所→片付いた台所を冒頭で重ねる\n損失回避型\n〇〇しないと損してます\nこの設定をしていないと洗濯で毎日10分損してます\n限定・新情報型\n今だけ／最新の〇〇\n2026年版・買ってよかった時短家電\nストーリー型\n私、〇〇でした\n私、家事に1日90分かけてました\n台本は5つのまとまりで作る\n1本のリールは、次の流れで組み立てると作りやすくなります。秒数はあくまで目安です。\nまとまり\n役割\n目安\n書き方のコツ\n①冒頭（フック）\n指を止める\n0〜3秒\n上の10の型から選ぶ。結果や気持ちを先に\n②共感・問題提起\n「私のことだ」と思ってもらう\n3〜8秒\nペルソナの深層の悩みの言葉をそのまま使う\n③本編\n冒頭で約束したことを回収する\n8〜30秒\n手順は3つまで。1画面の文字は12文字以内。1カット2秒以内\n④オチ・変化\n「見てよかった」と思ってもらう\n30〜40秒\n変化の証拠、または意外な一言\n⑤最後の一言（入れる場合）\n次の行動につなげる\n2〜3秒\n最初のうちは「保存して今夜やってみて」など。入れない投稿があっても構いません\n1投稿に伝えることは1つ。 詰め込みすぎないことが、最後まで見てもらうコツです。\n5-5 発信を習慣にする\n続けるための仕組みは教科書で、続ける力の部分はコーチと一緒に作ります。\n週間カレンダー： 週の初めに「何曜日にどのネタを出すか」をネタストックから割り当てる\nまとめて作る： 毎日1本ずつ作るより、週に1回まとめて撮影・編集するほうが続きやすくなります。撮影する日と編集する日を分けるのもおすすめです\n習慣クエストとつなげる： 第0章でコーチと決めた毎日の習慣クエストに、投稿の作業を組み込む\n週間カレンダーの例（週で3本投稿する場合）：\n曜日\nやること\n月・水・金\n投稿\n火・木\nストーリーズのみ（できれば）\n土\nまとめて撮影（来週の3本分）\n日\nまとめて編集＋週の振り返り30分（第7章）\n投稿の本数は、第2章で書いた「使える時間」から逆算して決めます。多めに組むより、続けられる本数で始めるほうが結果につながります。続かないときや気持ちが落ちたときは、一人で抱えずセッションでコーチに話してください。\n5-6 よくあるつまずき5つ\n案内だけの投稿： まだ知られていない段階で「募集します」を出しても、届きません\nテーマがぶれる： 昨日はレシピ、今日は投資、明日は旅行…だと、何のアカウントか伝わりません。第3章で決めた方向性の一文に戻りましょう\nそのままコピー： 構成を参考にするのはOKですが、文章や映像の丸写しは信頼も規約も損ないます\n自分の話だけ： 信頼してもらう投稿は、「ペルソナに関係のある自分の話」にしましょう\n完璧を目指して出せない： 60点で出して、数字を見て直す。これがSTEP2の考え方です\n第5章 ワーク\n書く場所と目安\n「⑦リール分解」タブ：ベンチマークの伸びているリールを分解する（目安5本・2〜3時間）\n「⑧コンテンツ設計」タブ：ネタ30本と、台本2本分を書く（1.5〜2時間）\n同じタブの週間カレンダーを埋めて、投稿のペースをコーチと決める\n投稿を始めたら、「⑨KPI・週次PDCA」タブの投稿の記録に、1本ずつ書いていきましょう（数字の見方は第7章）。\n終わったら「全体マップ・進捗チェック」タブで第5章に印をつけてください。", "minutes": 6}, {"id": "lesson-08", "title": "第6章 編集ツール（CapCut・Canva）", "group": "STEP2 発信で伸ばす", "headings": [{"id": "lesson-08-s1", "title": "この章のゴール", "level": 2}, {"id": "lesson-08-s2", "title": "6-1 2つのツールの役割分担", "level": 2}, {"id": "lesson-08-s3", "title": "6-2 CapCut（リールづくり）", "level": 2}, {"id": "lesson-08-s4", "title": "基本の順番：カット → 文字 → 音 → 書き出し", "level": 3}, {"id": "lesson-08-s5", "title": "CapCutを有料版で使う理由", "level": 3}, {"id": "lesson-08-s6", "title": "6-3 Canva（投稿画像づくり）", "level": 2}, {"id": "lesson-08-s7", "title": "基本の作り方", "level": 3}, {"id": "lesson-08-s8", "title": "Canvaは無料版から始められる", "level": 3}, {"id": "lesson-08-s9", "title": "6-4 制作の流れと時短", "level": 2}, {"id": "lesson-08-s10", "title": "第6章 ワーク", "level": 2}], "html": "\u003ch2 id=\"lesson-08-s1\">この章のゴール\u003c/h2>\n\u003cp class=\"list-item\">人に頼まず、自分でリール動画と投稿画像を作れる\u003c/p>\n\u003cp class=\"list-item\">CapCutとCanvaの役割を理解して、使い分けられる\u003c/p>\n\u003cp>\u003cstrong>所要時間の目安：\u003c/strong> 読む 30分／ワーク 2〜3時間\u003c/p>\n\u003cp>※アプリの料金・プラン・無料で使える範囲は変わることがあります。契約前に付録「最新情報」と公式サイトを確認してください。\u003c/p>\n\u003ch2 id=\"lesson-08-s2\">6-1 2つのツールの役割分担\u003c/h2>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>ツール\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>担当\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>この教科書での前提\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>CapCut\u003c/p>\u003c/td>\u003ctd>\u003cp>動画（リール）。カット、文字入れ、音の調整に強い。動くものはこちら\u003c/p>\u003c/td>\u003ctd>\u003cp>有料版\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>Canva\u003c/p>\u003c/td>\u003ctd>\u003cp>画像（フィード・カルーセル）。テンプレートと素材が豊富で、デザインの知識がなくても形になる。止まっているものはこちら\u003c/p>\u003c/td>\u003ctd>\u003cp>無料版から（必要に応じて有料版）\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>有料・無料を分けている理由は、\u003cstrong>お金をかけるべきところが違う\u003c/strong>からです。CapCutの無料版は、ロゴの透かしが入ることがあり、それが投稿の届き方に影響します。Canvaは無料版でも投稿画像を作れるので、まずは無料版から始めて、必要に応じて有料版を検討すれば大丈夫です。\u003c/p>\n\u003cp>リールは「知ってもらう」入り口、フィード画像は「保存される」資産と、役割が違うので、両方使えるようになっておくと安心です。\u003c/p>\n\u003ch2 id=\"lesson-08-s3\">6-2 CapCut（リールづくり）\u003c/h2>\n\u003ch3 id=\"lesson-08-s4\">基本の順番：カット → 文字 → 音 → 書き出し\u003c/h3>\n\u003cp>この順番で作ると、作り直しが減ります。先に飾りを入れてからカットすると、位置もタイミングもずれてしまいます。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>カット：\u003c/strong> 再生バーを合わせて分割し、いらない部分を削除する。「間」や言いよどみを削るだけで、見やすさが大きく変わります\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>文字（テロップ）：\u003c/strong> 音を出さずに見る人が多いので、文字は入れましょう。画面の上下はInstagramのアカウント名やボタンで隠れるので、中央寄りに置きます\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>文字のデザインをそろえる：\u003c/strong> フォント・色・縁取りは、できるだけ統一しましょう。そろっていると「この人の投稿だ」と気づいてもらいやすくなります。決めたらテンプレートとして保存しておくと便利です\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>音：\u003c/strong> BGMは小さめ（声のじゃまをしない音量）。効果音は場面が変わるところに絞ると見やすくなります。音源は、CapCutの中の音源やフリー音源のほか、投稿するときにInstagramの音源をつける方法もあります。市販の曲を使う場合は、削除などのリスクがあることも知っておきましょう\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>書き出し：\u003c/strong> 撮影した動画と同じ画質で書き出すのが基本です（4Kで撮影できるなら4Kがベスト）。書き出したらスマホで再生して、文字が読めるか、音量はちょうどよいかを確認してから投稿します\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>画面いっぱいに作る：\u003c/strong> 上下に黒い帯が入った動画は最後まで見られにくくなります。素材は縦9：横16の縦型で用意します\u003c/p>\n\u003ch3 id=\"lesson-08-s5\">CapCutを有料版で使う理由\u003c/h3>\n\u003cp class=\"list-item\">\u003cstrong>透かし（ロゴ）が届き方に影響する：\u003c/strong> 他のアプリのロゴや透かしが入った動画は、Instagramで「他の場所からの転載」と見なされ、おすすめに載りにくくなると言われています。中身が良くても、この一点で見てもらえる人数が減ってしまいます\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>無料版では透かしが入ることがある：\u003c/strong> 常に入るわけではありませんが、テンプレートや一部の素材が原因で入ることがあります。毎回確認するのは大変なので、最初から有料版で作るほうが安心です\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>そのほかの良いところ：\u003c/strong> 有料の素材・テンプレート・フォントが使える、高画質で書き出せる、AI機能が使える、など\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>プランの選び方：\u003c/strong> 透かしを消すだけなら、いちばん手頃な有料プランで十分です。素材やAI機能まで使いたい場合は上のプランを検討します（※プラン名と料金は最新情報を確認）\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>仕事として納品する場合：\u003c/strong> 使った素材や音源が商用利用できるかを、個別に確認しましょう\u003c/p>\n\u003ch2 id=\"lesson-08-s6\">6-3 Canva（投稿画像づくり）\u003c/h2>\n\u003ch3 id=\"lesson-08-s7\">基本の作り方\u003c/h3>\n\u003cp class=\"list-item\">\u003cstrong>サイズ：\u003c/strong> Instagramの投稿は縦長（横4：縦5）で作ると、タイムラインで大きく表示されます。プロフィールの一覧では切り取られて表示されるので、顔や大事な文字は中央に置きます（※表示の仕様は最新情報を確認）\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>テンプレート：\u003c/strong> ゼロから作らず、テンプレートを土台にします。そのまま使うと他のアカウントと見た目がかぶるので、色とフォントは自分のものに変えましょう\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>王冠マーク：\u003c/strong> 王冠マークがついたテンプレート・素材・フォントは、有料版で使えるものです。無料版で進める場合は、選ぶ段階でマークを確認しておくと、作ったあとに「使えなかった」となりません。自分の投稿に合うスタイルで選びましょう\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>素材：\u003c/strong> 「素材」タブから言葉で検索します。「あしらい」で検索すると、すきまを埋める小さな飾りが出てきます\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>文字：\u003c/strong> 誰でも読みやすい書体を基本に、スマホで読める大きさに。飾りは一番見せたい一言だけに使います\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>カルーセル：\u003c/strong> Ctrl+D（MacはCmd+D）でページを複製、Shift+Rでガイド線を出して位置をそろえます。1枚目で止まってもらえないと、2枚目以降は見られません\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>保存：\u003c/strong> PNGで保存し、スマホで開いて文字が読めるか確認します\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>作る順番：\u003c/strong> 背景 → 図形 → 写真 → 文字 → ガイド線で位置をそろえる → 保存\u003c/p>\n\u003ch3 id=\"lesson-08-s8\">Canvaは無料版から始められる\u003c/h3>\n\u003cp class=\"list-item\">テンプレート・文字入れ・図形・画像の配置・保存は、無料版でもできます\u003c/p>\n\u003cp class=\"list-item\">背景を消す機能や王冠マークの素材など、有料版で使える機能もあります。作りたい投稿に合わせて、必要なら有料版も検討してください（※無料版と有料版の違いは最新情報を確認）\u003c/p>\n\u003ch2 id=\"lesson-08-s9\">6-4 制作の流れと時短\u003c/h2>\n\u003cp class=\"list-item\">\u003cstrong>リール：\u003c/strong> 台本 → 撮影または素材集め → カット → 文字 → 音 → 書き出し → スマホで確認。慣れれば1本30分前後まで短くなります\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>画像：\u003c/strong> 1枚作ったら自分用テンプレートとして保存し、次からは複製して中身だけ差し替える\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>どこまで作り込むか：\u003c/strong> 編集の出来より、投稿を続けることのほうが大事です。60点で出し続けるほうが、100点を月に1本出すよりも結果につながります\u003c/p>\n\u003ch2 id=\"lesson-08-s10\">第6章 ワーク\u003c/h2>\n\u003cp>\u003cstrong>目安：\u003c/strong> 2〜3時間\u003c/p>\n\u003cp class=\"list-item\">CapCutの有料プランに登録する\u003c/p>\n\u003cp class=\"list-item\">透かしのないリールを1本書き出す\u003c/p>\n\u003cp class=\"list-item\">Canvaで投稿画像を1枚作る\u003c/p>\n\u003cp>終わったら「全体マップ・進捗チェック」タブで第6章に印をつけてください。\u003c/p>", "text": "この章のゴール\n人に頼まず、自分でリール動画と投稿画像を作れる\nCapCutとCanvaの役割を理解して、使い分けられる\n所要時間の目安： 読む 30分／ワーク 2〜3時間\n※アプリの料金・プラン・無料で使える範囲は変わることがあります。契約前に付録「最新情報」と公式サイトを確認してください。\n6-1 2つのツールの役割分担\nツール\n担当\nこの教科書での前提\nCapCut\n動画（リール）。カット、文字入れ、音の調整に強い。動くものはこちら\n有料版\nCanva\n画像（フィード・カルーセル）。テンプレートと素材が豊富で、デザインの知識がなくても形になる。止まっているものはこちら\n無料版から（必要に応じて有料版）\n有料・無料を分けている理由は、お金をかけるべきところが違うからです。CapCutの無料版は、ロゴの透かしが入ることがあり、それが投稿の届き方に影響します。Canvaは無料版でも投稿画像を作れるので、まずは無料版から始めて、必要に応じて有料版を検討すれば大丈夫です。\nリールは「知ってもらう」入り口、フィード画像は「保存される」資産と、役割が違うので、両方使えるようになっておくと安心です。\n6-2 CapCut（リールづくり）\n基本の順番：カット → 文字 → 音 → 書き出し\nこの順番で作ると、作り直しが減ります。先に飾りを入れてからカットすると、位置もタイミングもずれてしまいます。\nカット： 再生バーを合わせて分割し、いらない部分を削除する。「間」や言いよどみを削るだけで、見やすさが大きく変わります\n文字（テロップ）： 音を出さずに見る人が多いので、文字は入れましょう。画面の上下はInstagramのアカウント名やボタンで隠れるので、中央寄りに置きます\n文字のデザインをそろえる： フォント・色・縁取りは、できるだけ統一しましょう。そろっていると「この人の投稿だ」と気づいてもらいやすくなります。決めたらテンプレートとして保存しておくと便利です\n音： BGMは小さめ（声のじゃまをしない音量）。効果音は場面が変わるところに絞ると見やすくなります。音源は、CapCutの中の音源やフリー音源のほか、投稿するときにInstagramの音源をつける方法もあります。市販の曲を使う場合は、削除などのリスクがあることも知っておきましょう\n書き出し： 撮影した動画と同じ画質で書き出すのが基本です（4Kで撮影できるなら4Kがベスト）。書き出したらスマホで再生して、文字が読めるか、音量はちょうどよいかを確認してから投稿します\n画面いっぱいに作る： 上下に黒い帯が入った動画は最後まで見られにくくなります。素材は縦9：横16の縦型で用意します\nCapCutを有料版で使う理由\n透かし（ロゴ）が届き方に影響する： 他のアプリのロゴや透かしが入った動画は、Instagramで「他の場所からの転載」と見なされ、おすすめに載りにくくなると言われています。中身が良くても、この一点で見てもらえる人数が減ってしまいます\n無料版では透かしが入ることがある： 常に入るわけではありませんが、テンプレートや一部の素材が原因で入ることがあります。毎回確認するのは大変なので、最初から有料版で作るほうが安心です\nそのほかの良いところ： 有料の素材・テンプレート・フォントが使える、高画質で書き出せる、AI機能が使える、など\nプランの選び方： 透かしを消すだけなら、いちばん手頃な有料プランで十分です。素材やAI機能まで使いたい場合は上のプランを検討します（※プラン名と料金は最新情報を確認）\n仕事として納品する場合： 使った素材や音源が商用利用できるかを、個別に確認しましょう\n6-3 Canva（投稿画像づくり）\n基本の作り方\nサイズ： Instagramの投稿は縦長（横4：縦5）で作ると、タイムラインで大きく表示されます。プロフィールの一覧では切り取られて表示されるので、顔や大事な文字は中央に置きます（※表示の仕様は最新情報を確認）\nテンプレート： ゼロから作らず、テンプレートを土台にします。そのまま使うと他のアカウントと見た目がかぶるので、色とフォントは自分のものに変えましょう\n王冠マーク： 王冠マークがついたテンプレート・素材・フォントは、有料版で使えるものです。無料版で進める場合は、選ぶ段階でマークを確認しておくと、作ったあとに「使えなかった」となりません。自分の投稿に合うスタイルで選びましょう\n素材： 「素材」タブから言葉で検索します。「あしらい」で検索すると、すきまを埋める小さな飾りが出てきます\n文字： 誰でも読みやすい書体を基本に、スマホで読める大きさに。飾りは一番見せたい一言だけに使います\nカルーセル： Ctrl+D（MacはCmd+D）でページを複製、Shift+Rでガイド線を出して位置をそろえます。1枚目で止まってもらえないと、2枚目以降は見られません\n保存： PNGで保存し、スマホで開いて文字が読めるか確認します\n作る順番： 背景 → 図形 → 写真 → 文字 → ガイド線で位置をそろえる → 保存\nCanvaは無料版から始められる\nテンプレート・文字入れ・図形・画像の配置・保存は、無料版でもできます\n背景を消す機能や王冠マークの素材など、有料版で使える機能もあります。作りたい投稿に合わせて、必要なら有料版も検討してください（※無料版と有料版の違いは最新情報を確認）\n6-4 制作の流れと時短\nリール： 台本 → 撮影または素材集め → カット → 文字 → 音 → 書き出し → スマホで確認。慣れれば1本30分前後まで短くなります\n画像： 1枚作ったら自分用テンプレートとして保存し、次からは複製して中身だけ差し替える\nどこまで作り込むか： 編集の出来より、投稿を続けることのほうが大事です。60点で出し続けるほうが、100点を月に1本出すよりも結果につながります\n第6章 ワーク\n目安： 2〜3時間\nCapCutの有料プランに登録する\n透かしのないリールを1本書き出す\nCanvaで投稿画像を1枚作る\n終わったら「全体マップ・進捗チェック」タブで第6章に印をつけてください。", "minutes": 5}, {"id": "lesson-09", "title": "第7章 分析・改善", "group": "STEP2 発信で伸ばす", "headings": [{"id": "lesson-09-s1", "title": "この章のゴール", "level": 2}, {"id": "lesson-09-s2", "title": "7-1 講義：伸ばすとは「当たりを再現すること」", "level": 2}, {"id": "lesson-09-s3", "title": "7-2 実践：インサイトの見方", "level": 2}, {"id": "lesson-09-s4", "title": "まず見るのは3つだけ", "level": 3}, {"id": "lesson-09-s5", "title": "7-3 慣れてきたら：つながりの流れを見る", "level": 2}, {"id": "lesson-09-s6", "title": "7-4 実践：週に1回の振り返り（4つのステップ）", "level": 2}, {"id": "lesson-09-s7", "title": "7-5 数字が伸びないときの打ち手", "level": 2}, {"id": "lesson-09-s8", "title": "まずは、数字に合わせて直す", "level": 3}, {"id": "lesson-09-s9", "title": "それでも伸びないときに試せること", "level": 3}, {"id": "lesson-09-s10", "title": "第7章 ワーク", "level": 2}], "html": "\u003ch2 id=\"lesson-09-s1\">この章のゴール\u003c/h2>\n\u003cp>投稿しっぱなしにせず、数字を見て「次に何をするか」を自分で決められるようになる。ここがSTEP2のゴールです。\u003c/p>\n\u003cp>\u003cstrong>所要時間の目安：\u003c/strong> 読む 40分／ワーク 毎週30分\u003c/p>\n\u003cp>※インサイト（投稿の数字を確認できる画面）の表示や項目名は、アップデートで変わることがあります。今の画面の見方は付録「最新情報」を確認してください。\u003c/p>\n\u003ch2 id=\"lesson-09-s2\">7-1 講義：伸ばすとは「当たりを再現すること」\u003c/h2>\n\u003cp>投稿を続けていると、「なぜか伸びた1本」が出てきます。それを偶然で終わらせず、「なぜ伸びたのか」を考えて同じ型で何度も出す。伸ばす技術とは、当たりを再現する技術です。そのために数字（インサイト）を見ます。\u003c/p>\n\u003cp>\u003cstrong>見るのは「数」より「率」です。\u003c/strong> 今のInstagramは、いいねの総数よりも「見た人のうち何％が行動したか」を大事にして投稿を広げていると言われています。率はインサイトに表示されるので、自分で計算しなくても大丈夫です。\u003c/p>\n\u003ch2 id=\"lesson-09-s3\">7-2 実践：インサイトの見方\u003c/h2>\n\u003ch3 id=\"lesson-09-s4\">まず見るのは3つだけ\u003c/h3>\n\u003cp>インサイトにはたくさんの数字が並んでいますが、最初は次の3つだけ見れば大丈夫です。どれも、自分の工夫で直せる数字です。\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>数字\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>表していること\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>悪いときに見直すところ\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>スキップ率\u003c/p>\u003c/td>\u003ctd>\u003cp>冒頭3秒以内に離れた人の割合。冒頭の強さ\u003c/p>\u003c/td>\u003ctd>\u003cp>冒頭\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>平均視聴時間・視聴の維持\u003c/p>\u003c/td>\u003ctd>\u003cp>最後まで見られたか。展開の強さ\u003c/p>\u003c/td>\u003ctd>\u003cp>構成（テンポ・長さ・情報の順番）\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>保存\u003c/p>\u003c/td>\u003ctd>\u003cp>「あとで役立つ」と思われたか\u003c/p>\u003c/td>\u003ctd>\u003cp>ネタ\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>目安（参考程度に）：\u003c/strong> スキップ率 50％以下／平均視聴時間・視聴の維持 50％以上／保存率 2％以上\u003c/p>\n\u003cp>いいねやコメントは、見た人の好みに左右されやすく、自分ではコントロールしにくい数字です。最初のうちは、あまり気にしすぎなくて大丈夫です。\u003c/p>\n\u003cp>数字の良し悪しは、ジャンルやアカウントの規模で大きく変わります。まずは\u003cstrong>自分の過去10投稿の平均\u003c/strong>を基準にして、それより上か下かで判断しましょう。上の目安は、あくまで参考として使ってください（※目安は時期で変わることがあるので、最新情報も確認）。\u003c/p>\n\u003ch2 id=\"lesson-09-s5\">7-3 慣れてきたら：つながりの流れを見る\u003c/h2>\n\u003cp>最初は7-2の3つだけで大丈夫です。数字を見るのに慣れてきたら、フォロワーの数だけでなく、「見た人がどれだけ次の段階へ進んだか」も見てみましょう。\u003c/p>\n\u003cp class=\"list-item\">フォロワー以外に届いているか（フォロワー以外の割合、スキップ率、シェア率）\u003c/p>\n\u003cp class=\"list-item\">リーチ → プロフィールアクセス率（目安 1〜3％）\u003c/p>\n\u003cp class=\"list-item\">プロフィールアクセス → フォロー率（目安 5〜10％）\u003c/p>\n\u003cp class=\"list-item\">フォロワー → 公式LINE登録率（STEP3から計測）\u003c/p>\n\u003cp class=\"list-item\">公式LINE登録 → 成約率（STEP4で計測）\u003c/p>\n\u003cp>この流れが、第1章で学んだ「知ってもらう → 信頼してもらう → つながる → 選んでもらう」を数字で表したものです。どこかの率が極端に低ければ、そこが直す場所です。1が低いままだと、2〜5をいくら良くしても届く人数が増えません。\u003c/p>\n\u003cp>※目安の数字は一般的な参考値です。Instagramは公式の基準値を出していないので、自分の数字の変化を、コーチと一緒に見ながら判断していきましょう。\u003c/p>\n\u003ch2 id=\"lesson-09-s6\">7-4 実践：週に1回の振り返り（4つのステップ）\u003c/h2>\n\u003cp>週に1回、30分。ワークシート「⑨KPI・週次PDCA」タブで、次の4つを回します。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>投稿を記録する：\u003c/strong> 今週出した本数と中身（テーマ・形式・冒頭の型）を書く\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>数字を確認する：\u003c/strong> 7-2の3つ（スキップ率・平均視聴時間・保存）を書き写し、いちばん良かった投稿（TOP1）と、いちばん伸びなかった投稿（WORST1）を決める\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>理由を考える：\u003c/strong> 3つのどの数字が良かった（悪かった）かを見て、冒頭・構成・ネタのどこが理由かを考える\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>来週に生かす：\u003c/strong> 来週の投稿計画に反映する（伸びた型を増やす、伸びなかった型をやめる、冒頭を差し替える）。冒頭の良し悪しに迷ったら、フォロワー以外にだけ試しに出せる「トライアルリール」で2パターンを比べてみるのもおすすめです（※機能の有無は最新情報を確認）\u003c/p>\n\u003cp>このシートをコーチとの週次セッションに持ち込んで、「なぜ伸びた？」を一緒に考えると、改善のスピードが上がります。\u003c/p>\n\u003ch2 id=\"lesson-09-s7\">7-5 数字が伸びないときの打ち手\u003c/h2>\n\u003ch3 id=\"lesson-09-s8\">まずは、数字に合わせて直す\u003c/h3>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>数字が悪いとき\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>見直すこと\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>スキップ率\u003c/p>\u003c/td>\u003ctd>\u003cp>冒頭を見直す（第5章のフックの型を変えてみる、結論を先に出す）\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>平均視聴時間・視聴の維持\u003c/p>\u003c/td>\u003ctd>\u003cp>構成を見直す（テンポを上げる、長さを削る、情報の順番を変える）\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>保存\u003c/p>\u003c/td>\u003ctd>\u003cp>ネタを見直す（第3章のベンチマークの伸びている投稿に戻る）\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"lesson-09-s9\">それでも伸びないときに試せること\u003c/h3>\n\u003cp class=\"list-item\">伸びた投稿を作り直す（同じテーマで、冒頭を変える）\u003c/p>\n\u003cp class=\"list-item\">トライアルリールで冒頭違いを比べる\u003c/p>\n\u003cp class=\"list-item\">シリーズにする（「10分家事 #12」のような形）\u003c/p>\n\u003cp class=\"list-item\">「〇〇な友達に送ってあげたい」と思えるように、具体的な相手を想定して作る\u003c/p>\n\u003cp class=\"list-item\">投稿時間を変えてみる\u003c/p>\n\u003cp class=\"list-item\">質問で締めて、コメントやDMに返信する\u003c/p>\n\u003cp class=\"list-item\">ベンチマークを探し直す（今伸びているものをもう一度リサーチ）\u003c/p>\n\u003cp>\u003cstrong>気をつけたいこと\u003c/strong>（※時期で変わりやすいので、最新情報も確認）\u003c/p>\n\u003cp class=\"list-item\">ハッシュタグは、投稿の内容に合ったものをつけるのがおすすめです（つけ方のルールは変わることがあります）\u003c/p>\n\u003cp class=\"list-item\">他の人のコンテンツの転載や、同じものの使い回しばかりだと、おすすめに載りにくくなる\u003c/p>\n\u003cp class=\"list-item\">自分の顔・声・体験といった「その人らしさ」がある発信が評価されやすい流れになっている\u003c/p>\n\u003cp>数字が伸びない時期は、打ち手より先に気持ちが落ちてしまうこともあります。そんなときは一人で抱えず、セッションでコーチに話してください。\u003c/p>\n\u003ch2 id=\"lesson-09-s10\">第7章 ワーク\u003c/h2>\n\u003cp>\u003cstrong>書く場所：\u003c/strong> ワークシート「⑨KPI・週次PDCA」タブ　\u003cstrong>目安：\u003c/strong> 毎週30分\u003c/p>\n\u003cp class=\"list-item\">週に1回の振り返りを2週続けて回す\u003c/p>\n\u003cp class=\"list-item\">伸びた投稿の「型」を1つ見つけて、同じ型でもう一度出してみる\u003c/p>\n\u003cp class=\"list-item\">「来週やること」を1つ、自分の言葉で書く\u003c/p>\n\u003cp>終わったら「全体マップ・進捗チェック」タブで第7章に印をつけてください。\u003c/p>\n\u003cp>\u003cstrong>これでSTEP2は修了です。あなたは「作って、出して、直せる」発信者になりました。\u003c/strong>\u003c/p>", "text": "この章のゴール\n投稿しっぱなしにせず、数字を見て「次に何をするか」を自分で決められるようになる。ここがSTEP2のゴールです。\n所要時間の目安： 読む 40分／ワーク 毎週30分\n※インサイト（投稿の数字を確認できる画面）の表示や項目名は、アップデートで変わることがあります。今の画面の見方は付録「最新情報」を確認してください。\n7-1 講義：伸ばすとは「当たりを再現すること」\n投稿を続けていると、「なぜか伸びた1本」が出てきます。それを偶然で終わらせず、「なぜ伸びたのか」を考えて同じ型で何度も出す。伸ばす技術とは、当たりを再現する技術です。そのために数字（インサイト）を見ます。\n見るのは「数」より「率」です。 今のInstagramは、いいねの総数よりも「見た人のうち何％が行動したか」を大事にして投稿を広げていると言われています。率はインサイトに表示されるので、自分で計算しなくても大丈夫です。\n7-2 実践：インサイトの見方\nまず見るのは3つだけ\nインサイトにはたくさんの数字が並んでいますが、最初は次の3つだけ見れば大丈夫です。どれも、自分の工夫で直せる数字です。\n数字\n表していること\n悪いときに見直すところ\nスキップ率\n冒頭3秒以内に離れた人の割合。冒頭の強さ\n冒頭\n平均視聴時間・視聴の維持\n最後まで見られたか。展開の強さ\n構成（テンポ・長さ・情報の順番）\n保存\n「あとで役立つ」と思われたか\nネタ\n目安（参考程度に）： スキップ率 50％以下／平均視聴時間・視聴の維持 50％以上／保存率 2％以上\nいいねやコメントは、見た人の好みに左右されやすく、自分ではコントロールしにくい数字です。最初のうちは、あまり気にしすぎなくて大丈夫です。\n数字の良し悪しは、ジャンルやアカウントの規模で大きく変わります。まずは自分の過去10投稿の平均を基準にして、それより上か下かで判断しましょう。上の目安は、あくまで参考として使ってください（※目安は時期で変わることがあるので、最新情報も確認）。\n7-3 慣れてきたら：つながりの流れを見る\n最初は7-2の3つだけで大丈夫です。数字を見るのに慣れてきたら、フォロワーの数だけでなく、「見た人がどれだけ次の段階へ進んだか」も見てみましょう。\nフォロワー以外に届いているか（フォロワー以外の割合、スキップ率、シェア率）\nリーチ → プロフィールアクセス率（目安 1〜3％）\nプロフィールアクセス → フォロー率（目安 5〜10％）\nフォロワー → 公式LINE登録率（STEP3から計測）\n公式LINE登録 → 成約率（STEP4で計測）\nこの流れが、第1章で学んだ「知ってもらう → 信頼してもらう → つながる → 選んでもらう」を数字で表したものです。どこかの率が極端に低ければ、そこが直す場所です。1が低いままだと、2〜5をいくら良くしても届く人数が増えません。\n※目安の数字は一般的な参考値です。Instagramは公式の基準値を出していないので、自分の数字の変化を、コーチと一緒に見ながら判断していきましょう。\n7-4 実践：週に1回の振り返り（4つのステップ）\n週に1回、30分。ワークシート「⑨KPI・週次PDCA」タブで、次の4つを回します。\n投稿を記録する： 今週出した本数と中身（テーマ・形式・冒頭の型）を書く\n数字を確認する： 7-2の3つ（スキップ率・平均視聴時間・保存）を書き写し、いちばん良かった投稿（TOP1）と、いちばん伸びなかった投稿（WORST1）を決める\n理由を考える： 3つのどの数字が良かった（悪かった）かを見て、冒頭・構成・ネタのどこが理由かを考える\n来週に生かす： 来週の投稿計画に反映する（伸びた型を増やす、伸びなかった型をやめる、冒頭を差し替える）。冒頭の良し悪しに迷ったら、フォロワー以外にだけ試しに出せる「トライアルリール」で2パターンを比べてみるのもおすすめです（※機能の有無は最新情報を確認）\nこのシートをコーチとの週次セッションに持ち込んで、「なぜ伸びた？」を一緒に考えると、改善のスピードが上がります。\n7-5 数字が伸びないときの打ち手\nまずは、数字に合わせて直す\n数字が悪いとき\n見直すこと\nスキップ率\n冒頭を見直す（第5章のフックの型を変えてみる、結論を先に出す）\n平均視聴時間・視聴の維持\n構成を見直す（テンポを上げる、長さを削る、情報の順番を変える）\n保存\nネタを見直す（第3章のベンチマークの伸びている投稿に戻る）\nそれでも伸びないときに試せること\n伸びた投稿を作り直す（同じテーマで、冒頭を変える）\nトライアルリールで冒頭違いを比べる\nシリーズにする（「10分家事 #12」のような形）\n「〇〇な友達に送ってあげたい」と思えるように、具体的な相手を想定して作る\n投稿時間を変えてみる\n質問で締めて、コメントやDMに返信する\nベンチマークを探し直す（今伸びているものをもう一度リサーチ）\n気をつけたいこと（※時期で変わりやすいので、最新情報も確認）\nハッシュタグは、投稿の内容に合ったものをつけるのがおすすめです（つけ方のルールは変わることがあります）\n他の人のコンテンツの転載や、同じものの使い回しばかりだと、おすすめに載りにくくなる\n自分の顔・声・体験といった「その人らしさ」がある発信が評価されやすい流れになっている\n数字が伸びない時期は、打ち手より先に気持ちが落ちてしまうこともあります。そんなときは一人で抱えず、セッションでコーチに話してください。\n第7章 ワーク\n書く場所： ワークシート「⑨KPI・週次PDCA」タブ　目安： 毎週30分\n週に1回の振り返りを2週続けて回す\n伸びた投稿の「型」を1つ見つけて、同じ型でもう一度出してみる\n「来週やること」を1つ、自分の言葉で書く\n終わったら「全体マップ・進捗チェック」タブで第7章に印をつけてください。\nこれでSTEP2は修了です。あなたは「作って、出して、直せる」発信者になりました。", "minutes": 5}, {"id": "lesson-10", "title": "第8章 ファン化", "group": "STEP3 ファンを集める", "headings": [{"id": "lesson-10-s1", "title": "この章のゴール", "level": 2}, {"id": "lesson-10-s2", "title": "8-1 講義：ファンになってもらうための3つのこと", "level": 2}, {"id": "lesson-10-s3", "title": "8-2 実践：ストーリーズを使い始める", "level": 2}, {"id": "lesson-10-s4", "title": "8-3 実践：ハイライトを作る", "level": 2}, {"id": "lesson-10-s5", "title": "8-4 実践：コメントとDM", "level": 2}, {"id": "lesson-10-s6", "title": "第8章 ワーク", "level": 2}], "html": "\u003ch2 id=\"lesson-10-s1\">この章のゴール\u003c/h2>\n\u003cp class=\"list-item\">フォロワーを「数」だけでなく「つながりの濃さ」で見られる\u003c/p>\n\u003cp class=\"list-item\">ストーリーズとハイライトを使い始めている\u003c/p>\n\u003cp class=\"list-item\">コメントやDMが届きやすいアカウントになっている\u003c/p>\n\u003cp>\u003cstrong>所要時間の目安：\u003c/strong> 読む 20分／ワーク 1〜2時間（そのあとは毎週続ける）\u003c/p>\n\u003ch2 id=\"lesson-10-s2\">8-1 講義：ファンになってもらうための3つのこと\u003c/h2>\n\u003cp>人が誰かのファンになるのは、次の3つがそろったときです。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>何度も目にする：\u003c/strong> 投稿やストーリーズで、くり返し目に入る\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>人柄を知る：\u003c/strong> どんな人が、どんな想いで発信しているのかがわかる\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>言っていることが一貫している：\u003c/strong> 発信のテーマや価値観がぶれていない\u003c/p>\n\u003cp>知ってもらう投稿だけのアカウントは、「便利な情報をくれる人」で止まりやすく、商品を選んでもらうところまではなかなか届きません。STEP3では、信頼してもらう投稿とストーリーズで、「あなた自身」を知ってもらうことを少しずつ増やしていきます。\u003c/p>\n\u003ch2 id=\"lesson-10-s3\">8-2 実践：ストーリーズを使い始める\u003c/h2>\n\u003cp>第5章では「フォロワーが少ないうちは無理に出さなくてOK」とお伝えしました。フォロワーが増えて、見てくれる人が出てきたら、使い始めどきです。\u003c/p>\n\u003cp>ストーリーズは、「友だちの近況」のような場所です。作り込んだ広告のようなものより、撮ってそのまま出すような日常のほうが見てもらえることが多いです。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>中身の比率（目安）：\u003c/strong> 役立ち情報 6：日常・裏側 3：案内 1。最初は「見る意味」が伝わる役立ち情報を中心に。ファンが増えてくると、日常や裏側にも価値が生まれていきます\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>使う機能：\u003c/strong> 質問スタンプやアンケート。もらった回答は、次の投稿のネタや商品づくりのヒントになります\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>反応しやすくする：\u003c/strong> 使う機能に合わせて、答えやすい問いかけを工夫する\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>自分のことを伝えるネタ：\u003c/strong> 失敗談、なぜこの発信をしているのか（第2章で整理したことが活きます）、仕事の裏側、お客さんの変化など\u003c/p>\n\u003ch2 id=\"lesson-10-s4\">8-3 実践：ハイライトを作る\u003c/h2>\n\u003cp>第4章で後回しにしたハイライトを、ここで作ります。ハイライトは、プロフィールに来た人が「この人はどんな人？」を知るための場所です。\u003c/p>\n\u003cp>\u003cstrong>まずはこの2つから\u003c/strong>\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>自己紹介：\u003c/strong> 経歴や想いをまとめたストーリーズ数枚\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>特典の案内：\u003c/strong> 公式LINEの登録特典ができたら（第9章）\u003c/p>\n\u003cp>あとはストーリーズを出しながら、「よくある質問」「お客さんの声」などを少しずつ増やしていきます。第3章で記録した「競合がハイライトに何を置いているか」を参考にすると、何を作ればいいかが見えやすくなります。\u003c/p>\n\u003ch2 id=\"lesson-10-s5\">8-4 実践：コメントとDM\u003c/h2>\n\u003cp class=\"list-item\">コメントには、できるだけ返信しましょう。「ありがとうございます」だけでなく、会話が続く一言を添えると、つながりが深まります\u003c/p>\n\u003cp class=\"list-item\">DMでは売り込まず、感謝と質問への丁寧な回答を大切にします。売り込みのDMは、ブロックされる原因になります\u003c/p>\n\u003cp class=\"list-item\">自分からも、同じジャンルのアカウントに丁寧なコメントを残すと、知ってもらうきっかけにもなります\u003c/p>\n\u003ch2 id=\"lesson-10-s6\">第8章 ワーク\u003c/h2>\n\u003cp>\u003cstrong>書く場所：\u003c/strong> ワークシート「⑧コンテンツ設計」タブ　\u003cstrong>目安：\u003c/strong> 1〜2時間\u003c/p>\n\u003cp class=\"list-item\">週間カレンダーに、ストーリーズで何を出すかを書き足す\u003c/p>\n\u003cp class=\"list-item\">質問スタンプかアンケートを1回使ってみる\u003c/p>\n\u003cp class=\"list-item\">ハイライト「自己紹介」を作る\u003c/p>\n\u003cp class=\"list-item\">コメントとDMの返し方を、自分なりに決めておく\u003c/p>\n\u003cp>終わったら「全体マップ・進捗チェック」タブで第8章に印をつけてください。\u003c/p>", "text": "この章のゴール\nフォロワーを「数」だけでなく「つながりの濃さ」で見られる\nストーリーズとハイライトを使い始めている\nコメントやDMが届きやすいアカウントになっている\n所要時間の目安： 読む 20分／ワーク 1〜2時間（そのあとは毎週続ける）\n8-1 講義：ファンになってもらうための3つのこと\n人が誰かのファンになるのは、次の3つがそろったときです。\n何度も目にする： 投稿やストーリーズで、くり返し目に入る\n人柄を知る： どんな人が、どんな想いで発信しているのかがわかる\n言っていることが一貫している： 発信のテーマや価値観がぶれていない\n知ってもらう投稿だけのアカウントは、「便利な情報をくれる人」で止まりやすく、商品を選んでもらうところまではなかなか届きません。STEP3では、信頼してもらう投稿とストーリーズで、「あなた自身」を知ってもらうことを少しずつ増やしていきます。\n8-2 実践：ストーリーズを使い始める\n第5章では「フォロワーが少ないうちは無理に出さなくてOK」とお伝えしました。フォロワーが増えて、見てくれる人が出てきたら、使い始めどきです。\nストーリーズは、「友だちの近況」のような場所です。作り込んだ広告のようなものより、撮ってそのまま出すような日常のほうが見てもらえることが多いです。\n中身の比率（目安）： 役立ち情報 6：日常・裏側 3：案内 1。最初は「見る意味」が伝わる役立ち情報を中心に。ファンが増えてくると、日常や裏側にも価値が生まれていきます\n使う機能： 質問スタンプやアンケート。もらった回答は、次の投稿のネタや商品づくりのヒントになります\n反応しやすくする： 使う機能に合わせて、答えやすい問いかけを工夫する\n自分のことを伝えるネタ： 失敗談、なぜこの発信をしているのか（第2章で整理したことが活きます）、仕事の裏側、お客さんの変化など\n8-3 実践：ハイライトを作る\n第4章で後回しにしたハイライトを、ここで作ります。ハイライトは、プロフィールに来た人が「この人はどんな人？」を知るための場所です。\nまずはこの2つから\n自己紹介： 経歴や想いをまとめたストーリーズ数枚\n特典の案内： 公式LINEの登録特典ができたら（第9章）\nあとはストーリーズを出しながら、「よくある質問」「お客さんの声」などを少しずつ増やしていきます。第3章で記録した「競合がハイライトに何を置いているか」を参考にすると、何を作ればいいかが見えやすくなります。\n8-4 実践：コメントとDM\nコメントには、できるだけ返信しましょう。「ありがとうございます」だけでなく、会話が続く一言を添えると、つながりが深まります\nDMでは売り込まず、感謝と質問への丁寧な回答を大切にします。売り込みのDMは、ブロックされる原因になります\n自分からも、同じジャンルのアカウントに丁寧なコメントを残すと、知ってもらうきっかけにもなります\n第8章 ワーク\n書く場所： ワークシート「⑧コンテンツ設計」タブ　目安： 1〜2時間\n週間カレンダーに、ストーリーズで何を出すかを書き足す\n質問スタンプかアンケートを1回使ってみる\nハイライト「自己紹介」を作る\nコメントとDMの返し方を、自分なりに決めておく\n終わったら「全体マップ・進捗チェック」タブで第8章に印をつけてください。", "minutes": 3}, {"id": "lesson-11", "title": "第9章 リスト化", "group": "STEP3 ファンを集める", "headings": [{"id": "lesson-11-s1", "title": "この章のゴール", "level": 2}, {"id": "lesson-11-s2", "title": "9-1 講義：なぜ公式LINEでつながるのか", "level": 2}, {"id": "lesson-11-s3", "title": "9-2 実践：公式LINEを開設する", "level": 2}, {"id": "lesson-11-s4", "title": "9-3 実践：登録特典を作る", "level": 2}, {"id": "lesson-11-s5", "title": "9-4 実践：登録してもらう流れを作る", "level": 2}, {"id": "lesson-11-s6", "title": "9-5 実践：登録後7日間の配信（ステップ配信）", "level": 2}, {"id": "lesson-11-s7", "title": "第9章 ワーク", "level": 2}], "html": "\u003ch2 id=\"lesson-11-s1\">この章のゴール\u003c/h2>\n\u003cp class=\"list-item\">公式LINEと「登録したくなる特典」ができている\u003c/p>\n\u003cp class=\"list-item\">プロフィールや投稿から公式LINEへの流れが整い、登録が少しずつ増えている\u003c/p>\n\u003cp class=\"list-item\">登録した人に、最初の7日間の配信が届くようになっている\u003c/p>\n\u003cp>\u003cstrong>所要時間の目安：\u003c/strong> 読む 40分／ワーク 特典づくり1〜2日＋配信文づくり3〜4時間\u003c/p>\n\u003cp>※アフィリエイトやPR案件を中心にする人は、公式LINEを使わない形もあります（第1章）。この章をどこまで進めるかは、コーチと相談してください。\u003c/p>\n\u003ch2 id=\"lesson-11-s2\">9-1 講義：なぜ公式LINEでつながるのか\u003c/h2>\n\u003cp class=\"list-item\">SNSの投稿は、アルゴリズムによって届く人が変わります。公式LINEは、登録してくれた人に直接メッセージを届けられる場所です。ただし、どちらもサービスの仕様やルールの変更を受けることがあるので、1つの場所だけに頼りすぎないことも大切です\u003c/p>\n\u003cp class=\"list-item\">投稿はフォロワーの一部にしか届きませんが、公式LINEは登録してくれた人にほぼ届きます。商品を選んでもらう場所になりやすいのは、こちらです\u003c/p>\n\u003ch2 id=\"lesson-11-s3\">9-2 実践：公式LINEを開設する\u003c/h2>\n\u003cp class=\"list-item\">公式LINEのアカウントを作る\u003c/p>\n\u003cp class=\"list-item\">友だち追加してくれた人への「あいさつメッセージ」を設定する（登録のお礼＋自己紹介＋特典の受け取り方）\u003c/p>\n\u003cp class=\"list-item\">料金プランや配信できる通数の上限は、変わることがあります（※最新情報を確認）\u003c/p>\n\u003ch2 id=\"lesson-11-s4\">9-3 実践：登録特典を作る\u003c/h2>\n\u003cp>「公式LINEに登録してね」だけでは、なかなか登録されません。登録してくれた人に渡す\u003cstrong>登録特典（リードマグネット）\u003c/strong>を用意します。\u003c/p>\n\u003cp>\u003cstrong>良い特典の3つの条件\u003c/strong>\u003c/p>\n\u003cp class=\"list-item\">ペルソナの悩みにまっすぐ応えている\u003c/p>\n\u003cp class=\"list-item\">5〜10分で「役に立った」と感じられる\u003c/p>\n\u003cp class=\"list-item\">将来届けたい商品（第4章で仮決めしたもの）の入り口になっている\u003c/p>\n\u003cp>\u003cstrong>特典の形の例：\u003c/strong> チェックリスト／テンプレート／10〜20分の動画／診断／小さな教材（例：「時短家事チェックリスト30」「宅建・朝勉強スタートキット」）\u003c/p>\n\u003cp>\u003cstrong>作り方：\u003c/strong> 第4章で書いたペルソナの悩みのうち、いちばん大きなものを1つだけ解決するものを、1〜2日で作ります。最初から作り込みすぎなくて大丈夫です。反応を見ながら直していきましょう。\u003c/p>\n\u003ch2 id=\"lesson-11-s5\">9-4 実践：登録してもらう流れを作る\u003c/h2>\n\u003cp class=\"list-item\">\u003cstrong>プロフィール：\u003c/strong> 第4章では貼らなかったリンクを、ここで公式LINEのリンクとして貼ります。プロフィール文の4行目に、特典の案内を書きます（例：プロフィールのリンクから時短家事チェックリストを配布中）\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>投稿の最後の一言：\u003c/strong> 「保存してね」に加えて、ときどき「プロフィールのリンクから特典を受け取ってね」を入れる\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>ストーリーズ：\u003c/strong> リンクスタンプで特典を案内する。ハイライト「特典」にもまとめておく（第8章）\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>数字を見る：\u003c/strong> フォロワーのうち何％が公式LINEに登録したか（登録率）を、ワークシートに記録します（第7章「つながりの流れ」の続き）\u003c/p>\n\u003ch2 id=\"lesson-11-s6\">9-5 実践：登録後7日間の配信（ステップ配信）\u003c/h2>\n\u003cp>登録した直後が、いちばん興味を持ってくれているタイミングです。自動で配信される「ステップ配信」で、数日かけて信頼を深めます。例えば次のような流れです。\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>日\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>届けること\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>1日目\u003c/p>\u003c/td>\u003ctd>\u003cp>特典を渡す＋自己紹介（なぜこの発信をしているのか）\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>2〜3日目\u003c/p>\u003c/td>\u003ctd>\u003cp>ペルソナの悩みの本当の原因\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>4〜5日目\u003c/p>\u003c/td>\u003ctd>\u003cp>解決の考え方＋お客さんや自分の変化の例\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>6日目\u003c/p>\u003c/td>\u003ctd>\u003cp>よくある質問・つまずきやすいこと\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>7日目\u003c/p>\u003c/td>\u003ctd>\u003cp>個別相談や次のご案内（商品がまだないうちは「今後の予告」でOK）\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"lesson-11-s7\">第9章 ワーク\u003c/h2>\n\u003cp>\u003cstrong>書く場所：\u003c/strong> ワークシート「⑩リスト化・関所」タブ\u003c/p>\n\u003cp class=\"list-item\">公式LINEを開設し、あいさつメッセージを設定する（30分〜1時間）\u003c/p>\n\u003cp class=\"list-item\">登録特典を設計して作る（1〜2日）\u003c/p>\n\u003cp class=\"list-item\">プロフィールに公式LINEのリンクを貼り、特典の案内を入れる\u003c/p>\n\u003cp class=\"list-item\">7日間のステップ配信の文章を書く（3〜4時間）\u003c/p>\n\u003cp>終わったら「全体マップ・進捗チェック」タブで第9章に印をつけてください。\u003c/p>\n\u003cp>\u003cstrong>これでSTEP3は修了です。STEP4に進む前に、次の「【関所】リスク管理」を読んでください。\u003c/strong> 次のSTEP4では、ここまでにつながった人たちに、いよいよ価値を届けていきます。\u003c/p>", "text": "この章のゴール\n公式LINEと「登録したくなる特典」ができている\nプロフィールや投稿から公式LINEへの流れが整い、登録が少しずつ増えている\n登録した人に、最初の7日間の配信が届くようになっている\n所要時間の目安： 読む 40分／ワーク 特典づくり1〜2日＋配信文づくり3〜4時間\n※アフィリエイトやPR案件を中心にする人は、公式LINEを使わない形もあります（第1章）。この章をどこまで進めるかは、コーチと相談してください。\n9-1 講義：なぜ公式LINEでつながるのか\nSNSの投稿は、アルゴリズムによって届く人が変わります。公式LINEは、登録してくれた人に直接メッセージを届けられる場所です。ただし、どちらもサービスの仕様やルールの変更を受けることがあるので、1つの場所だけに頼りすぎないことも大切です\n投稿はフォロワーの一部にしか届きませんが、公式LINEは登録してくれた人にほぼ届きます。商品を選んでもらう場所になりやすいのは、こちらです\n9-2 実践：公式LINEを開設する\n公式LINEのアカウントを作る\n友だち追加してくれた人への「あいさつメッセージ」を設定する（登録のお礼＋自己紹介＋特典の受け取り方）\n料金プランや配信できる通数の上限は、変わることがあります（※最新情報を確認）\n9-3 実践：登録特典を作る\n「公式LINEに登録してね」だけでは、なかなか登録されません。登録してくれた人に渡す登録特典（リードマグネット）を用意します。\n良い特典の3つの条件\nペルソナの悩みにまっすぐ応えている\n5〜10分で「役に立った」と感じられる\n将来届けたい商品（第4章で仮決めしたもの）の入り口になっている\n特典の形の例： チェックリスト／テンプレート／10〜20分の動画／診断／小さな教材（例：「時短家事チェックリスト30」「宅建・朝勉強スタートキット」）\n作り方： 第4章で書いたペルソナの悩みのうち、いちばん大きなものを1つだけ解決するものを、1〜2日で作ります。最初から作り込みすぎなくて大丈夫です。反応を見ながら直していきましょう。\n9-4 実践：登録してもらう流れを作る\nプロフィール： 第4章では貼らなかったリンクを、ここで公式LINEのリンクとして貼ります。プロフィール文の4行目に、特典の案内を書きます（例：プロフィールのリンクから時短家事チェックリストを配布中）\n投稿の最後の一言： 「保存してね」に加えて、ときどき「プロフィールのリンクから特典を受け取ってね」を入れる\nストーリーズ： リンクスタンプで特典を案内する。ハイライト「特典」にもまとめておく（第8章）\n数字を見る： フォロワーのうち何％が公式LINEに登録したか（登録率）を、ワークシートに記録します（第7章「つながりの流れ」の続き）\n9-5 実践：登録後7日間の配信（ステップ配信）\n登録した直後が、いちばん興味を持ってくれているタイミングです。自動で配信される「ステップ配信」で、数日かけて信頼を深めます。例えば次のような流れです。\n日\n届けること\n1日目\n特典を渡す＋自己紹介（なぜこの発信をしているのか）\n2〜3日目\nペルソナの悩みの本当の原因\n4〜5日目\n解決の考え方＋お客さんや自分の変化の例\n6日目\nよくある質問・つまずきやすいこと\n7日目\n個別相談や次のご案内（商品がまだないうちは「今後の予告」でOK）\n第9章 ワーク\n書く場所： ワークシート「⑩リスト化・関所」タブ\n公式LINEを開設し、あいさつメッセージを設定する（30分〜1時間）\n登録特典を設計して作る（1〜2日）\nプロフィールに公式LINEのリンクを貼り、特典の案内を入れる\n7日間のステップ配信の文章を書く（3〜4時間）\n終わったら「全体マップ・進捗チェック」タブで第9章に印をつけてください。\nこれでSTEP3は修了です。STEP4に進む前に、次の「【関所】リスク管理」を読んでください。 次のSTEP4では、ここまでにつながった人たちに、いよいよ価値を届けていきます。", "minutes": 3}, {"id": "lesson-12", "title": "【関所】リスク管理 〜お金が動く発信を始める前に〜", "group": "STEP3 ファンを集める", "headings": [{"id": "lesson-12-s1", "title": "R-1 表現の法律（薬機法・景品表示法・ステマ規制）", "level": 2}, {"id": "lesson-12-s2", "title": "R-2 PR表記のルール", "level": 2}, {"id": "lesson-12-s3", "title": "R-3 詐欺から身を守る（自分も、フォロワーも）", "level": 2}, {"id": "lesson-12-s4", "title": "関所の確認テスト", "level": 2}], "html": "\u003cp>商品の販売、PR案件、アフィリエイトなど、発信でお金が動き始めると、法律や詐欺のリスクが身近になります。このページは、あなた自身と、あなたのフォロワーやお客さんを守るための知識です。STEP4に進む前、またはPR案件やアフィリエイトを始める前に読んでください。\u003c/p>\n\u003cp>\u003cstrong>所要時間の目安：\u003c/strong> 読む 20分／確認テスト 5分\u003c/p>\n\u003cp>※ここで紹介するのは基本的な考え方です。個別の表現が問題ないかなど、詳しい判断が必要なときは専門家に確認してください。法律やルールは変わることがあるので、最新情報もあわせて確認しましょう。\u003c/p>\n\u003ch2 id=\"lesson-12-s1\">R-1 表現の法律（薬機法・景品表示法・ステマ規制）\u003c/h2>\n\u003cp class=\"list-item\">\u003cstrong>効果の約束はNG：\u003c/strong> 「必ず痩せる」「シミが消える」「誰でも月30万」のような表現は、法律に触れるおそれがあります。美容・健康・お金のジャンルは特に注意しましょう\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>個人の感想としての事実はOK：\u003c/strong> 「私は3か月で5kg落ちました」は事実として語れますが、「あなたも必ず5kg落ちます」は効果の約束になります。ビフォーアフターの写真は、媒体やジャンルのルールも確認しましょう\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>ステマ規制：\u003c/strong> 広告であることを隠した宣伝は、法律で規制されています。報酬をもらって紹介するときは、広告であることの表示が必要です\u003c/p>\n\u003ch2 id=\"lesson-12-s2\">R-2 PR表記のルール\u003c/h2>\n\u003cp class=\"list-item\">企業から商品の提供や報酬を受けた投稿には、Instagramの「タイアップ投稿」のラベルと、キャプションの #PR などで、広告であることがわかるようにします（※機能名は最新情報を確認）\u003c/p>\n\u003cp class=\"list-item\">アフィリエイトのリンクを紹介するときも、広告であることがわかるようにしましょう\u003c/p>\n\u003cp class=\"list-item\">「案件っぽく見せない」ように隠すと、信頼を失い、アカウントにも影響が出ることがあります\u003c/p>\n\u003ch2 id=\"lesson-12-s3\">R-3 詐欺から身を守る（自分も、フォロワーも）\u003c/h2>\n\u003cp class=\"list-item\">\u003cstrong>危ないPR案件DMの特徴：\u003c/strong> 相場より高すぎる報酬／先にお金や個人情報を求められる／怪しいリンクに誘導される／日本語が不自然／公式マークのない「有名企業」——ひとつでも当てはまったら、反応しないようにしましょう\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>PR案件のDMが来たら：\u003c/strong> ①企業の公式サイトや公式SNSで、担当者と案件が本当にあるか確認する → ②報酬・納期・権利などの条件を書面でもらう → ③わからないことはコーチに相談してから返信する。その場で決めないことが大切です\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>なりすまし対策：\u003c/strong> 自分の偽アカウントを見つけたら、プラットフォームに報告し、ストーリーズでフォロワーにも注意を呼びかけましょう。特典配布を装った偽アカウントは、フォロワーを直接傷つけてしまいます\u003c/p>\n\u003ch2 id=\"lesson-12-s4\">関所の確認テスト\u003c/h2>\n\u003cp>次の3つに、すべて「いいえ」と答えられたら、次に進みましょう。答えはワークシートに書いて、セッションでコーチと確認します。\u003c/p>\n\u003cp class=\"list-item\">「飲むだけで痩せます」と投稿してよい？\u003c/p>\n\u003cp class=\"list-item\">報酬をもらったが、自然に見せたいのでPR表記を外してよい？\u003c/p>\n\u003cp class=\"list-item\">「フォロワー様限定の案件です」というDMの指示どおり、リンク先に登録してよい？\u003c/p>\n\u003cp>終わったら「全体マップ・進捗チェック」タブで関所に印をつけてください。\u003c/p>", "text": "商品の販売、PR案件、アフィリエイトなど、発信でお金が動き始めると、法律や詐欺のリスクが身近になります。このページは、あなた自身と、あなたのフォロワーやお客さんを守るための知識です。STEP4に進む前、またはPR案件やアフィリエイトを始める前に読んでください。\n所要時間の目安： 読む 20分／確認テスト 5分\n※ここで紹介するのは基本的な考え方です。個別の表現が問題ないかなど、詳しい判断が必要なときは専門家に確認してください。法律やルールは変わることがあるので、最新情報もあわせて確認しましょう。\nR-1 表現の法律（薬機法・景品表示法・ステマ規制）\n効果の約束はNG： 「必ず痩せる」「シミが消える」「誰でも月30万」のような表現は、法律に触れるおそれがあります。美容・健康・お金のジャンルは特に注意しましょう\n個人の感想としての事実はOK： 「私は3か月で5kg落ちました」は事実として語れますが、「あなたも必ず5kg落ちます」は効果の約束になります。ビフォーアフターの写真は、媒体やジャンルのルールも確認しましょう\nステマ規制： 広告であることを隠した宣伝は、法律で規制されています。報酬をもらって紹介するときは、広告であることの表示が必要です\nR-2 PR表記のルール\n企業から商品の提供や報酬を受けた投稿には、Instagramの「タイアップ投稿」のラベルと、キャプションの #PR などで、広告であることがわかるようにします（※機能名は最新情報を確認）\nアフィリエイトのリンクを紹介するときも、広告であることがわかるようにしましょう\n「案件っぽく見せない」ように隠すと、信頼を失い、アカウントにも影響が出ることがあります\nR-3 詐欺から身を守る（自分も、フォロワーも）\n危ないPR案件DMの特徴： 相場より高すぎる報酬／先にお金や個人情報を求められる／怪しいリンクに誘導される／日本語が不自然／公式マークのない「有名企業」——ひとつでも当てはまったら、反応しないようにしましょう\nPR案件のDMが来たら： ①企業の公式サイトや公式SNSで、担当者と案件が本当にあるか確認する → ②報酬・納期・権利などの条件を書面でもらう → ③わからないことはコーチに相談してから返信する。その場で決めないことが大切です\nなりすまし対策： 自分の偽アカウントを見つけたら、プラットフォームに報告し、ストーリーズでフォロワーにも注意を呼びかけましょう。特典配布を装った偽アカウントは、フォロワーを直接傷つけてしまいます\n関所の確認テスト\n次の3つに、すべて「いいえ」と答えられたら、次に進みましょう。答えはワークシートに書いて、セッションでコーチと確認します。\n「飲むだけで痩せます」と投稿してよい？\n報酬をもらったが、自然に見せたいのでPR表記を外してよい？\n「フォロワー様限定の案件です」というDMの指示どおり、リンク先に登録してよい？\n終わったら「全体マップ・進捗チェック」タブで関所に印をつけてください。", "minutes": 3}, {"id": "lesson-13", "title": "第10章 商品設計", "group": "STEP4 価値を届ける", "headings": [{"id": "lesson-13-s1", "title": "この章のゴール", "level": 2}, {"id": "lesson-13-s2", "title": "10-1 講義：商品の階段", "level": 2}, {"id": "lesson-13-s3", "title": "10-2 実践：発信への反応をもとに商品を決める", "level": 2}, {"id": "lesson-13-s4", "title": "10-3 実践：価格の考え方", "level": 2}, {"id": "lesson-13-s5", "title": "10-4 実践：決済・販売の方法", "level": 2}, {"id": "lesson-13-s6", "title": "第10章 ワーク", "level": 2}], "html": "\u003ch2 id=\"lesson-13-s1\">この章のゴール\u003c/h2>\n\u003cp class=\"list-item\">第4章で仮決めした商品を、発信で得た反応をもとに形にしている\u003c/p>\n\u003cp class=\"list-item\">「誰を、今→理想にする商品か」を一文で言える\u003c/p>\n\u003cp class=\"list-item\">価格と、その理由を説明できる\u003c/p>\n\u003cp>\u003cstrong>所要時間の目安：\u003c/strong> 読む 30分／ワーク 3〜5時間\u003c/p>\n\u003ch2 id=\"lesson-13-s2\">10-1 講義：商品の階段\u003c/h2>\n\u003cp>いきなり高い商品を1つだけ作るのではなく、「階段」をイメージしておくと、お客さんが選びやすくなります。\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>段階\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>価格の目安\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>例\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>役割\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>入り口\u003c/p>\u003c/td>\u003ctd>\u003cp>無料\u003c/p>\u003c/td>\u003ctd>\u003cp>公式LINEの登録特典（第9章）\u003c/p>\u003c/td>\u003ctd>\u003cp>つながるきっかけ\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>手頃な商品\u003c/p>\u003c/td>\u003ctd>\u003cp>〜5千円\u003c/p>\u003c/td>\u003ctd>\u003cp>小さな教材、テンプレート集\u003c/p>\u003c/td>\u003ctd>\u003cp>お試しと信頼づくり\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>中くらいの商品\u003c/p>\u003c/td>\u003ctd>\u003cp>1〜10万円\u003c/p>\u003c/td>\u003ctd>\u003cp>講座、テンプレート＋サポート\u003c/p>\u003c/td>\u003ctd>\u003cp>収入の柱の候補\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>本命の商品\u003c/p>\u003c/td>\u003ctd>\u003cp>10万円〜\u003c/p>\u003c/td>\u003ctd>\u003cp>コーチング、コンサル、伴走型のサービス\u003c/p>\u003c/td>\u003ctd>\u003cp>少人数に深く届ける\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>最初から全部をそろえる必要はありません。\u003cstrong>本命の商品をひとつと、入り口の特典から始めて、選んでもらえたら少しずつ階段を増やす\u003c/strong>のが進めやすい形です。\u003c/p>\n\u003ch2 id=\"lesson-13-s3\">10-2 実践：発信への反応をもとに商品を決める\u003c/h2>\n\u003cp>第4章で仮決めした商品を、STEP2〜3で集まった反応と照らし合わせます。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>伸びた投稿のテーマ：\u003c/strong> 届けたい相手が、今何に悩んでいるかのヒント（第7章の記録）\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>ストーリーズの質問やDMで届いた相談：\u003c/strong> 実際の声（第8章）\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>登録特典や配信への反応：\u003c/strong> どんな話題に反応があったか（第9章）\u003c/p>\n\u003cp>仮決めした商品と反応がずれていたら、「自分が届けたいもの」と「求められているもの」が重なるところを、コーチと一緒に探しましょう。\u003c/p>\n\u003cp>\u003cstrong>商品で決めること\u003c/strong>\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>項目\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>例\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>誰に届けるか（ペルソナ）\u003c/p>\u003c/td>\u003ctd>\u003cp>時短勤務の30代ワーキングマザー\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>今 → 理想（一文）\u003c/p>\u003c/td>\u003ctd>\u003cp>自分の時間がない → 平日に1時間の自分の時間がある\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>形式\u003c/p>\u003c/td>\u003ctd>\u003cp>動画・PDF・セッションの回数・期間など\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>サポートの範囲\u003c/p>\u003c/td>\u003ctd>\u003cp>チャットでの質問は平日のみ、など\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>届けるスケジュール\u003c/p>\u003c/td>\u003ctd>\u003cp>8週間、週1回のセッション\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>商品名\u003c/p>\u003c/td>\u003ctd>\u003cp>届けるもの（変化）が伝わる名前\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"lesson-13-s4\">10-3 実践：価格の考え方\u003c/h2>\n\u003cp class=\"list-item\">作るのにかかった手間だけでなく、「お客さんがどんな変化を得られるか」をもとに考えます\u003c/p>\n\u003cp class=\"list-item\">競合の似た商品の相場を調べて、参考にします\u003c/p>\n\u003cp class=\"list-item\">初めて届けるときは、「モニター価格」で始める方法もあります。そのときは、感想や変化の記録をもらうことを条件にすると、次に届けるときの大きな力になります\u003c/p>\n\u003ch2 id=\"lesson-13-s5\">10-4 実践：決済・販売の方法\u003c/h2>\n\u003cp class=\"list-item\">コンテンツ販売のサービス（Brain、Tipsなど）、自分で決済を用意する方法（Stripeなど）、高い商品の場合は銀行振込＋契約書など、いくつかの方法があります\u003c/p>\n\u003cp class=\"list-item\">選ぶときは、商品の価格・手数料・審査の有無・お客さんの買いやすさを比べます。サービスの事情は変わるので、最新情報を確認し、迷ったらコーチに相談してください\u003c/p>\n\u003ch2 id=\"lesson-13-s6\">第10章 ワーク\u003c/h2>\n\u003cp>\u003cstrong>書く場所：\u003c/strong> ワークシート「⑪商品設計」タブ　\u003cstrong>目安：\u003c/strong> 3〜5時間\u003c/p>\n\u003cp class=\"list-item\">伸びた投稿・届いた相談・配信への反応を書き出し、仮決めの商品と照らし合わせる\u003c/p>\n\u003cp class=\"list-item\">商品で決めること（誰に・今→理想・形式・サポート・スケジュール・名前）を埋める\u003c/p>\n\u003cp class=\"list-item\">価格とその理由、決済の方法を決める\u003c/p>\n\u003cp>終わったら「全体マップ・進捗チェック」タブで第10章に印をつけてください。\u003c/p>", "text": "この章のゴール\n第4章で仮決めした商品を、発信で得た反応をもとに形にしている\n「誰を、今→理想にする商品か」を一文で言える\n価格と、その理由を説明できる\n所要時間の目安： 読む 30分／ワーク 3〜5時間\n10-1 講義：商品の階段\nいきなり高い商品を1つだけ作るのではなく、「階段」をイメージしておくと、お客さんが選びやすくなります。\n段階\n価格の目安\n例\n役割\n入り口\n無料\n公式LINEの登録特典（第9章）\nつながるきっかけ\n手頃な商品\n〜5千円\n小さな教材、テンプレート集\nお試しと信頼づくり\n中くらいの商品\n1〜10万円\n講座、テンプレート＋サポート\n収入の柱の候補\n本命の商品\n10万円〜\nコーチング、コンサル、伴走型のサービス\n少人数に深く届ける\n最初から全部をそろえる必要はありません。本命の商品をひとつと、入り口の特典から始めて、選んでもらえたら少しずつ階段を増やすのが進めやすい形です。\n10-2 実践：発信への反応をもとに商品を決める\n第4章で仮決めした商品を、STEP2〜3で集まった反応と照らし合わせます。\n伸びた投稿のテーマ： 届けたい相手が、今何に悩んでいるかのヒント（第7章の記録）\nストーリーズの質問やDMで届いた相談： 実際の声（第8章）\n登録特典や配信への反応： どんな話題に反応があったか（第9章）\n仮決めした商品と反応がずれていたら、「自分が届けたいもの」と「求められているもの」が重なるところを、コーチと一緒に探しましょう。\n商品で決めること\n項目\n例\n誰に届けるか（ペルソナ）\n時短勤務の30代ワーキングマザー\n今 → 理想（一文）\n自分の時間がない → 平日に1時間の自分の時間がある\n形式\n動画・PDF・セッションの回数・期間など\nサポートの範囲\nチャットでの質問は平日のみ、など\n届けるスケジュール\n8週間、週1回のセッション\n商品名\n届けるもの（変化）が伝わる名前\n10-3 実践：価格の考え方\n作るのにかかった手間だけでなく、「お客さんがどんな変化を得られるか」をもとに考えます\n競合の似た商品の相場を調べて、参考にします\n初めて届けるときは、「モニター価格」で始める方法もあります。そのときは、感想や変化の記録をもらうことを条件にすると、次に届けるときの大きな力になります\n10-4 実践：決済・販売の方法\nコンテンツ販売のサービス（Brain、Tipsなど）、自分で決済を用意する方法（Stripeなど）、高い商品の場合は銀行振込＋契約書など、いくつかの方法があります\n選ぶときは、商品の価格・手数料・審査の有無・お客さんの買いやすさを比べます。サービスの事情は変わるので、最新情報を確認し、迷ったらコーチに相談してください\n第10章 ワーク\n書く場所： ワークシート「⑪商品設計」タブ　目安： 3〜5時間\n伸びた投稿・届いた相談・配信への反応を書き出し、仮決めの商品と照らし合わせる\n商品で決めること（誰に・今→理想・形式・サポート・スケジュール・名前）を埋める\n価格とその理由、決済の方法を決める\n終わったら「全体マップ・進捗チェック」タブで第10章に印をつけてください。", "minutes": 3}, {"id": "lesson-14", "title": "第11章 セールス", "group": "STEP4 価値を届ける", "headings": [{"id": "lesson-14-s1", "title": "この章のゴール", "level": 2}, {"id": "lesson-14-s2", "title": "11-1 講義：期間を決めて案内する（ローンチ）", "level": 2}, {"id": "lesson-14-s3", "title": "11-2 実践：案内の前に「判断材料」を届ける", "level": 2}, {"id": "lesson-14-s4", "title": "11-3 実践：募集ページと案内の仕方", "level": 2}, {"id": "lesson-14-s5", "title": "11-4 実践：個別相談（高い商品の場合）", "level": 2}, {"id": "lesson-14-s6", "title": "11-5 実践：販売のあとにやること", "level": 2}, {"id": "lesson-14-s7", "title": "第11章 ワーク", "level": 2}], "html": "\u003ch2 id=\"lesson-14-s1\">この章のゴール\u003c/h2>\n\u003cp class=\"list-item\">「SNS → 公式LINE → 商品の案内」の流れを一度通して回している\u003c/p>\n\u003cp class=\"list-item\">はじめての売上が生まれている\u003c/p>\n\u003cp>\u003cstrong>所要時間の目安：\u003c/strong> 読む 40分／実行 2週間（準備を含めるともう少し）\u003c/p>\n\u003ch2 id=\"lesson-14-s2\">11-1 講義：期間を決めて案内する（ローンチ）\u003c/h2>\n\u003cp>いつでも案内し続けるより、期間を区切ってまとめて案内するほうが、お客さんが「今決めよう」と思いやすくなります。このやり方をローンチといいます。\u003c/p>\n\u003cp>\u003cstrong>2週間の流れの例\u003c/strong>\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>期間\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>やること\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>1〜4日目：予告\u003c/p>\u003c/td>\u003ctd>\u003cp>「近々、〇〇な人向けのご案内をします」とストーリーズや公式LINEで伝える\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>5〜10日目：判断材料を届ける\u003c/p>\u003c/td>\u003ctd>\u003cp>悩みの本当の原因 → 解決の考え方 → 変化の例 → よくある誤解（公式LINE＋投稿）\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>11〜13日目：募集\u003c/p>\u003c/td>\u003ctd>\u003cp>募集開始。定員・特典・締切をはっきり伝える\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>14日目：締切\u003c/p>\u003c/td>\u003ctd>\u003cp>最終日のご案内（残りの枠・最後の質問への回答）→ 締切でしっかり閉じる\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"lesson-14-s3\">11-2 実践：案内の前に「判断材料」を届ける\u003c/h2>\n\u003cp>商品を案内する前に、お客さんが「自分に必要かどうか」を判断できる材料を渡します。次の順番で届けると伝わりやすくなります。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>問題に気づく：\u003c/strong> なぜ今のやり方では変わらないのか\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>解決策を知る：\u003c/strong> こういう方法がある\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>あなたから選ぶ理由：\u003c/strong> 実績・想い・変化の例\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>不安がなくなる：\u003c/strong> よくある質問への答え（第4章の「買わない理由」がそのまま使えます）\u003c/p>\n\u003ch2 id=\"lesson-14-s4\">11-3 実践：募集ページと案内の仕方\u003c/h2>\n\u003cp>\u003cstrong>募集ページ（LP）の基本の流れ\u003c/strong>\u003c/p>\n\u003cp>キャッチコピー（今→理想）→ こんな悩みはありませんか → 悩みの本当の原因 → 解決策としての商品 → 内容の詳しい説明 → 実績・お客さんの声 → 価格とその理由 → 特典 → 締切・定員 → よくある質問 → 申し込みボタン\u003c/p>\n\u003cp>\u003cstrong>案内するときに意識したいこと\u003c/strong>\u003c/p>\n\u003cp class=\"list-item\">届けたい相手を絞って書く（「全員来てください」では、誰にも刺さりにくい）\u003c/p>\n\u003cp class=\"list-item\">価格より先に、得られる変化を伝える\u003c/p>\n\u003cp class=\"list-item\">締切は守る。延長を繰り返すと、信頼がゆらぎます\u003c/p>\n\u003ch2 id=\"lesson-14-s5\">11-4 実践：個別相談（高い商品の場合）\u003c/h2>\n\u003cp>高い商品は、募集ページだけでは決めにくいものです。無料や低額の「個別相談」を挟むと、お客さんが安心して決められます。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>流れ：\u003c/strong> 今の状況を聞く（話すより聞くが中心）→ 理想を確認する → 今と理想の差を整理する → その差を埋めるものとして商品を紹介する → 質問に答える → お客さんに決めてもらう\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>大切にしたいこと：\u003c/strong> 売り込まない。合わないと感じた人には、正直に伝える（その場の売上より、長い信頼）。判断に必要な情報はその場で渡し切り、最後はお客さんに決めてもらいましょう\u003c/p>\n\u003ch2 id=\"lesson-14-s6\">11-5 実践：販売のあとにやること\u003c/h2>\n\u003cp class=\"list-item\">選んでくれたお客さんに、できるだけ早く価値を届ける（最初の体験が、その後の口コミにつながります）\u003c/p>\n\u003cp class=\"list-item\">感想や変化の記録を集める（次の募集ページの材料になります）\u003c/p>\n\u003cp class=\"list-item\">今回は選ばなかった人にも、お礼と次回の予告を届ける（つながりは続きます）\u003c/p>\n\u003cp class=\"list-item\">ローンチ全体の数字（登録率 → 相談率 → 成約率）をワークシートに記録する\u003c/p>\n\u003ch2 id=\"lesson-14-s7\">第11章 ワーク\u003c/h2>\n\u003cp>\u003cstrong>書く場所：\u003c/strong> ワークシート「⑫ローンチ計画」タブ\u003c/p>\n\u003cp class=\"list-item\">2週間のスケジュールを組む\u003c/p>\n\u003cp class=\"list-item\">判断材料を届ける配信を4本書く\u003c/p>\n\u003cp class=\"list-item\">募集ページを作る\u003c/p>\n\u003cp class=\"list-item\">（高い商品の場合）個別相談の流れをコーチと練習する\u003c/p>\n\u003cp class=\"list-item\">ローンチを実行して、数字を記録する\u003c/p>\n\u003cp>終わったら「全体マップ・進捗チェック」タブで第11章に印をつけてください。\u003c/p>\n\u003cp>\u003cstrong>おつかれさまでした。これで「知ってもらう → 信頼してもらう → つながる → 選んでもらう」の流れを、一度通して回すことができました。\u003c/strong> ここからは、回数を重ねて精度を上げていく段階です。収入の柱を増やしたくなったら、発展編へ進んでください。\u003c/p>", "text": "この章のゴール\n「SNS → 公式LINE → 商品の案内」の流れを一度通して回している\nはじめての売上が生まれている\n所要時間の目安： 読む 40分／実行 2週間（準備を含めるともう少し）\n11-1 講義：期間を決めて案内する（ローンチ）\nいつでも案内し続けるより、期間を区切ってまとめて案内するほうが、お客さんが「今決めよう」と思いやすくなります。このやり方をローンチといいます。\n2週間の流れの例\n期間\nやること\n1〜4日目：予告\n「近々、〇〇な人向けのご案内をします」とストーリーズや公式LINEで伝える\n5〜10日目：判断材料を届ける\n悩みの本当の原因 → 解決の考え方 → 変化の例 → よくある誤解（公式LINE＋投稿）\n11〜13日目：募集\n募集開始。定員・特典・締切をはっきり伝える\n14日目：締切\n最終日のご案内（残りの枠・最後の質問への回答）→ 締切でしっかり閉じる\n11-2 実践：案内の前に「判断材料」を届ける\n商品を案内する前に、お客さんが「自分に必要かどうか」を判断できる材料を渡します。次の順番で届けると伝わりやすくなります。\n問題に気づく： なぜ今のやり方では変わらないのか\n解決策を知る： こういう方法がある\nあなたから選ぶ理由： 実績・想い・変化の例\n不安がなくなる： よくある質問への答え（第4章の「買わない理由」がそのまま使えます）\n11-3 実践：募集ページと案内の仕方\n募集ページ（LP）の基本の流れ\nキャッチコピー（今→理想）→ こんな悩みはありませんか → 悩みの本当の原因 → 解決策としての商品 → 内容の詳しい説明 → 実績・お客さんの声 → 価格とその理由 → 特典 → 締切・定員 → よくある質問 → 申し込みボタン\n案内するときに意識したいこと\n届けたい相手を絞って書く（「全員来てください」では、誰にも刺さりにくい）\n価格より先に、得られる変化を伝える\n締切は守る。延長を繰り返すと、信頼がゆらぎます\n11-4 実践：個別相談（高い商品の場合）\n高い商品は、募集ページだけでは決めにくいものです。無料や低額の「個別相談」を挟むと、お客さんが安心して決められます。\n流れ： 今の状況を聞く（話すより聞くが中心）→ 理想を確認する → 今と理想の差を整理する → その差を埋めるものとして商品を紹介する → 質問に答える → お客さんに決めてもらう\n大切にしたいこと： 売り込まない。合わないと感じた人には、正直に伝える（その場の売上より、長い信頼）。判断に必要な情報はその場で渡し切り、最後はお客さんに決めてもらいましょう\n11-5 実践：販売のあとにやること\n選んでくれたお客さんに、できるだけ早く価値を届ける（最初の体験が、その後の口コミにつながります）\n感想や変化の記録を集める（次の募集ページの材料になります）\n今回は選ばなかった人にも、お礼と次回の予告を届ける（つながりは続きます）\nローンチ全体の数字（登録率 → 相談率 → 成約率）をワークシートに記録する\n第11章 ワーク\n書く場所： ワークシート「⑫ローンチ計画」タブ\n2週間のスケジュールを組む\n判断材料を届ける配信を4本書く\n募集ページを作る\n（高い商品の場合）個別相談の流れをコーチと練習する\nローンチを実行して、数字を記録する\n終わったら「全体マップ・進捗チェック」タブで第11章に印をつけてください。\nおつかれさまでした。これで「知ってもらう → 信頼してもらう → つながる → 選んでもらう」の流れを、一度通して回すことができました。 ここからは、回数を重ねて精度を上げていく段階です。収入の柱を増やしたくなったら、発展編へ進んでください。", "minutes": 3}, {"id": "lesson-15", "title": "発展編 収入の柱を増やす", "group": "発展編", "headings": [{"id": "lesson-15-s1", "title": "A-1 アフィリエイト", "level": 2}, {"id": "lesson-15-s2", "title": "A-2 企業のPR案件", "level": 2}, {"id": "lesson-15-s3", "title": "A-3 SNSの運用代行", "level": 2}, {"id": "lesson-15-s4", "title": "A-4 物販", "level": 2}, {"id": "lesson-15-s5", "title": "A-5 TikTokショップ", "level": 2}], "html": "\u003cp>コンテンツ販売の土台ができたら、同じアカウントでほかの収入の柱も持てるようになります。ここでは、主な5つの方法を紹介します。どれを、どの順番で取り入れるかは、コーチと相談して決めてください。\u003c/p>\n\u003cp>※各サービスの仕組みや報酬の相場は変わることがあります。付録「最新情報」もあわせて確認してください。どの方法でも、始める前に「【関所】リスク管理」を読んでおきましょう。\u003c/p>\n\u003ch2 id=\"lesson-15-s1\">A-1 アフィリエイト\u003c/h2>\n\u003cp class=\"list-item\">\u003cstrong>仕組み：\u003c/strong> 他の会社の商品を紹介して、購入につながった分の報酬を受け取ります。アフィリエイトの仲介サービス（ASP）、Amazonアソシエイト、楽天ROOMなどがあります\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>やり方：\u003c/strong> ストーリーズやハイライトに「愛用品」の場所を作る、Threadsでリンクを直接貼る（第1章）、など\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>大切にしたいこと：\u003c/strong> 自分が使ったことのあるものを紹介する。広告であることがわかるようにする（関所）\u003c/p>\n\u003ch2 id=\"lesson-15-s2\">A-2 企業のPR案件\u003c/h2>\n\u003cp class=\"list-item\">\u003cstrong>案件が来やすいアカウント：\u003c/strong> ジャンルが一貫している、フォロワーの反応がある、これまでのPR投稿の質が高い\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>契約の形：\u003c/strong> 投稿1本ごとの報酬、成果に応じた報酬、月ごとの契約（アンバサダー）など\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>準備しておくこと：\u003c/strong> 自分のアカウントの実績をまとめた1枚の資料、企業への提案文のひな形。契約のときは、納期や投稿の二次利用の範囲を確認しましょう\u003c/p>\n\u003ch2 id=\"lesson-15-s3\">A-3 SNSの運用代行\u003c/h2>\n\u003cp class=\"list-item\">この教科書で身につけた「戦略づくり → 投稿 → 分析」は、企業やお店のお手伝いにも活かせます\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>始め方：\u003c/strong> 知り合いのお店などで実績を作る → 事例をまとめる → 紹介や営業で広げる\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>契約のときに：\u003c/strong> やることの範囲、投稿の本数、報告の頻度を書面にします。「必ず〇〇人増えます」のような成果の約束はしないようにしましょう\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>単価の上げ方：\u003c/strong> 投稿だけ → 企画と分析まで → 戦略づくりまで、とやることの範囲を広げていく\u003c/p>\n\u003ch2 id=\"lesson-15-s4\">A-4 物販\u003c/h2>\n\u003cp class=\"list-item\">\u003cstrong>ネットショップ：\u003c/strong> BASEなどのサービスなら、初期費用をおさえて始められ、SNSともつなげやすいです。自分のグッズ、デジタルの商品、選んだ商品などを扱えます\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>在庫を持たない形：\u003c/strong> 注文を受けてから仕入れる、メーカーから直接送るなどの形もあります。配送の質やルールは、事前に確認しましょう\u003c/p>\n\u003ch2 id=\"lesson-15-s5\">A-5 TikTokショップ\u003c/h2>\n\u003cp class=\"list-item\">\u003cstrong>仕組み：\u003c/strong> TikTokの中で、動画やLIVE配信からそのまま商品を買える機能です。「動画を見る → 気になる → そのまま買う」と流れが短いのが特徴です\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>収益の形：\u003c/strong> 商品を紹介して売れた分の報酬をもらうアフィリエイト（在庫を持たずに始められるので、入り口におすすめ）、LIVEでの販売、反応の良い動画を広告にする、など\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>今の状況：\u003c/strong> 参入する人が増えている一方で、単価は低めの市場です。報酬の相場や伸びやすいジャンルは変わりやすいので、最新情報を確認してください\u003c/p>", "text": "コンテンツ販売の土台ができたら、同じアカウントでほかの収入の柱も持てるようになります。ここでは、主な5つの方法を紹介します。どれを、どの順番で取り入れるかは、コーチと相談して決めてください。\n※各サービスの仕組みや報酬の相場は変わることがあります。付録「最新情報」もあわせて確認してください。どの方法でも、始める前に「【関所】リスク管理」を読んでおきましょう。\nA-1 アフィリエイト\n仕組み： 他の会社の商品を紹介して、購入につながった分の報酬を受け取ります。アフィリエイトの仲介サービス（ASP）、Amazonアソシエイト、楽天ROOMなどがあります\nやり方： ストーリーズやハイライトに「愛用品」の場所を作る、Threadsでリンクを直接貼る（第1章）、など\n大切にしたいこと： 自分が使ったことのあるものを紹介する。広告であることがわかるようにする（関所）\nA-2 企業のPR案件\n案件が来やすいアカウント： ジャンルが一貫している、フォロワーの反応がある、これまでのPR投稿の質が高い\n契約の形： 投稿1本ごとの報酬、成果に応じた報酬、月ごとの契約（アンバサダー）など\n準備しておくこと： 自分のアカウントの実績をまとめた1枚の資料、企業への提案文のひな形。契約のときは、納期や投稿の二次利用の範囲を確認しましょう\nA-3 SNSの運用代行\nこの教科書で身につけた「戦略づくり → 投稿 → 分析」は、企業やお店のお手伝いにも活かせます\n始め方： 知り合いのお店などで実績を作る → 事例をまとめる → 紹介や営業で広げる\n契約のときに： やることの範囲、投稿の本数、報告の頻度を書面にします。「必ず〇〇人増えます」のような成果の約束はしないようにしましょう\n単価の上げ方： 投稿だけ → 企画と分析まで → 戦略づくりまで、とやることの範囲を広げていく\nA-4 物販\nネットショップ： BASEなどのサービスなら、初期費用をおさえて始められ、SNSともつなげやすいです。自分のグッズ、デジタルの商品、選んだ商品などを扱えます\n在庫を持たない形： 注文を受けてから仕入れる、メーカーから直接送るなどの形もあります。配送の質やルールは、事前に確認しましょう\nA-5 TikTokショップ\n仕組み： TikTokの中で、動画やLIVE配信からそのまま商品を買える機能です。「動画を見る → 気になる → そのまま買う」と流れが短いのが特徴です\n収益の形： 商品を紹介して売れた分の報酬をもらうアフィリエイト（在庫を持たずに始められるので、入り口におすすめ）、LIVEでの販売、反応の良い動画を広告にする、など\n今の状況： 参入する人が増えている一方で、単価は低めの市場です。報酬の相場や伸びやすいジャンルは変わりやすいので、最新情報を確認してください", "minutes": 2}, {"id": "lesson-16", "title": "おわりに", "group": "付録・おわりに", "headings": [], "html": "\u003cp>この教科書の11の章と発展編は、あなたのSNSの「地図」です。地図があっても、歩くのはあなた自身。そして、隣を一緒に歩くのがコーチです。\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>迷ったら：\u003c/strong> 第1章のロードマップに戻る\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>止まったら：\u003c/strong> ワークシートの「全体マップ・進捗チェック」で、まだ印のついていない項目を1つだけ進める\u003c/p>\n\u003cp class=\"list-item\">\u003cstrong>悩んだら：\u003c/strong> ワークシートを持って、セッションでコーチに相談する\u003c/p>\n\u003cp>SNSの仕組みや流行りは、これからも変わっていきます。それでも、「知ってもらう → 信頼してもらう → つながる → 選んでもらう」という流れと、「数字を見て、直して、続ける」という基本は変わりません。\u003c/p>\n\u003cp>一周回し終えたとき、あなたの手元には「フォロワーの数」だけでなく、あなたの発信を待っている人たちとのつながりが残っているはずです。\u003c/p>\n\u003cp>それでは、良い発信を。\u003c/p>\n\u003cp>\u003cem>この教科書はPOTEX受講生専用です。無断での転載・共有はご遠慮ください。\u003c/em>\u003c/p>", "text": "この教科書の11の章と発展編は、あなたのSNSの「地図」です。地図があっても、歩くのはあなた自身。そして、隣を一緒に歩くのがコーチです。\n迷ったら： 第1章のロードマップに戻る\n止まったら： ワークシートの「全体マップ・進捗チェック」で、まだ印のついていない項目を1つだけ進める\n悩んだら： ワークシートを持って、セッションでコーチに相談する\nSNSの仕組みや流行りは、これからも変わっていきます。それでも、「知ってもらう → 信頼してもらう → つながる → 選んでもらう」という流れと、「数字を見て、直して、続ける」という基本は変わりません。\n一周回し終えたとき、あなたの手元には「フォロワーの数」だけでなく、あなたの発信を待っている人たちとのつながりが残っているはずです。\nそれでは、良い発信を。\nこの教科書はPOTEX受講生専用です。無断での転載・共有はご遠慮ください。", "minutes": 1}, {"id": "lesson-17", "title": "付録 ジャンル選定ワーク", "group": "付録・おわりに", "headings": [], "html": "\u003cp>発信したいジャンルがまだ決まっていない人のためのワークです。ジャンルが決まっている人は、飛ばして構いません。\u003c/p>\n\u003cp>\u003cstrong>書く場所：\u003c/strong> ワークシート「付録 ジャンル選定」タブ　\u003cstrong>目安：\u003c/strong> 1〜2時間\u003c/p>\n\u003cp>ワークシートには、ダイエット、美容、レシピ、暮らし、子育て、お金、学習・キャリア、副業、AIなど、ジャンルごとの参考アカウントが並んでいます。\u003c/p>\n\u003cp class=\"list-item\">気になるジャンルの参考アカウントを見て、「自分ならなぜフォローするか」を次の7つから選ぶ：憧れ／学び／共感／癒し／エンタメ／珍しさ／自分ごと\u003c/p>\n\u003cp class=\"list-item\">「いいと感じた点」と、「自分がやるならどれくらい合うか（1〜5）」を書く\u003c/p>\n\u003cp class=\"list-item\">候補のジャンルを、第3章 3-1の「市場の3つの確認」（伸びているアカウント・悩みの検索・お金の動き）にかける\u003c/p>\n\u003cp class=\"list-item\">第2章の自分の棚卸し（強み・「谷→頂点」の経験）と重なるジャンルを最有力候補にして、コーチと相談して決める\u003c/p>\n\u003cp>ジャンルが決まったら、第3章の競合分析に進みましょう。\u003c/p>", "text": "発信したいジャンルがまだ決まっていない人のためのワークです。ジャンルが決まっている人は、飛ばして構いません。\n書く場所： ワークシート「付録 ジャンル選定」タブ　目安： 1〜2時間\nワークシートには、ダイエット、美容、レシピ、暮らし、子育て、お金、学習・キャリア、副業、AIなど、ジャンルごとの参考アカウントが並んでいます。\n気になるジャンルの参考アカウントを見て、「自分ならなぜフォローするか」を次の7つから選ぶ：憧れ／学び／共感／癒し／エンタメ／珍しさ／自分ごと\n「いいと感じた点」と、「自分がやるならどれくらい合うか（1〜5）」を書く\n候補のジャンルを、第3章 3-1の「市場の3つの確認」（伸びているアカウント・悩みの検索・お金の動き）にかける\n第2章の自分の棚卸し（強み・「谷→頂点」の経験）と重なるジャンルを最有力候補にして、コーチと相談して決める\nジャンルが決まったら、第3章の競合分析に進みましょう。", "minutes": 1}, {"id": "lesson-18", "title": "付録 用語集", "group": "付録・おわりに", "headings": [{"id": "lesson-18-s1", "title": "SNS運用の基本", "level": 2}, {"id": "lesson-18-s2", "title": "戦略・設計", "level": 2}, {"id": "lesson-18-s3", "title": "投稿づくり", "level": 2}, {"id": "lesson-18-s4", "title": "数字の言葉", "level": 2}, {"id": "lesson-18-s5", "title": "つながる・価値を届ける", "level": 2}, {"id": "lesson-18-s6", "title": "収入の種類", "level": 2}, {"id": "lesson-18-s7", "title": "法律・リスク", "level": 2}, {"id": "lesson-18-s8", "title": "POTEXの言葉", "level": 2}], "html": "\u003cp>教科書に出てくる言葉を、分野ごとにまとめました。わからない言葉があったら、ここで確認してください。\u003c/p>\n\u003ch2 id=\"lesson-18-s1\">SNS運用の基本\u003c/h2>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>言葉\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>意味\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>アルゴリズム\u003c/p>\u003c/td>\u003ctd>\u003cp>投稿を誰に、どれだけ見せるかを決めるSNSの仕組み\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>リール\u003c/p>\u003c/td>\u003ctd>\u003cp>Instagramの縦型の短い動画。フォロワー以外にも届きやすい\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>フィード\u003c/p>\u003c/td>\u003ctd>\u003cp>プロフィールに並ぶ通常の投稿（画像や動画）\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>カルーセル\u003c/p>\u003c/td>\u003ctd>\u003cp>複数枚の画像を横にめくって見る投稿\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>ストーリーズ\u003c/p>\u003c/td>\u003ctd>\u003cp>24時間で消える投稿。フォロワーとの関係づくりに使う\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>ハイライト\u003c/p>\u003c/td>\u003ctd>\u003cp>ストーリーズをプロフィールに残しておける機能（丸いアイコン）\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>プロフィールリンク\u003c/p>\u003c/td>\u003ctd>\u003cp>プロフィールに貼れる外部サイトへのリンク\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>トライアルリール\u003c/p>\u003c/td>\u003ctd>\u003cp>フォロワー以外にだけ試しに出せるリール\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>ハッシュタグ\u003c/p>\u003c/td>\u003ctd>\u003cp>「#」をつけた言葉。投稿のテーマを示す\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"lesson-18-s2\">戦略・設計\u003c/h2>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>言葉\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>意味\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>3C分析\u003c/p>\u003c/td>\u003ctd>\u003cp>自分・市場（見る人）・競合の3つから「勝てる場所」を考える方法（第2章）\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>ペルソナ\u003c/p>\u003c/td>\u003ctd>\u003cp>発信を届けたい理想のお客さん像（第4章）\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>コンセプト\u003c/p>\u003c/td>\u003ctd>\u003cp>「誰の、どんな悩みを、どう解決する」アカウントか（第4章）\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>ベンチマーク\u003c/p>\u003c/td>\u003ctd>\u003cp>お手本にするアカウント（第3章）\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>モデリング\u003c/p>\u003c/td>\u003ctd>\u003cp>お手本の構成を参考にして、自分の中身で作ること\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>TTPS\u003c/p>\u003c/td>\u003ctd>\u003cp>「徹底的にパクって進化させる」の略。モデリングの考え方（第3章）\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>ブランディング\u003c/p>\u003c/td>\u003ctd>\u003cp>「この人といえば〇〇」と覚えてもらえるように、発信の方向や見せ方をそろえること\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"lesson-18-s3\">投稿づくり\u003c/h2>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>言葉\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>意味\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>フック\u003c/p>\u003c/td>\u003ctd>\u003cp>冒頭で指を止めてもらうための工夫（第5章）\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>CTA\u003c/p>\u003c/td>\u003ctd>\u003cp>投稿の最後に入れる「保存してね」などの行動の呼びかけ\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>テロップ\u003c/p>\u003c/td>\u003ctd>\u003cp>動画に入れる文字\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>透かし（ウォーターマーク）\u003c/p>\u003c/td>\u003ctd>\u003cp>編集アプリのロゴなどが動画に入るもの（第6章）\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>Vlog\u003c/p>\u003c/td>\u003ctd>\u003cp>日常や仕事の様子を見せる動画\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>トークリール\u003c/p>\u003c/td>\u003ctd>\u003cp>カメラに向かって話すリール\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>アフレコ\u003c/p>\u003c/td>\u003ctd>\u003cp>撮影した映像に、あとから声を入れること\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"lesson-18-s4\">数字の言葉\u003c/h2>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>言葉\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>意味\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>インサイト\u003c/p>\u003c/td>\u003ctd>\u003cp>投稿やアカウントの数字を確認できる画面\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>閲覧数\u003c/p>\u003c/td>\u003ctd>\u003cp>投稿が表示された回数\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>リーチ\u003c/p>\u003c/td>\u003ctd>\u003cp>投稿が届いた人数\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>スキップ率\u003c/p>\u003c/td>\u003ctd>\u003cp>リールを冒頭3秒以内に飛ばした人の割合\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>平均視聴時間・視聴の維持\u003c/p>\u003c/td>\u003ctd>\u003cp>リールがどれくらい見られたか\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>保存率\u003c/p>\u003c/td>\u003ctd>\u003cp>投稿を見た人のうち、保存した人の割合\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>プロフィールアクセス率\u003c/p>\u003c/td>\u003ctd>\u003cp>投稿を見た人のうち、プロフィールを見に来た人の割合\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>フォロー率\u003c/p>\u003c/td>\u003ctd>\u003cp>プロフィールを見た人のうち、フォローした人の割合\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>エンゲージメント\u003c/p>\u003c/td>\u003ctd>\u003cp>いいね・コメント・保存・シェアなど、投稿への反応\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>KPI\u003c/p>\u003c/td>\u003ctd>\u003cp>目標に向かって進んでいるかを測る数字\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>PDCA\u003c/p>\u003c/td>\u003ctd>\u003cp>計画 → 実行 → 確認 → 改善をくり返すこと（第7章の週の振り返り）\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"lesson-18-s5\">つながる・価値を届ける\u003c/h2>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>言葉\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>意味\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>マネタイズ\u003c/p>\u003c/td>\u003ctd>\u003cp>発信から収入を得ること\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>導線\u003c/p>\u003c/td>\u003ctd>\u003cp>投稿 → プロフィール → 公式LINE → 商品のような、お客さんがたどる道すじ\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>リスト\u003c/p>\u003c/td>\u003ctd>\u003cp>公式LINEなど、直接情報を届けられる人の名簿\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>リードマグネット（登録特典）\u003c/p>\u003c/td>\u003ctd>\u003cp>公式LINEに登録してくれた人に渡す無料の特典（第9章）\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>ステップ配信\u003c/p>\u003c/td>\u003ctd>\u003cp>登録後に自動で順番に届くメッセージ（第9章）\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>商品の階段\u003c/p>\u003c/td>\u003ctd>\u003cp>無料の特典から本命の商品までの価格の段階（第10章）\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>モニター価格\u003c/p>\u003c/td>\u003ctd>\u003cp>感想や実績をもらうことを条件にした、初回の価格\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>ローンチ\u003c/p>\u003c/td>\u003ctd>\u003cp>期間を区切ってまとめて商品を案内すること（第11章）\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>LP（募集ページ）\u003c/p>\u003c/td>\u003ctd>\u003cp>商品の説明と申し込みのためのページ\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>個別相談\u003c/p>\u003c/td>\u003ctd>\u003cp>高い商品の前に、1対1で話を聞く場\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>成約率\u003c/p>\u003c/td>\u003ctd>\u003cp>案内した人のうち、商品を選んだ人の割合\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"lesson-18-s6\">収入の種類\u003c/h2>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>言葉\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>意味\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>コンテンツ販売\u003c/p>\u003c/td>\u003ctd>\u003cp>自分の知識や経験を商品にして届けること\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>アフィリエイト\u003c/p>\u003c/td>\u003ctd>\u003cp>他の会社の商品を紹介して、購入につながった分の報酬をもらうこと\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>ASP\u003c/p>\u003c/td>\u003ctd>\u003cp>アフィリエイトを仲介するサービス\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>PR案件（タイアップ）\u003c/p>\u003c/td>\u003ctd>\u003cp>企業から報酬をもらって商品を紹介する投稿\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>運用代行\u003c/p>\u003c/td>\u003ctd>\u003cp>企業やお店のSNSを代わりに運用する仕事\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>TikTokショップ\u003c/p>\u003c/td>\u003ctd>\u003cp>TikTokの中で商品を買える機能\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>MEO\u003c/p>\u003c/td>\u003ctd>\u003cp>Googleマップでお店を見つけてもらうための対策\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"lesson-18-s7\">法律・リスク\u003c/h2>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>言葉\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>意味\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>薬機法\u003c/p>\u003c/td>\u003ctd>\u003cp>化粧品や健康食品などの効果の表現を定めた法律\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>景品表示法\u003c/p>\u003c/td>\u003ctd>\u003cp>大げさな表示や、実際より良く見せる表示を規制する法律\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>ステマ規制\u003c/p>\u003c/td>\u003ctd>\u003cp>広告であることを隠した宣伝への規制\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>PR表記\u003c/p>\u003c/td>\u003ctd>\u003cp>広告であることを示す表示（#PR、タイアップ投稿のラベルなど）\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>なりすまし\u003c/p>\u003c/td>\u003ctd>\u003cp>他人になりすました偽のアカウント\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"lesson-18-s8\">POTEXの言葉\u003c/h2>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>言葉\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>意味\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>ゴールナビ\u003c/p>\u003c/td>\u003ctd>\u003cp>アプリで行う事前ワーク（Mission・Vision・Planning）\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>人生の憲法（Mission Statement）\u003c/p>\u003c/td>\u003ctd>\u003cp>「どうありたいか」を言葉にしたもの\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>現在地診断（Status Checker）\u003c/p>\u003c/td>\u003ctd>\u003cp>今の生活・状態を可視化するワーク\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>習慣クエスト\u003c/p>\u003c/td>\u003ctd>\u003cp>初回セッションでコーチと決める、毎日の習慣\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>POTEX宣言／SNS宣言\u003c/p>\u003c/td>\u003ctd>\u003cp>「〇〇のために、〇〇を達成する」の形で書く自分への宣言\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>腹落ち度\u003c/p>\u003c/td>\u003ctd>\u003cp>書いた内容がどれくらいしっくり来ているか（1〜10）\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>", "text": "教科書に出てくる言葉を、分野ごとにまとめました。わからない言葉があったら、ここで確認してください。\nSNS運用の基本\n言葉\n意味\nアルゴリズム\n投稿を誰に、どれだけ見せるかを決めるSNSの仕組み\nリール\nInstagramの縦型の短い動画。フォロワー以外にも届きやすい\nフィード\nプロフィールに並ぶ通常の投稿（画像や動画）\nカルーセル\n複数枚の画像を横にめくって見る投稿\nストーリーズ\n24時間で消える投稿。フォロワーとの関係づくりに使う\nハイライト\nストーリーズをプロフィールに残しておける機能（丸いアイコン）\nプロフィールリンク\nプロフィールに貼れる外部サイトへのリンク\nトライアルリール\nフォロワー以外にだけ試しに出せるリール\nハッシュタグ\n「#」をつけた言葉。投稿のテーマを示す\n戦略・設計\n言葉\n意味\n3C分析\n自分・市場（見る人）・競合の3つから「勝てる場所」を考える方法（第2章）\nペルソナ\n発信を届けたい理想のお客さん像（第4章）\nコンセプト\n「誰の、どんな悩みを、どう解決する」アカウントか（第4章）\nベンチマーク\nお手本にするアカウント（第3章）\nモデリング\nお手本の構成を参考にして、自分の中身で作ること\nTTPS\n「徹底的にパクって進化させる」の略。モデリングの考え方（第3章）\nブランディング\n「この人といえば〇〇」と覚えてもらえるように、発信の方向や見せ方をそろえること\n投稿づくり\n言葉\n意味\nフック\n冒頭で指を止めてもらうための工夫（第5章）\nCTA\n投稿の最後に入れる「保存してね」などの行動の呼びかけ\nテロップ\n動画に入れる文字\n透かし（ウォーターマーク）\n編集アプリのロゴなどが動画に入るもの（第6章）\nVlog\n日常や仕事の様子を見せる動画\nトークリール\nカメラに向かって話すリール\nアフレコ\n撮影した映像に、あとから声を入れること\n数字の言葉\n言葉\n意味\nインサイト\n投稿やアカウントの数字を確認できる画面\n閲覧数\n投稿が表示された回数\nリーチ\n投稿が届いた人数\nスキップ率\nリールを冒頭3秒以内に飛ばした人の割合\n平均視聴時間・視聴の維持\nリールがどれくらい見られたか\n保存率\n投稿を見た人のうち、保存した人の割合\nプロフィールアクセス率\n投稿を見た人のうち、プロフィールを見に来た人の割合\nフォロー率\nプロフィールを見た人のうち、フォローした人の割合\nエンゲージメント\nいいね・コメント・保存・シェアなど、投稿への反応\nKPI\n目標に向かって進んでいるかを測る数字\nPDCA\n計画 → 実行 → 確認 → 改善をくり返すこと（第7章の週の振り返り）\nつながる・価値を届ける\n言葉\n意味\nマネタイズ\n発信から収入を得ること\n導線\n投稿 → プロフィール → 公式LINE → 商品のような、お客さんがたどる道すじ\nリスト\n公式LINEなど、直接情報を届けられる人の名簿\nリードマグネット（登録特典）\n公式LINEに登録してくれた人に渡す無料の特典（第9章）\nステップ配信\n登録後に自動で順番に届くメッセージ（第9章）\n商品の階段\n無料の特典から本命の商品までの価格の段階（第10章）\nモニター価格\n感想や実績をもらうことを条件にした、初回の価格\nローンチ\n期間を区切ってまとめて商品を案内すること（第11章）\nLP（募集ページ）\n商品の説明と申し込みのためのページ\n個別相談\n高い商品の前に、1対1で話を聞く場\n成約率\n案内した人のうち、商品を選んだ人の割合\n収入の種類\n言葉\n意味\nコンテンツ販売\n自分の知識や経験を商品にして届けること\nアフィリエイト\n他の会社の商品を紹介して、購入につながった分の報酬をもらうこと\nASP\nアフィリエイトを仲介するサービス\nPR案件（タイアップ）\n企業から報酬をもらって商品を紹介する投稿\n運用代行\n企業やお店のSNSを代わりに運用する仕事\nTikTokショップ\nTikTokの中で商品を買える機能\nMEO\nGoogleマップでお店を見つけてもらうための対策\n法律・リスク\n言葉\n意味\n薬機法\n化粧品や健康食品などの効果の表現を定めた法律\n景品表示法\n大げさな表示や、実際より良く見せる表示を規制する法律\nステマ規制\n広告であることを隠した宣伝への規制\nPR表記\n広告であることを示す表示（#PR、タイアップ投稿のラベルなど）\nなりすまし\n他人になりすました偽のアカウント\nPOTEXの言葉\n言葉\n意味\nゴールナビ\nアプリで行う事前ワーク（Mission・Vision・Planning）\n人生の憲法（Mission Statement）\n「どうありたいか」を言葉にしたもの\n現在地診断（Status Checker）\n今の生活・状態を可視化するワーク\n習慣クエスト\n初回セッションでコーチと決める、毎日の習慣\nPOTEX宣言／SNS宣言\n「〇〇のために、〇〇を達成する」の形で書く自分への宣言\n腹落ち度\n書いた内容がどれくらいしっくり来ているか（1〜10）", "minutes": 4}, {"id": "lesson-19", "title": "付録 最新情報", "group": "付録・おわりに", "headings": [{"id": "lesson-19-s1", "title": "Instagram", "level": 2}, {"id": "lesson-19-s2", "title": "そのほかの媒体", "level": 2}, {"id": "lesson-19-s3", "title": "ツール・サービス", "level": 2}, {"id": "lesson-19-s4", "title": "法律・ルール", "level": 2}], "html": "\u003cp>SNSの仕組みや料金など、時期で変わる情報をまとめたページです。本文で「※最新情報を確認」とある場所は、ここを見てください。内容は定期的に見直します。\u003c/p>\n\u003ch2 id=\"lesson-19-s1\">Instagram\u003c/h2>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>項目\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>内容（要確認）\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>本文の場所\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>最終確認日\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>ハッシュタグ\u003c/p>\u003c/td>\u003ctd>\u003cp>1投稿5個まで\u003c/p>\u003c/td>\u003ctd>\u003cp>第7章\u003c/p>\u003c/td>\u003ctd>\u003cp>未確認\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>トライアルリール\u003c/p>\u003c/td>\u003ctd>\u003cp>フォロワー以外にだけ試しに公開できるリール\u003c/p>\u003c/td>\u003ctd>\u003cp>第7章\u003c/p>\u003c/td>\u003ctd>\u003cp>未確認\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>表示名・ユーザーネームの変更\u003c/p>\u003c/td>\u003ctd>\u003cp>14日間で2回まで\u003c/p>\u003c/td>\u003ctd>\u003cp>第4章\u003c/p>\u003c/td>\u003ctd>\u003cp>未確認\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>投稿画像のサイズ\u003c/p>\u003c/td>\u003ctd>\u003cp>縦長（横4：縦5）。プロフィールの一覧では切り取られて表示される\u003c/p>\u003c/td>\u003ctd>\u003cp>第6章\u003c/p>\u003c/td>\u003ctd>\u003cp>未確認\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>PR表記の機能\u003c/p>\u003c/td>\u003ctd>\u003cp>「タイアップ投稿」のラベル\u003c/p>\u003c/td>\u003ctd>\u003cp>関所\u003c/p>\u003c/td>\u003ctd>\u003cp>未確認\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"lesson-19-s2\">そのほかの媒体\u003c/h2>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>項目\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>内容（要確認）\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>本文の場所\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>最終確認日\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>YouTubeの収益化の条件\u003c/p>\u003c/td>\u003ctd>\u003cp>広告収入：登録者1,000人＋直近12か月の総再生時間4,000時間、または登録者1,000人＋直近90日のショート視聴回数1,000万回。登録者500人の段階ではメンバーシップなどの機能が使える\u003c/p>\u003c/td>\u003ctd>\u003cp>第1章\u003c/p>\u003c/td>\u003ctd>\u003cp>未確認\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>YouTubeの広告単価\u003c/p>\u003c/td>\u003ctd>\u003cp>1再生0.5円前後が目安（ジャンルで変わる）\u003c/p>\u003c/td>\u003ctd>\u003cp>第1章\u003c/p>\u003c/td>\u003ctd>\u003cp>未確認\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>noteの価格帯\u003c/p>\u003c/td>\u003ctd>\u003cp>100円から設定可能。100円＝気軽に買われやすい、300円＝フォロワー数に比例しやすい、500円＝しっかり読んでもらえる、980円＝刺されば動く\u003c/p>\u003c/td>\u003ctd>\u003cp>第1章\u003c/p>\u003c/td>\u003ctd>\u003cp>未確認\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>TikTokショップ\u003c/p>\u003c/td>\u003ctd>\u003cp>参入が増えている。単価は低め（報酬の相場・手数料は要調査）\u003c/p>\u003c/td>\u003ctd>\u003cp>第1章・発展編\u003c/p>\u003c/td>\u003ctd>\u003cp>未確認\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cp>公式LINE\u003c/p>\u003c/td>\u003ctd>\u003cp>料金プランと配信できる通数の上限（要調査）\u003c/p>\u003c/td>\u003ctd>\u003cp>第9章\u003c/p>\u003c/td>\u003ctd>\u003cp>未確認\u003c/p>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"lesson-19-s3\">ツール・サービス\u003c/h2>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"教材の表\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003cp>項目\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>内容（要確認）\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>本文の場所\u003c/p>\u003c/th>\u003cth scope=\"col\">\u003cp>最終確認日\u003c/p>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cp>販売・決済のサービス\u003c/p>\u003c/td>\u003ctd>\u003cp>Brain・Tips・Stripeなどの手数料と審査（要調査）\u003c/p>\u003c/td>\u003
